<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CheckThisPhone.com - Universal Android Diagnostic Standard">
    <title>CheckThisPhone.com | Universal Phone Check</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-dark: #1e293b;
            --surface-dark: #334155;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: rgba(255,255,255,0.08);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .app-container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            margin-top: 20px;
            animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            margin-bottom: 50px;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* BRANDING */
        .brand-header {
            text-align: center;
            margin-bottom: 40px; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .brand-logo-img {
            width: 100%;             
            max-width: 600px;        
            height: auto;            
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0 0 35px var(--accent-glow)); 
        }

        .view-section { display: none; width: 100%; }
        .view-section.active { display: block; animation: fadeIn 0.4s ease-out; }

        /* BENTO GRID - DIAGNOSTICS */
        .bento-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .bento-card {
            background: var(--surface-dark);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 20px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 140px;
        }
        .bento-card:hover { 
            border-color: var(--accent); 
            background: #243045; 
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .card-icon { font-size: 32px; display: block; margin-bottom: 10px; }
        .card-title { font-weight: 700; font-size: 15px; color: var(--text-main); margin-bottom: 5px; }
        .card-sub { font-size: 11px; color: var(--text-dim); line-height: 1.4; }

        /* SEARCH BAR */
        .search-container {
            background: var(--panel-dark);
            border-radius: 24px;
            padding: 8px;
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            margin-top: 10px;
            margin-bottom: 40px;
        }
        
        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 12px 20px;
            font-size: 18px;
            font-weight: 600;
            outline: none;
            font-family: 'JetBrains Mono', monospace;
        }

        /* 4-TIER COMPARISON GRID */
        .comparison-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }
        
        /* Checkout Specific Grid */
        .panel-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
            margin-bottom: 40px;
        }

        .comp-panel {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
            position: relative;
        }
        .comp-panel:hover { transform: translateY(-3px); }

        /* Tier Styles */
        .comp-panel.tier-basic { /* $1.49 */
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.05), rgba(15, 23, 42, 0.4));
            border-color: rgba(59, 130, 246, 0.3);
        }
        
        .comp-panel.tier-premium { /* $4.99 */
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.08), rgba(15, 23, 42, 0.6));
            border-color: rgba(245, 158, 11, 0.4);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            display: none; /* Hidden by default, toggled via JS */
        }
        .comp-panel.tier-premium::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
        }

        .comp-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .comp-title { font-size: 18px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .comp-price-tag { margin-left: auto; font-family: 'JetBrains Mono'; font-weight: 700; font-size: 20px; opacity: 0.9; }
        
        .comp-list { margin: 0; padding: 0; list-style: none; flex-grow: 1; }
        
        .comp-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 15px;
            line-height: 1.5;
        }
        
        .comp-item b { color: var(--text-main); display: block; font-size: 13px; margin-bottom: 2px; font-weight: 700; }
        .comp-icon { font-size: 16px; min-width: 20px; text-align: center; margin-top: 1px; }

        .includes-badge {
            font-size: 10px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            margin-bottom: 15px;
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(255,255,255,0.05);
        }

        /* BUTTONS */
        .btn { padding: 14px 20px; border-radius: 14px; font-weight: 800; cursor: pointer; border: none; font-size: 14px; transition: 0.2s; width: 100%; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 20px; text-decoration: none; }
        .btn-free { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #ffffff; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
        .btn-primary { background: var(--accent); color: white; box-shadow: 0 4px 15px var(--accent-glow); }
        .btn-gold { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); }
        .price-badge { margin-left: auto; font-size: 16px; font-weight: 800; }
        
        /* HIDE PREMIUM BUTTONS BY DEFAULT */
        .apple-only-btn { display: none; }

        /* SYSTEM & NAV */
        .input-group { background: var(--panel-dark); border: 1px solid var(--border); padding: 25px; border-radius: 24px; margin-bottom: 20px; }
        .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .back-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        
        @media (max-width: 850px) {
            .comparison-container { grid-template-columns: 1fr; }
            .bento-grid { grid-template-columns: 1fr 1fr; }
        }

        /* SCORES & REPORTS */
        .score-display { position: absolute; top: 25px; right: 25px; text-align: right; }
        .big-score { font-size: 42px; font-weight: 800; color: var(--success); line-height: 1; }
        .report-paper { background: white; color: #0f172a; width: 100%; padding: 40px; border-radius: 12px; }
        
        /* DATA TABLE IN REPORT */
        .report-data-table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        .report-data-table td {
            padding: 12px 0;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }
        .report-label { color: #64748b; font-weight: 600; width: 140px; }
        .report-value { color: #0f172a; font-weight: 700; text-align: right; }
