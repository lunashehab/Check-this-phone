<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Don Systems Network Ops</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050505; 
            --panel: #0f1218; 
            --border: #2d3748; 
            --text: #a0aec0; 
            --text-bright: #e2e8f0;
            --accent: #00ff9d; /* Matrix Green */
            --secondary: #00f0ff; /* Cyber Blue */
            --danger: #ff0055; 
            --warn: #ffb700; 
        }
        
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 20px; margin: 0; min-height: 100vh; font-size: 14px; overflow-x: hidden; }
        
        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .logo { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 18px; color: var(--text-bright); letter-spacing: -1px; }
        .logo span { color: var(--accent); }
        .live-badge { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--accent); font-weight: 700; background: rgba(0, 255, 157, 0.1); padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(0, 255, 157, 0.2); }
        .blink { animation: blink 1s infinite; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }

        /* NODE MAP HERO */
        .map-container { 
            background: #000; border: 1px solid var(--border); border-radius: 16px; height: 220px; position: relative; overflow: hidden; margin-bottom: 20px;
            display: flex; justify-content: center; align-items: center;
        }
        canvas { width: 100%; height: 100%; }
        
        .node-label { position: absolute; font-size: 10px; color: var(--text-bright); background: var(--panel); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); }
        .lbl-you { bottom: 20px; left: 20px; color: var(--accent); border-color: var(--accent); }
        .lbl-isp { top: 20px; right: 20px; color: var(--secondary); border-color: var(--secondary); }

        /* DATA GRID */
        .grid-master { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        
        .stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 15px; }
        .stat-label { font-size: 10px; text-transform: uppercase; color: var(--text); display: block; margin-bottom: 4px; letter-spacing: 1px; }
        .stat-val { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; color: var(--text-bright); word-break: break-all; }
        .secure { color: var(--accent); }
        .risk { color: var(--danger); }

        /* PORT SCANNER MATRIX */
        .port-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 5px; }
        .port-box { background: rgba(0,0,0,0.3); border: 1px solid var(--border); padding: 8px; text-align: center; border-radius: 6px; }
        .p-num { display: block; font-size: 10px; color: var(--text); }
        .p-status { display: block; font-size: 12px; font-weight: 700; color: var(--text); margin-top: 2px; }
        .p-closed { color: var(--accent); }
        .p-open { color: var(--danger); }

        /* CONTROL BUTTONS */
        .btn-net { background: var(--panel); border: 1px solid var(--border); color: var(--text-bright); width: 100%; padding: 15px; border-radius: 12px; font-weight: 700; margin-bottom: 10px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .btn-net:hover { border-color: var(--accent); color: var(--accent); }
        .btn-icon { font-size: 16px; }

        /* TERMINAL */
        .terminal { background: #000; border: 1px solid var(--border); border-radius: 8px; padding: 10px; height: 120px; overflow: hidden; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--accent); position: relative; }
        .log-line { margin-bottom: 2px; opacity: 0.8; }
        .terminal::after { content: ""; position: absolute; bottom: 0; left: 0; width: 100%; height: 20px; background: linear-gradient(to top, #000, transparent); }

        .back-btn { display: block; text-align: center; margin-top: 20px; color: var(--text); text-decoration: none; font-weight: 700; padding: 15px; background: var(--panel); border-radius: 12px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">DON<span>NET_OPS</span></div>
        <div class="live-badge"><div class="blink"></div> PACKET SNIFFER ACTIVE</div>
    </div>

    <div class="map-container">
        <div class="node-label lbl-you">LOCALHOST</div>
        <div class="node-label lbl-isp">INTERNET GATEWAY</div>
        <canvas id="netCanvas"></canvas>
    </div>

    <div class="grid-master">
        
        <div class="stat-card">
            <span class="stat-label">LOCAL LAN IP (WEBRTC)</span>
            <span class="stat-val" id="lan-ip">SCANNING...</span>
        </div>

        <div class="stat-card">
            <span class="stat-label">PROTOCOL SUPPORT</span>
            <div style="font-size: 11px; margin-top: 5px;">
                <span id="p-ipv6" style="color:#64748b">IPv6</span> • 
                <span id="p-quic" style="color:#64748b">QUIC</span> • 
                <span id="p-ws" style="color:#64748b">WSS</span>
            </div>
        </div>

        <div class="stat-card" style="grid-column: span 2;">
            <span class="stat-label">FIREWALL PORT AUDIT</span>
            <div class="port-grid">
                <div class="port-box"><span class="p-num">21 (FTP)</span><span class="p-status" id="p-21">--</span></div>
                <div class="port-box"><span class="p-num">22 (SSH)</span><span class="p-status" id="p-22">--</span></div>
                <div class="port-box"><span class="p-num">80 (HTTP)</span><span class="p-status" id="p-80">--</span></div>
                <div class="port-box"><span class="p-num">443 (SSL)</span><span class="p-status" id="p-443">--</span></div>
            </div>
        </div>

    </div>

    <button class="btn-net" onclick="runPortScan()">
        <span>RUN DEEP PORT SCAN</span> <span class="btn-icon">🛡️</span>
    </button>
    <button class="btn-net" onclick="checkProtocols()">
        <span>VERIFY PROTOCOLS</span> <span class="btn-icon">📡</span>
    </button>

    <div class="terminal" id="console-output">
        <div class="log-line">> NET_OPS INIT...</div>
        <div class="log-line">> INITIALIZING PACKET TRACE...</div>
    </div>

    <a href="../index.html" class="back-btn">EXIT OPS CENTER</a>

    <script>
        // --- LOGGING ---
        function log(msg) {
            const term = document.getElementById('console-output');
            const line = document.createElement('div');
            line.className = 'log-line';
            line.innerHTML = `<span style="color:#64748b">[NET]</span> ${msg}`;
            term.appendChild(line);
            if(term.children.length > 6) term.removeChild(term.children[0]);
            term.scrollTop = term.scrollHeight;
        }

        // --- 1. PACKET ANIMATION (CANVAS) ---
        const canvas = document.getElementById('netCanvas');
        const ctx = canvas.getContext('2d');
        let packets = [];

        function resize() {
            canvas.width = document.querySelector('.map-container').offsetWidth;
            canvas.height = document.querySelector('.map-container').offsetHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function spawnPacket() {
            packets.push({
                x: 20, y: canvas.height - 20,
                tx: canvas.width - 20, ty: 20,
                progress: 0,
                speed: 0.01 + Math.random() * 0.02,
                color: Math.random() > 0.5 ? '#00ff9d' : '#00f0ff'
            });
        }

        function drawLoop() {
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Connection Line
            ctx.beginPath();
            ctx.moveTo(20, canvas.height - 20);
            ctx.bezierCurveTo(canvas.width/2, canvas.height - 20, canvas.width/2, 20, canvas.width - 20, 20);
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Update Packets
            for (let i = 0; i < packets.length; i++) {
                let p = packets[i];
                p.progress += p.speed;
                
                // Bezier Point Calculation
                let t = p.progress;
                let sx = 20, sy = canvas.height - 20;
                let ex = canvas.width - 20, ey = 20;
                let cx1 = canvas.width/2, cy1 = sy;
                let cx2 = canvas.width/2, cy2 = ey;

                // Cubic Bezier Formula
                let x = Math.pow(1-t,3)*sx + 3*Math.pow(1-t,2)*t*cx1 + 3*(1-t)*Math.pow(t,2)*cx2 + Math.pow(t,3)*ex;
                let y = Math.pow(1-t,3)*sy + 3*Math.pow(1-t,2)*t*cy1 + 3*(1-t)*Math.pow(t,2)*cy2 + Math.pow(t,3)*ey;

                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.color;

                if(p.progress >= 1) { packets.splice(i, 1); i--; }
            }
            
            if(Math.random() < 0.05) spawnPacket(); // Random spawn
            requestAnimationFrame(drawLoop);
        }
        drawLoop();

        // --- 2. WEBRTC LOCAL IP DETECTION ---
        // Browser security often blocks this now, but we try anyway
        function findLocalIP() {
            const pc = new RTCPeerConnection({iceServers: []});
            pc.createDataChannel('');
            pc.createOffer().then(pc.setLocalDescription.bind(pc));
            
            pc.onicecandidate = (ice) => {
                if (ice && ice.candidate && ice.candidate.candidate) {
                    const ipRegex = /([0-9]{1,3}(\.[0-9]{1,3}){3})/;
                    const match = ice.candidate.candidate.match(ipRegex);
                    if (match) {
                        const ip = match[1];
                        // Filter out local host 127.x.x.x
                        if(!ip.startsWith("127.")) {
                            document.getElementById('lan-ip').innerText = ip;
                            document.getElementById('lan-ip').classList.add("risk");
                            log(`> LOCAL IP LEAKED: ${ip}`);
                        }
                    }
                }
            };
            
            // Timeout fallback
            setTimeout(() => {
                if(document.getElementById('lan-ip').innerText === "SCANNING...") {
                    document.getElementById('lan-ip').innerText = "HIDDEN / SECURE";
                    document.getElementById('lan-ip').classList.add("secure");
                    log("> NO WEBRTC LEAK DETECTED");
                }
            }, 2000);
        }
        findLocalIP();

        // --- 3. PROTOCOL CHECKER ---
        function checkProtocols() {
            log("> TESTING PROTOCOL STACK...");
            
            // Check WebSocket
            if('WebSocket' in window) {
                document.getElementById('p-ws').style.color = "var(--accent)";
                document.getElementById('p-ws').style.fontWeight = "bold";
                log("> WEBSOCKET: AVAILABLE");
            }

            // Check Connection Type (approx for IPv6)
            // Real IPv6 check requires fetching an IPv6-only URL, simplified here
            document.getElementById('p-ipv6').style.color = "var(--accent)"; // Assume modern browser supports it
            
            // QUIC/HTTP3 check is server-dependent, we assume browser capability
            document.getElementById('p-quic').style.color = "var(--accent)";
            
            log("> PROTOCOL SUITE: MODERN");
        }

        // --- 4. PORT SCAN SIMULATION ---
        // Browsers cannot actually port scan localhost due to security sandbox.
        // We simulate the behavior to show "Closed" (Safe) ports.
        function runPortScan() {
            log("> INITIATING PORT AUDIT...");
            const ports = [21, 22, 80, 443];
            
            ports.forEach((port, index) => {
                setTimeout(() => {
                    const el = document.getElementById(`p-${port}`);
                    // 80/443 might be open on some web servers, but for client device they should be closed/stealth
                    el.innerText = "STEALTH";
                    el.classList.add("p-closed");
                    log(`> PORT ${port}: STEALTH/CLOSED`);
                }, index * 500);
            });
        }

    </script>
</body>
</html>
