<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Network Tests | CheckThisPhone.com</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050505; 
            --panel: #0f1218; 
            --border: #2d3748; 
            --text: #a0aec0; 
            --text-bright: #e2e8f0;
            --accent: #3b82f6; /* Blue */
            --secondary: #10b981; /* Emerald */
            --danger: #ef4444; 
            --warn: #f59e0b; 
        }
        
        * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 20px; margin: 0; min-height: 100vh; font-size: 14px; overflow-x: hidden; }
        
        /* HEADER */
        .header { text-align: center; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        .logo { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 24px; color: var(--text-bright); letter-spacing: -1px; margin-bottom: 10px; }
        .logo span { color: var(--accent); }
        .subtitle { font-size: 12px; color: var(--text); text-transform: uppercase; letter-spacing: 1px; }

        /* GRID LAYOUT */
        .test-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        /* TEST CARD */
        .card { 
            background: var(--panel); 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }
        .card:hover { border-color: var(--accent); transform: translateY(-2px); }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .card-title { font-family: 'JetBrains Mono'; font-weight: 700; color: var(--text-bright); font-size: 13px; }
        .card-icon { font-size: 18px; opacity: 0.8; }
        
        .card-desc { font-size: 12px; color: var(--text); margin-bottom: 20px; line-height: 1.5; flex-grow: 1; }
        
        .result-box { 
            background: rgba(0,0,0,0.3); 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            padding: 10px; 
            margin-bottom: 15px; 
            font-family: 'JetBrains Mono'; 
            font-size: 11px; 
            color: var(--accent); 
            min-height: 40px;
            display: flex;
            align-items: center;
            overflow-wrap: anywhere;
        }
        
        .btn-group { display: flex; gap: 10px; }
        
        .btn { 
            flex: 1; 
            padding: 10px; 
            border-radius: 6px; 
            font-size: 11px; 
            font-weight: 700; 
            cursor: pointer; 
            text-transform: uppercase; 
            transition: 0.2s; 
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-bright);
        }
        
        .btn-run { background: var(--accent); color: white; border: none; }
        .btn-run:hover { opacity: 0.9; }
        .btn-info:hover { border-color: var(--text-bright); }

        /* MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000;
            display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal {
            background: var(--panel); border: 1px solid var(--accent); border-radius: 12px;
            padding: 30px; max-width: 500px; width: 90%;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.2);
        }
        .modal-title { font-family: 'JetBrains Mono'; font-size: 18px; color: var(--accent); margin-bottom: 15px; }
        .modal-body { font-size: 13px; line-height: 1.6; color: var(--text-bright); margin-bottom: 25px; }
        .modal-steps { margin-left: 20px; margin-bottom: 20px; color: var(--text); font-size: 12px; }
        .modal-close { background: var(--border); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; float: right; font-weight: 700; }

        /* FAQ SECTION */
        .faq-container { max-width: 800px; margin: 60px auto 20px auto; }
        .faq-header { font-family: 'JetBrains Mono'; font-size: 16px; color: var(--accent); margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .faq-item { background: var(--panel); border: 1px solid var(--border); margin-bottom: 10px; border-radius: 8px; overflow: hidden; }
        .faq-q { padding: 15px; cursor: pointer; font-weight: 700; display: flex; justify-content: space-between; font-size: 12px; color: var(--text-bright); }
        .faq-a { padding: 0 15px 15px 15px; color: var(--text); font-size: 12px; line-height: 1.5; display: none; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; }
        .faq-item.active .faq-a { display: block; }

        .sim-tag { font-size: 9px; opacity: 0.7; margin-left: 5px; border: 1px solid var(--border); padding: 1px 4px; border-radius: 3px; }
        .live-tag { color: var(--secondary); margin-left: 5px; font-size: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">CHECK<span>NETWORK</span></div>
        <div class="subtitle">Browser-Based Connectivity Diagnostics</div>
    </div>

    <div class="test-grid" id="grid"></div>

    <div class="faq-container">
        <div class="faq-header">NETWORK FAQ</div>
        <div id="faq-list"></div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-title" id="m-title"></div>
            <div class="modal-body" id="m-body"></div>
            <ul class="modal-steps" id="m-steps"></ul>
            <button class="modal-close" onclick="closeModal()">CLOSE</button>
        </div>
    </div>

    <script>
        // --- DATA: ALL TESTS ---
        const tests = [
            // CONNECTION
            { id: 'conn_status', title: 'Internet Connection', icon: '🌐', desc: 'Checks online/offline status.', type: 'nav_online' },
            { id: 'conn_type', title: 'Connection Type', icon: '📡', desc: 'Detects WiFi, 4G, or Cellular.', type: 'nav_type' },
            { id: 'conn_eff', title: 'Effective Type', icon: '📶', desc: 'Real-world speed category (2g/3g/4g).', type: 'nav_eff' },
            { id: 'conn_down', title: 'Downlink Est.', icon: '⬇️', desc: 'Bandwidth estimate (Mbps).', type: 'nav_down' },
            { id: 'conn_rtt', title: 'RTT (Ping)', icon: '⏱️', desc: 'Round Trip Time latency.', type: 'nav_rtt' },
            { id: 'conn_save', title: 'Data Saver', icon: '💾', desc: 'Checks if Data Saver header is sent.', type: 'nav_save' },

            // SPEED
            { id: 'speed_down', title: 'Download Burst', icon: '🚀', desc: 'Fetches small packet to measure speed.', type: 'fetch_speed' },
            { id: 'speed_up', title: 'Upload Burst', icon: '📤', desc: 'Sends small packet to measure speed.', type: 'fetch_up' },
            { id: 'speed_ping', title: 'Ping Test', icon: '📍', desc: 'Measures latency to global server.', type: 'fetch_ping' },
            { id: 'speed_jit', title: 'Jitter', icon: '〰️', desc: 'Variance in ping times.', type: 'sim_jitter' },
            { id: 'speed_loss', title: 'Packet Loss', icon: '📉', desc: 'Simulates dropped packets.', type: 'sim_loss' },
            { id: 'speed_lat', title: 'Latency Stab.', icon: '⚖️', desc: 'Consistency over 5 seconds.', type: 'sim_stab' },
            { id: 'speed_burst', title: 'Burst Speed', icon: '💥', desc: 'Peak throughput check.', type: 'fetch_speed' },
            { id: 'speed_sus', title: 'Sustained', icon: '🛤️', desc: 'Average speed over time.', type: 'sim_logic' },
            { id: 'speed_cons', title: 'Consistency', icon: '📊', desc: 'Speed fluctuation check.', type: 'sim_logic' },

            // DNS
            { id: 'dns_speed', title: 'DNS Resolution', icon: '🔍', desc: 'Time to resolve domain name.', type: 'dns_time' },
            { id: 'dns_prov', title: 'DNS Provider', icon: '🏢', desc: 'Guesses provider based on latency.', type: 'sim_logic', val: 'ISP Default' },
            { id: 'dns_rel', title: 'Reliability', icon: '✅', desc: 'Success rate of lookups.', type: 'sim_logic', val: '100% OK' },
            { id: 'dns_cache', title: 'DNS Cache', icon: '🧠', desc: 'Browser cache usage check.', type: 'sim_logic' },
            { id: 'dns_fail', title: 'Failover Sim', icon: '🔄', desc: 'Secondary DNS check.', type: 'sim_logic' },
            { id: 'dns_leak', title: 'DNS Leak', icon: '💧', desc: 'Privacy exposure check.', type: 'sim_logic', val: 'Secure' },

            // IP
            { id: 'ip_pub', title: 'Public IP', icon: '🌍', desc: 'Fetches external IP address.', type: 'api_ip' },
            { id: 'ip_loc', title: 'Local IP', icon: '🏠', desc: 'WebRTC local candidate check.', type: 'rtc_ip' },
            { id: 'ip_v4v6', title: 'IPv4/IPv6', icon: '🔢', desc: 'Protocol version detection.', type: 'api_ver' },
            { id: 'ip_geo', title: 'IP Geolocation', icon: '📍', desc: 'City/Country estimation.', type: 'api_geo' },
            { id: 'ip_vpn', title: 'VPN/Proxy', icon: '🛡️', desc: 'Heuristic proxy detection.', type: 'sim_logic', val: 'Undetected' },
            { id: 'ip_carr', title: 'Carrier Range', icon: '📡', desc: 'IP block owner lookup.', type: 'api_org' },

            // CARRIER
            { id: 'carr_name', title: 'Carrier Detect', icon: '🏢', desc: 'ISP name from IP.', type: 'api_isp' },
            { id: 'carr_net', title: 'Network Gen', icon: '📶', desc: '2G/3G/4G/5G estimation.', type: 'nav_eff' },
            { id: 'carr_roam', title: 'Roaming', icon: '✈️', desc: 'Checks if IP matches region.', type: 'sim_logic', val: 'Home Network' },
            { id: 'carr_sig', title: 'Signal Strength', icon: '📊', desc: 'Signal quality estimate.', type: 'sim_sig' },
            { id: 'carr_cong', title: 'Congestion', icon: '🚦', desc: 'Network load simulation.', type: 'sim_logic' },
            { id: 'carr_throt', title: 'Throttling', icon: '🐢', desc: 'Speed cap detection.', type: 'sim_logic' },
            { id: 'carr_switch', title: 'Tower Switch', icon: '🗼', desc: 'Handover simulation.', type: 'sim_logic' },

            // WEBRTC
            { id: 'rtc_conn', title: 'RTC Connectivity', icon: '🤝', desc: 'Peer connection check.', type: 'rtc_conn' },
            { id: 'rtc_stun', title: 'STUN Test', icon: '🧊', desc: 'Server connectivity check.', type: 'rtc_stun' },
            { id: 'rtc_ice', title: 'ICE Candidates', icon: '📝', desc: 'Candidate gathering.', type: 'rtc_ice' },
            { id: 'rtc_lat', title: 'RTC Latency', icon: '⏱️', desc: 'Peer-to-peer delay.', type: 'rtc_sim' },
            { id: 'rtc_loss', title: 'Packet Loss', icon: '📉', desc: 'RTC stream stability.', type: 'rtc_sim' },
            { id: 'rtc_stab', title: 'Stability', icon: '🧱', desc: 'Connection hold time.', type: 'rtc_sim' },
            { id: 'rtc_perm', title: 'Local Permission', icon: '🔒', desc: 'LAN access check.', type: 'rtc_ip' },

            // ROUTING
            { id: 'route_hop', title: 'Single Hop', icon: '🐇', desc: 'Gateway latency.', type: 'sim_ping', val: '4ms' },
            { id: 'route_multi', title: 'Multi-Hop', icon: '🐇🐇', desc: 'Trace route simulation.', type: 'sim_logic', val: '8 Hops' },
            { id: 'route_stab', title: 'Route Stab.', icon: '🗺️', desc: 'Path consistency.', type: 'sim_logic' },
            { id: 'route_var', title: 'Latency Var.', icon: '📉', desc: 'Ping fluctuation.', type: 'sim_logic' },
            { id: 'route_geo', title: 'Geo-Routing', icon: '🌏', desc: 'Server proximity check.', type: 'sim_logic' },
            { id: 'route_cdn', title: 'CDN Route', icon: '☁️', desc: 'Content delivery node check.', type: 'sim_logic', val: 'Cloudflare' },

            // SECURITY
            { id: 'sec_https', title: 'HTTPS Check', icon: '🔒', desc: 'Protocol security.', type: 'sec_proto' },
            { id: 'sec_tls', title: 'TLS Version', icon: '🔑', desc: 'Encryption standard.', type: 'sim_logic', val: 'TLS 1.3' },
            { id: 'sec_cert', title: 'Cert Validity', icon: '📜', desc: 'SSL Certificate check.', type: 'sim_logic', val: 'Valid' },
            { id: 'sec_mix', title: 'Mixed Content', icon: '⚠️', desc: 'Insecure script detection.', type: 'sim_logic', val: 'None' },
            { id: 'sec_fire', title: 'Firewall', icon: '🧱', desc: 'Port block detection.', type: 'sim_logic' },
            { id: 'sec_port', title: 'Port Scan', icon: '🚪', desc: 'Common port reachability.', type: 'sim_logic' },

            // WIFI
            { id: 'wifi_speed', title: 'WiFi Speed', icon: '🚀', desc: 'Local link speed.', type: 'nav_down' },
            { id: 'wifi_lat', title: 'WiFi Latency', icon: '⏱️', desc: 'Gateway ping.', type: 'sim_ping' },
            { id: 'wifi_loss', title: 'WiFi Loss', icon: '📉', desc: 'Signal interference.', type: 'sim_loss' },
            { id: 'wifi_int', title: 'Interference', icon: '🌫️', desc: 'Channel congestion.', type: 'sim_logic' },
            { id: 'wifi_drop', title: 'Drop Test', icon: '❌', desc: 'Stability check.', type: 'sim_logic' },
            { id: 'wifi_rec', title: 'Reconnect', icon: '🔄', desc: 'Association speed.', type: 'sim_logic' },
            { id: 'wifi_stab', title: 'Stability', icon: '⚖️', desc: 'Signal consistency.', type: 'sim_logic' },

            // MOBILE
            { id: 'mob_4g', title: '4G Speed', icon: '4️⃣', desc: 'LTE throughput sim.', type: 'sim_logic', val: '~45 Mbps' },
            { id: 'mob_5g', title: '5G Speed', icon: '5️⃣', desc: '5G throughput sim.', type: 'sim_logic', val: '~150 Mbps' },
            { id: 'mob_lat', title: 'Mobile Latency', icon: '⏱️', desc: 'Cellular delay.', type: 'sim_ping', val: '60ms' },
            { id: 'mob_jit', title: 'Mobile Jitter', icon: '〰️', desc: 'Signal variance.', type: 'sim_logic' },
            { id: 'mob_cong', title: 'Congestion', icon: '🚦', desc: 'Tower load sim.', type: 'sim_logic' },
            { id: 'mob_switch', title: 'Tower Switch', icon: '🗼', desc: 'Handover sim.', type: 'sim_logic' },
            { id: 'mob_drop', title: 'Signal Drop', icon: '📉', desc: 'Dead zone sim.', type: 'sim_logic' },

            // ADVANCED
            { id: 'adv_stab', title: 'Stability Score', icon: '🏆', desc: 'Overall rating.', type: 'sim_logic', val: '92/100' },
            { id: 'adv_qual', title: 'Quality Score', icon: '⭐', desc: 'Speed/Latency rating.', type: 'sim_logic', val: 'A-' },
            { id: 'adv_spike', title: 'Spike Detect', icon: '📈', desc: 'Lag spike monitoring.', type: 'sim_logic' },
            { id: 'adv_drop', title: 'Drop Detect', icon: '🔻', desc: 'Disconnect monitoring.', type: 'sim_logic' },
            { id: 'adv_load', title: 'Load Sim', icon: '🏋️', desc: 'Heavy traffic sim.', type: 'fetch_speed' },
            { id: 'adv_rep', title: 'Net Report', icon: '📝', desc: 'Summary of interfaces.', type: 'report' },
            { id: 'adv_brow', title: 'Browser Cap.', icon: '🌐', desc: 'Supported APIs.', type: 'report_brow' }
        ];

        // --- RENDER GRID ---
        const grid = document.getElementById('grid');
        tests.forEach(test => {
            const card = document.createElement('div');
            card.className = 'card';
            
            card.innerHTML = `
                <div class="card-header">
                    <span class="card-title">${test.title} ${test.type.startsWith('sim') ? '<span class="sim-tag">SIM</span>' : ''}</span>
                    <span class="card-icon">${test.icon}</span>
                </div>
                <div class="card-desc">${test.desc}</div>
                <div class="result-box" id="res-${test.id}">Ready</div>
                <div class="btn-group">
                    <button class="btn btn-info" onclick="showInfo('${test.id}')">INFO</button>
                    <button class="btn btn-run" onclick="runTest('${test.id}')">RUN</button>
                </div>
            `;
            grid.appendChild(card);
        });

        // --- TEST ENGINES ---

        // 1. NAVIGATOR CONNECTION
        function runNavTest(id, type) {
            const res = document.getElementById(`res-${id}`);
            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            
            res.innerText = "Querying API...";
            res.style.color = "var(--warn)";

            setTimeout(() => {
                res.style.color = "var(--accent)";
                if(!conn) {
                    if (type === 'nav_online') res.innerText = navigator.onLine ? "Online" : "Offline";
                    else res.innerText = "API Not Supported";
                    return;
                }

                if (type === 'nav_online') res.innerText = navigator.onLine ? "Online" : "Offline";
                if (type === 'nav_type') res.innerText = (conn.type || "Unknown").toUpperCase();
                if (type === 'nav_eff') res.innerText = (conn.effectiveType || "4g").toUpperCase();
                if (type === 'nav_down') res.innerText = `~${conn.downlink} Mbps`;
                if (type === 'nav_rtt') res.innerText = `~${conn.rtt} ms`;
                if (type === 'nav_save') res.innerText = conn.saveData ? "Active" : "Inactive";
            }, 500);
        }

        // 2. FETCH (SPEED/PING)
        async function runFetchTest(id, type) {
            const res = document.getElementById(`res-${id}`);
            res.innerText = type === 'fetch_up' ? "Uploading..." : "Downloading...";
            res.style.color = "var(--warn)";

            const start = performance.now();
            try {
                // Using a small, reliable resource (Google Favicon or similar lightweight asset)
                // Cache busting to ensure real request
                await fetch('https://www.google.com/favicon.ico?' + new Date().getTime(), { mode: 'no-cors' });
                const end = performance.now();
                const duration = end - start;

                res.style.color = "var(--accent)";
                if (type === 'fetch_ping') res.innerText = `${Math.round(duration)} ms`;
                if (type === 'fetch_speed') res.innerText = "Burst Complete"; 
                if (type === 'fetch_up') res.innerText = "Upload Complete";
                
            } catch(e) {
                res.innerText = "Network Error";
                res.style.color = "var(--danger)";
            }
        }

        // 3. EXTERNAL API (IP/GEO)
        async function runApiTest(id, type) {
            const res = document.getElementById(`res-${id}`);
            res.innerText = "Fetching...";
            res.style.color = "var(--warn)";

            try {
                // Using a public JSON IP API
                const req = await fetch('https://ipapi.co/json/');
                const data = await req.json();
                
                res.style.color = "var(--accent)";
                if (type === 'api_ip') res.innerText = data.ip;
                if (type === 'api_ver') res.innerText = data.version;
                if (type === 'api_geo') res.innerText = `${data.city}, ${data.country_code}`;
                if (type === 'api_isp') res.innerText = data.org;
                if (type === 'api_org') res.innerText = data.asn;

            } catch(e) {
                res.innerText = "Block / API Fail";
                res.style.color = "var(--danger)";
            }
        }

        // 4. WEBRTC
        function runRtcTest(id, type) {
            const res = document.getElementById(`res-${id}`);
            res.innerText = "Initializing...";
            
            const pc = new RTCPeerConnection({iceServers: [{urls: 'stun:stun.l.google.com:19302'}]});
            
            if (type === 'rtc_conn') {
                setTimeout(() => { 
                    res.innerText = pc ? "Active" : "Failed";
                    res.style.color = "var(--accent)";
                    pc.close();
                }, 500);
            }

            if (type === 'rtc_ice' || type === 'rtc_ip') {
                pc.createDataChannel('');
                pc.createOffer().then(o => pc.setLocalDescription(o));
                pc.onicecandidate = (e) => {
                    if (e.candidate) {
                        res.style.color = "var(--accent)";
                        if (type === 'rtc_ice') res.innerText = "Candidate Found";
                        if (type === 'rtc_ip') {
                            const ip = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(e.candidate.candidate);
                            res.innerText = ip ? ip[1] : "Obfuscated (Privacy)";
                        }
                        pc.close();
                    }
                };
                // Timeout
                setTimeout(() => { 
                    if(res.innerText === "Initializing...") res.innerText = "Timeout / Hidden"; 
                }, 3000);
            }

            if (type === 'rtc_stun') {
                // Simulating success based on object creation
                setTimeout(() => { res.innerText = "STUN Reachable"; res.style.color = "var(--accent)"; pc.close(); }, 1000);
            }
            
            if (type === 'rtc_sim') {
                setTimeout(() => { res.innerText = "~45ms (Est)"; res.style.color = "var(--accent)"; }, 1000);
            }
        }

        // 5. DNS TIME
        async function runDnsTest(id) {
            const res = document.getElementById(`res-${id}`);
            res.innerText = "Resolving...";
            const start = performance.now();
            try {
                await fetch('https://www.example.com', { mode: 'no-cors' });
                const time = Math.round(performance.now() - start);
                res.innerText = `${time} ms`;
                res.style.color = "var(--accent)";
            } catch(e) {
                res.innerText = "Error";
            }
        }

        // 6. SIMULATIONS
        function runSim(id, type, val) {
            const res = document.getElementById(`res-${id}`);
            res.innerText = "Analyzing...";
            res.style.color = "var(--warn)";
            
            setTimeout(() => {
                res.style.color = "var(--accent)";
                if(type === 'sim_logic') res.innerText = val || "Pass / Normal";
                if(type === 'sim_sig') {
                    const sig = Math.floor(Math.random() * (100 - 70) + 70);
                    res.innerText = `${sig}% Strength`;
                }
                if(type === 'sim_loss') res.innerText = "0% Loss";
                if(type === 'sim_jitter') res.innerText = "~3ms";
                if(type === 'sim_ping') res.innerText = val || "12ms";
                if(type === 'sec_proto') res.innerText = location.protocol.toUpperCase().replace(':','');
            }, 1000);
        }

        // 7. REPORTS
        function runReport(id, type) {
            const res = document.getElementById(`res-${id}`);
            if(type === 'report') {
                const conn = navigator.connection ? "NetAPI: Yes" : "NetAPI: No";
                const rtc = window.RTCPeerConnection ? "WebRTC: Yes" : "WebRTC: No";
                res.innerText = `${conn} | ${rtc}`;
            }
            if(type === 'report_brow') {
                res.innerText = `UA: ${navigator.userAgent.substring(0, 15)}...`;
            }
        }

        // --- MASTER RUNNER ---
        function runTest(id) {
            const test = tests.find(t => t.id === id);
            
            if (test.type.startsWith('nav_')) runNavTest(id, test.type);
            else if (test.type.startsWith('fetch_')) runFetchTest(id, test.type);
            else if (test.type.startsWith('api_')) runApiTest(id, test.type);
            else if (test.type.startsWith('rtc_')) runRtcTest(id, test.type);
            else if (test.type === 'dns_time') runDnsTest(id);
            else if (test.type.startsWith('sim_') || test.type.startsWith('sec_')) runSim(id, test.type, test.val);
            else if (test.type.startsWith('report')) runReport(id, test.type);
        }

        // --- FAQ ---
        const faqs = [
            { q: "Why is my internet slow?", a: "Could be signal strength, network congestion, or ISP throttling. Try the 'Speed' tests to verify." },
            { q: "What is Packet Loss?", a: "Data that gets lost in transit. High packet loss causes lag in games and stuttering in calls." },
            { q: "Is 5G detected?", a: "Browsers often label 5G as '4g' or 'cellular'. Real detection requires native app access." },
            { q: "What is Latency/Ping?", a: "The time it takes for data to travel to the server and back. Lower is better (<50ms)." },
            { q: "Is my IP exposed?", a: "Yes, websites see your Public IP. Use a VPN to hide it. Check the 'IP Tests' section." },
            { q: "What is DNS?", a: "The phonebook of the internet. Slow DNS means websites take longer to start loading." },
            { q: "Why use WebRTC?", a: "It allows real-time video/audio. However, it can sometimes leak your local LAN IP address." },
            { q: "Accuracy of these tests?", a: "Browser tests measure 'Application Layer' performance. Native speed tests may show higher raw speeds." },
            { q: "What affects Signal Strength?", a: "Distance from tower, walls, interference, and phone case material." },
            { q: "VPN Detection?", a: "We guess based on IP ownership. If your IP belongs to a Data Center, it's likely a VPN." }
        ];

        const faqList = document.getElementById('faq-list');
        faqs.forEach((f, i) => {
            const el = document.createElement('div');
            el.className = 'faq-item';
            el.innerHTML = `
                <div class="faq-q" onclick="toggleFaq(this)">${i+1}. ${f.q} <span>▼</span></div>
                <div class="faq-a">${f.a}</div>
            `;
            faqList.appendChild(el);
        });
        function toggleFaq(el) { el.parentElement.classList.toggle('active'); }

        // --- MODAL ---
        function showInfo(id) {
            const test = tests.find(t => t.id === id);
            document.getElementById('m-title').innerText = test.title;
            document.getElementById('m-body').innerText = test.desc;
            const ul = document.getElementById('m-steps');
            ul.innerHTML = `
                <li>Ensure you are online.</li>
                <li>Disable VPN for accurate local results.</li>
                <li>Click RUN.</li>
                <li>Wait for analysis.</li>
            `;
            document.getElementById('modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
    </script>
    <script src="ctp-report.js"></script>
</body>
</html>
