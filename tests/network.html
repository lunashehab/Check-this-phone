<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network & SIM Diagnostics | CheckThisPhone</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --surface-dark: #1e293b;
            --accent: #22c55e; /* Green for Signal */
            --accent-dim: rgba(34, 197, 94, 0.2);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* HEADER */
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            margin-right: 15px;
        }
        .page-title { font-size: 20px; font-weight: 700; margin: 0; }

        /* SIGNAL BARS HERO */
        .signal-box {
            background: var(--surface-dark);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            margin-bottom: 20px;
        }

        .bars-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 8px;
            height: 60px;
            margin-bottom: 15px;
        }
        
        .bar {
            width: 12px;
            background: #334155;
            border-radius: 4px;
            transition: background 0.3s;
        }
        .bar:nth-child(1) { height: 20%; }
        .bar:nth-child(2) { height: 40%; }
        .bar:nth-child(3) { height: 60%; }
        .bar:nth-child(4) { height: 80%; }
        .bar:nth-child(5) { height: 100%; }
        
        .bar.active { background: var(--accent); box-shadow: 0 0 10px var(--accent-dim); }

        .signal-text { font-size: 24px; font-weight: 800; }
        .signal-sub { font-size: 12px; color: var(--text-dim); }

        /* CARRIER INFO */
        .info-card {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .carrier-name { font-weight: 700; font-size: 15px; }
        .carrier-badge { 
            font-size: 10px; background: var(--accent); color: #000; 
            padding: 2px 6px; border-radius: 4px; font-weight: 700;
        }

        /* LATENCY PING TEST */
        .ping-box {
            background: var(--surface-dark);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .ping-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        
        .ping-stat {
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }
        .ping-val { font-family: monospace; font-size: 14px; font-weight: 700; color: var(--accent); }
        .ping-label { font-size: 10px; color: var(--text-dim); }

        /* ACTION BUTTONS */
        .btn-action {
            width: 100%;
            background: var(--surface-dark);
            border: 1px solid #334155;
            color: var(--text-main);
            padding: 15px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            transition: 0.2s;
        }
        .btn-action:hover { border-color: var(--accent); }
        .icon { font-size: 18px; }

        /* SIM TRAY CHECKLIST */
        .checklist-title { 
            font-size: 12px; color: var(--text-dim); 
            text-transform: uppercase; margin-bottom: 10px; margin-top: 20px; 
        }
        .check-row {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #334155;
            font-size: 13px;
        }
        .check-box {
            width: 16px; height: 16px; border: 1px solid #64748b;
            border-radius: 3px; margin-right: 12px;
            cursor: pointer;
        }
        .check-box.checked { background: var(--accent); border-color: var(--accent); }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <button class="back-btn" onclick="window.location.href='index.html'">←</button>
        <h1 class="page-title">Network & SIM</h1>
    </div>

    <div class="signal-box">
        <div class="bars-container" id="signal-bars">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <div class="signal-text" id="signal-text">Checking...</div>
        <div class="signal-sub" id="signal-type">Analyzing Connection Quality</div>
    </div>

    <div class="info-card">
        <div>
            <div style="font-size: 11px; color: var(--text-dim); margin-bottom: 2px;">DETECTED CARRIER (ISP)</div>
            <div class="carrier-name" id="carrier-name">Scanning...</div>
        </div>
        <div class="carrier-badge" id="net-badge">4G/5G</div>
    </div>

    <div class="ping-box">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:600; font-size:14px;">Modem Stability</span>
            <button onclick="startPing()" style="background:var(--accent); border:none; color:#000; font-weight:700; padding:6px 12px; border-radius:4px; font-size:11px; cursor:pointer;">START PING</button>
        </div>
        <div class="ping-grid">
            <div class="ping-stat">
                <div class="ping-val" id="ping-min">--</div>
                <div class="ping-label">MIN (ms)</div>
            </div>
            <div class="ping-stat">
                <div class="ping-val" id="ping-avg">--</div>
                <div class="ping-label">AVG (ms)</div>
            </div>
            <div class="ping-stat">
                <div class="ping-val" id="ping-loss">--</div>
                <div class="ping-label">LOSS %</div>
            </div>
        </div>
    </div>

    <div class="checklist-title">Functional Tests</div>
    
    <button class="btn-action" onclick="window.location.href='tel:2027621401'">
        <span>📞 Test Call (US Naval Clock)</span>
        <span style="font-size: 11px; color: var(--text-dim);">Verifies VoLTE</span>
    </button>
    
    <button class="btn-action" onclick="window.open('https://fast.com', '_blank')">
        <span>🚀 Speed Test (Fast.com)</span>
        <span style="font-size: 11px; color: var(--text-dim);">External Link</span>
    </button>

    <div class="checklist-title">Physical Inspection</div>
    <div class="check-row" onclick="toggleCheck(this)">
        <div class="check-box"></div>
        <span>SIM Tray ejects smoothly</span>
    </div>
    <div class="check-row" onclick="toggleCheck(this)">
        <div class="check-box"></div>
        <span>Rubber gasket intact (Waterproofing)</span>
    </div>
    <div class="check-row" onclick="toggleCheck(this)">
        <div class="check-box"></div>
        <span>Does not lose signal when shaken</span>
    </div>

</div>

<script>
    // --- 1. CARRIER DETECTION (IP-API) ---
    async function fetchCarrier() {
        try {
            const response = await fetch('http://ip-api.com/json/?fields=isp,org,mobile');
            const data = await response.json();
            
            if(data.isp) {
                document.getElementById('carrier-name').innerText = data.isp;
                document.getElementById('net-badge').innerText = data.mobile ? "MOBILE DATA" : "WI-FI / LAN";
            } else {
                document.getElementById('carrier-name').innerText = "Unknown / VPN";
            }
        } catch (e) {
            document.getElementById('carrier-name').innerText = "Offline / Blocked";
        }
    }
    
    // --- 2. SIGNAL ESTIMATOR ---
    function checkSignalQuality() {
        const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        const text = document.getElementById('signal-text');
        const bars = document.querySelectorAll('.bar');
        
        // Default max bars
        let quality = 5; 
        
        if (connection) {
            // Use RTT (Latency) as proxy for signal strength
            const rtt = connection.rtt; // ms
            
            if(rtt > 500) quality = 1;
            else if(rtt > 300) quality = 2;
            else if(rtt > 150) quality = 3;
            else if(rtt > 50) quality = 4;
            else quality = 5;

            // Use Downlink to adjust
            if(connection.downlink < 1) quality = Math.min(quality, 2);
            
            document.getElementById('signal-type').innerText = `${connection.effectiveType.toUpperCase()} | ${rtt}ms Latency`;
        } else {
            // Fallback for browsers without API
            quality = 3; 
            document.getElementById('signal-type').innerText = "API Unavailable - Est. Avg";
        }

        // Update UI
        text.innerText = getLabel(quality);
        bars.forEach((bar, index) => {
            if (index < quality) bar.classList.add('active');
            else bar.classList.remove('active');
        });
    }

    function getLabel(q) {
        if(q===5) return "Excellent";
        if(q===4) return "Good";
        if(q===3) return "Fair";
        if(q===2) return "Weak";
        return "Poor";
    }

    // --- 3. PING TEST ---
    async function startPing() {
        const btn = document.querySelector('.ping-box button');
        btn.innerText = "PINGING...";
        btn.disabled = true;

        let pings = [];
        let errors = 0;

        for(let i=0; i<5; i++) {
            const start = performance.now();
            try {
                // Ping a tiny resource (Google Favicon or similar reliable host)
                // Appending random query to prevent caching
                await fetch('https://www.google.com/favicon.ico?' + Math.random(), { mode: 'no-cors' });
                const end = performance.now();
                pings.push(end - start);
            } catch (e) {
                errors++;
            }
            // Small delay
            await new Promise(r => setTimeout(r, 200));
        }

        // Calculate Stats
        if (pings.length > 0) {
            const min = Math.min(...pings).toFixed(0);
            const sum = pings.reduce((a, b) => a + b, 0);
            const avg = (sum / pings.length).toFixed(0);
            const loss = ((errors / 5) * 100).toFixed(0);

            document.getElementById('ping-min').innerText = min;
            document.getElementById('ping-avg').innerText = avg;
            document.getElementById('ping-loss').innerText = loss;
        } else {
             document.getElementById('ping-loss').innerText = "100";
        }

        btn.innerText = "TEST AGAIN";
        btn.disabled = false;
    }

    // --- 4. CHECKBOX UI ---
    function toggleCheck(el) {
        const box = el.querySelector('.check-box');
        box.classList.toggle('checked');
    }

    // Init
    fetchCarrier();
    checkSignalQuality();

</script>

</body>
</html>
