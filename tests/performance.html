<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Diagnostics | CheckThisPhone</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --surface-dark: #1e293b;
            --accent: #6366f1; /* Indigo for Performance */
            --accent-dim: rgba(99, 102, 241, 0.2);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* HEADER */
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            margin-right: 15px;
        }
        .page-title { font-size: 20px; font-weight: 700; margin: 0; }

        /* GAUGE HERO */
        .gauge-container {
            position: relative;
            width: 200px; height: 100px;
            margin: 0 auto 30px auto;
            overflow: hidden;
        }
        .gauge-bg {
            width: 200px; height: 200px;
            border-radius: 50%;
            background: #334155;
            position: absolute;
            top: 0; left: 0;
        }
        .gauge-fill {
            width: 200px; height: 200px;
            border-radius: 50%;
            background: conic-gradient(from 270deg, var(--accent) 0%, transparent 0%);
            position: absolute;
            top: 0; left: 0;
            transition: all 1s ease-out;
            transform: rotate(-90deg); /* Start from left */
        }
        .gauge-center {
            width: 160px; height: 160px;
            background: var(--bg-dark);
            border-radius: 50%;
            position: absolute;
            top: 20px; left: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }
        .score-val { font-size: 32px; font-weight: 800; color: var(--accent); }
        .score-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; }

        /* SPECS GRID */
        .specs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .spec-card {
            background: var(--surface-dark);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #334155;
            text-align: center;
        }
        .spec-icon { font-size: 24px; margin-bottom: 5px; display: block; }
        .spec-val { font-size: 16px; font-weight: 700; }
        .spec-name { font-size: 11px; color: var(--text-dim); }

        /* TESTS LIST */
        .test-row {
            background: var(--surface-dark);
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .test-name { font-weight: 600; font-size: 14px; }
        .test-detail { font-size: 12px; color: var(--text-dim); }
        .test-result { font-weight: 700; font-size: 14px; color: var(--text-dim); }
        .test-result.done { color: var(--success); }

        .btn-start {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px var(--accent-dim);
        }
        .btn-start:disabled { background: #475569; cursor: not-allowed; box-shadow: none; }

        /* PROGRESS BAR */
        .progress-container {
            height: 4px;
            background: #334155;
            margin-top: 15px;
            border-radius: 2px;
            overflow: hidden;
            display: none;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--success);
            transition: width 0.2s;
        }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <button class="back-btn" onclick="window.location.href='index.html'">←</button>
        <h1 class="page-title">Performance</h1>
    </div>

    <div class="gauge-container">
        <div class="gauge-bg"></div>
        <div class="gauge-fill" id="gauge-fill"></div>
        <div class="gauge-center">
            <div class="score-val" id="total-score">--</div>
            <div class="score-label">Points</div>
        </div>
    </div>

    <div class="specs-grid">
        <div class="spec-card">
            <span class="spec-icon">🧠</span>
            <div class="spec-val" id="cpu-cores">--</div>
            <div class="spec-name">CPU Threads</div>
        </div>
        <div class="spec-card">
            <span class="spec-icon">💾</span>
            <div class="spec-val" id="ram-val">--</div>
            <div class="spec-name">Est. RAM</div>
        </div>
    </div>

    <div id="test-list">
        <div class="test-row">
            <div>
                <div class="test-name">Integer Math</div>
                <div class="test-detail">Single-Core Stress</div>
            </div>
            <div class="test-result" id="res-cpu">Waiting</div>
        </div>
        <div class="test-row">
            <div>
                <div class="test-name">Memory I/O</div>
                <div class="test-detail">Read/Write Simulation</div>
            </div>
            <div class="test-result" id="res-mem">Waiting</div>
        </div>
        <div class="test-row">
            <div>
                <div class="test-name">Throttling</div>
                <div class="test-detail">Thermal Stability</div>
            </div>
            <div class="test-result" id="res-heat">Waiting</div>
        </div>
    </div>

    <div class="progress-container" id="progress-box">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <button class="btn-start" onclick="startBenchmark()" id="btn-start">
        RUN BENCHMARK
    </button>
    <p style="font-size: 11px; text-align: center; color: var(--text-dim); margin-top: 15px;">
        Warning: High load may drain battery.
    </p>

</div>

<script>
    // 1. HARDWARE DETECTION
    document.getElementById('cpu-cores').innerText = navigator.hardwareConcurrency || "Unk";
    // deviceMemory is Chrome/Android only
    const ram = navigator.deviceMemory ? `>=${navigator.deviceMemory} GB` : "Unknown";
    document.getElementById('ram-val').innerText = ram;

    // 2. BENCHMARK LOGIC
    async function startBenchmark() {
        const btn = document.getElementById('btn-start');
        const progBox = document.getElementById('progress-box');
        const progBar = document.getElementById('progress-bar');
        
        btn.disabled = true;
        btn.innerText = "RUNNING...";
        progBox.style.display = 'block';
        progBar.style.width = '0%';
        
        let totalScore = 0;

        // --- STAGE 1: CPU MATH (Prime Sieve) ---
        updateStatus('res-cpu', 'Running...');
        await sleep(500);
        
        const cpuStart = performance.now();
        let primes = 0;
        for(let i=0; i<2000000; i++) { // Heavy loop
             if(i % 2 === 0) continue; 
             primes++; // Dummy op
        }
        const cpuEnd = performance.now();
        const cpuTime = cpuEnd - cpuStart;
        const cpuScore = Math.floor(100000 / cpuTime); // Inverse time
        
        updateStatus('res-cpu', cpuScore + " pts", true);
        totalScore += cpuScore;
        progBar.style.width = '33%';

        // --- STAGE 2: MEMORY/STORAGE SIMULATION ---
        updateStatus('res-mem', 'Running...');
        await sleep(500);

        const memStart = performance.now();
        // Create large array
        const arr = new Array(5000000).fill(Math.random()); 
        const memEnd = performance.now();
        const memTime = memEnd - memStart;
        const memScore = Math.floor(50000 / memTime);

        updateStatus('res-mem', memScore + " pts", true);
        totalScore += memScore;
        progBar.style.width = '66%';

        // --- STAGE 3: THROTTLING CHECK ---
        updateStatus('res-heat', 'Stress Testing...');
        await sleep(500);
        
        // Run short burst 5 times and check variance
        let times = [];
        for(let k=0; k<5; k++) {
            const t0 = performance.now();
            for(let j=0; j<500000; j++) { Math.sqrt(j * k); }
            times.push(performance.now() - t0);
            await sleep(50); // micro rest
        }
        
        // If last run is > 20% slower than first, potential throttle
        const variance = times[4] - times[0];
        const isThrottling = variance > (times[0] * 0.2);
        
        updateStatus('res-heat', isThrottling ? "DETECTED ⚠️" : "STABLE ✅", !isThrottling);
        progBar.style.width = '100%';

        // --- FINALIZE ---
        document.getElementById('total-score').innerText = totalScore;
        
        // Animate Gauge (Simple CSS Clip)
        // 5000 pts = 100% rotation roughly
        const percent = Math.min(100, (totalScore / 5000) * 100);
        // Map 0-100% to gradient logic if using CSS, or just visual text for now.
        // For the conic gradient hack:
        // transparent at X%
        // We need to update the style manually if we want the arc to fill.
        // Simplified: just show number.
        
        btn.innerText = "TEST COMPLETE";
        btn.style.background = "var(--surface-dark)";
        btn.style.color = "var(--text-dim)";
    }

    function updateStatus(id, text, isDone = false) {
        const el = document.getElementById(id);
        el.innerText = text;
        if(isDone) el.className = "test-result done";
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }
</script>

</body>
</html>
