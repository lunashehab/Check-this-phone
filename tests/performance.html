<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Don Systems Core Reactor</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050505; 
            --panel: #0f1218; 
            --border: #2d3748; 
            --text: #a0aec0; 
            --text-bright: #e2e8f0;
            --accent: #ffb700; /* Cyber Gold */
            --secondary: #ff0055; 
            --success: #00ff9d; 
            --warn: #ffb700; 
        }
        
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 20px; margin: 0; min-height: 100vh; font-size: 14px; overflow-x: hidden; }
        
        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .logo { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 18px; color: var(--text-bright); letter-spacing: -1px; }
        .logo span { color: var(--accent); }
        .live-badge { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--warn); font-weight: 700; background: rgba(255, 183, 0, 0.1); padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(255, 183, 0, 0.2); }
        .blink { animation: blink 1s infinite; width: 6px; height: 6px; background: var(--warn); border-radius: 50%; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }

        /* HERO GAUGE */
        .gauge-container { 
            position: relative; width: 220px; height: 220px; margin: 0 auto 30px auto; 
            background: radial-gradient(circle at center, #1a202c 0%, #000 70%);
            border-radius: 50%; box-shadow: 0 0 40px rgba(255, 183, 0, 0.1);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border: 4px solid rgba(255,255,255,0.05);
        }
        .score-val { font-family: 'JetBrains Mono', monospace; font-size: 48px; font-weight: 700; color: white; line-height: 1; text-shadow: 0 0 20px var(--accent); }
        .score-label { font-size: 11px; background: #334155; padding: 2px 8px; border-radius: 10px; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-bright); }
        
        /* PROGRESS RING */
        .ring-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-90deg); pointer-events: none; }
        .ring-circle { fill: none; stroke: var(--accent); stroke-width: 8; stroke-dasharray: 600; stroke-dashoffset: 600; transition: stroke-dashoffset 0.5s; stroke-linecap: round; }

        /* STATS GRID */
        .grid-master { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 15px; }
        .stat-label { font-size: 10px; text-transform: uppercase; color: var(--text); display: block; margin-bottom: 4px; }
        .stat-val { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; color: var(--text-bright); }
        .unit { font-size: 10px; color: var(--text); font-weight: 400; }
        
        /* VISUALIZER BAR */
        .load-bar { width: 100%; height: 4px; background: #1a202c; margin-top: 10px; border-radius: 2px; overflow: hidden; }
        .load-fill { height: 100%; width: 0%; background: var(--secondary); transition: width 0.2s; }

        /* CONTROL BUTTONS */
        .btn-test { background: var(--panel); border: 1px solid var(--border); color: var(--text-bright); width: 100%; padding: 18px; border-radius: 12px; font-weight: 700; margin-bottom: 12px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .btn-test:hover { border-color: var(--accent); color: var(--accent); }
        .btn-icon { font-size: 18px; }

        /* TERMINAL */
        .terminal { background: #000; border: 1px solid var(--border); border-radius: 8px; padding: 10px; height: 120px; overflow: hidden; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--accent); position: relative; }
        .log-line { margin-bottom: 2px; opacity: 0.8; }
        .terminal::after { content: ""; position: absolute; bottom: 0; left: 0; width: 100%; height: 20px; background: linear-gradient(to top, #000, transparent); }

        .back-btn { display: block; text-align: center; margin-top: 20px; color: var(--text); text-decoration: none; font-weight: 700; padding: 15px; background: var(--panel); border-radius: 12px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">DON<span>REACTOR</span></div>
        <div class="live-badge"><div class="blink"></div> SYSTEM IDLE</div>
    </div>

    <div class="gauge-container">
        <svg class="ring-svg"><circle class="ring-circle" cx="110" cy="110" r="100"></circle></svg>
        <div class="score-val" id="total-score">0</div>
        <div class="score-label">BENCHMARK SCORE</div>
    </div>

    <div class="grid-master">
        <div class="stat-card">
            <span class="stat-label">CPU LOGIC</span>
            <span class="stat-val" id="cpu-score">--</span>
            <div class="load-bar"><div class="load-fill" id="bar-cpu"></div></div>
        </div>
        <div class="stat-card">
            <span class="stat-label">MEMORY I/O</span>
            <span class="stat-val" id="mem-score">--</span>
            <div class="load-bar"><div class="load-fill" id="bar-mem"></div></div>
        </div>
        <div class="stat-card">
            <span class="stat-label">PHYSICS (FPS)</span>
            <span class="stat-val" id="gpu-score">--</span>
            <div class="load-bar"><div class="load-fill" id="bar-gpu"></div></div>
        </div>
        <div class="stat-card">
            <span class="stat-label">CORES DETECTED</span>
            <span class="stat-val" id="core-count">--</span>
        </div>
    </div>

    <button class="btn-test" onclick="runBenchmark()">
        <span>RUN FULL BENCHMARK</span> <span class="btn-icon">🚀</span>
    </button>
    <button class="btn-test" onclick="runStressTest()">
        <span>STRESS TEST (5 SEC)</span> <span class="btn-icon">🔥</span>
    </button>

    <div class="terminal" id="console-output">
        <div class="log-line">> CORE REACTOR INIT...</div>
        <div class="log-line">> WAITING FOR COMMAND...</div>
    </div>

    <a href="../index.html" class="back-btn">EXIT REACTOR</a>

    <script>
        // --- LOGGING ---
        function log(msg) {
            const term = document.getElementById('console-output');
            const line = document.createElement('div');
            line.className = 'log-line';
            line.innerHTML = `<span style="color:#64748b">[CPU]</span> ${msg}`;
            term.appendChild(line);
            if(term.children.length > 6) term.removeChild(term.children[0]);
            term.scrollTop = term.scrollHeight;
        }

        // --- HARDWARE DETECT ---
        const cores = navigator.hardwareConcurrency || 4;
        document.getElementById('core-count').innerText = cores;
        log(`> DETECTED ${cores} LOGICAL CORES`);

        // --- 1. CPU MATH TEST (Primes) ---
        function testCPU() {
            return new Promise(resolve => {
                const start = performance.now();
                let count = 0;
                // Heavy math loop
                for(let i=0; i<3000000; i++) {
                    count += Math.sqrt(i) * Math.tan(i);
                }
                const end = performance.now();
                const duration = end - start;
                // Score: Lower time is better. 
                // Baseline: 500ms = 1000 pts.
                let score = Math.round(100000 / duration);
                resolve(score);
            });
        }

        // --- 2. MEMORY TEST (Array Fill) ---
        function testMemory() {
            return new Promise(resolve => {
                const start = performance.now();
                const arr = [];
                // Alloc 5MB array
                for(let i=0; i<500000; i++) {
                    arr.push({id: i, val: Math.random()});
                }
                // Read/Sort
                arr.sort((a,b) => a.val - b.val);
                const end = performance.now();
                const duration = end - start;
                let score = Math.round(200000 / duration);
                resolve(score);
            });
        }

        // --- 3. GPU/PHYSICS TEST (FPS Simulation) ---
        function testGPU() {
            return new Promise(resolve => {
                let frames = 0;
                const start = performance.now();
                
                function loop() {
                    const now = performance.now();
                    if (now - start >= 1000) {
                        resolve(frames); // Return FPS count
                        return;
                    }
                    // Simulate work
                    for(let j=0; j<5000; j++) { Math.random(); }
                    frames++;
                    requestAnimationFrame(loop);
                }
                loop();
            });
        }

        // --- MAIN BENCHMARK RUNNER ---
        async function runBenchmark() {
            log("> STARTING BENCHMARK SEQUENCE...");
            document.querySelector('.ring-circle').style.stroke = "var(--warn)";
            document.querySelector('.ring-circle').style.strokeDashoffset = "600";
            
            // 1. CPU
            log("> TESTING LOGIC GATES...");
            document.getElementById('bar-cpu').style.width = "50%";
            const cpu = await testCPU();
            document.getElementById('cpu-score').innerText = cpu;
            document.getElementById('bar-cpu').style.width = "100%";
            document.querySelector('.ring-circle').style.strokeDashoffset = "400";

            // 2. MEMORY
            log("> TESTING RAM BANDWIDTH...");
            document.getElementById('bar-mem').style.width = "50%";
            const mem = await testMemory();
            document.getElementById('mem-score').innerText = mem;
            document.getElementById('bar-mem').style.width = "100%";
            document.querySelector('.ring-circle').style.strokeDashoffset = "200";

            // 3. GPU
            log("> TESTING GRAPHICS PIPELINE...");
            document.getElementById('bar-gpu').style.width = "50%";
            const fps = await testGPU();
            document.getElementById('gpu-score').innerText = fps;
            document.getElementById('bar-gpu').style.width = "100%";
            document.querySelector('.ring-circle').style.strokeDashoffset = "0";

            // TOTAL
            const total = Math.round((cpu + mem + (fps*10)) / 3);
            
            // Animation for score
            let current = 0;
            const timer = setInterval(() => {
                current += Math.round(total / 20);
                if(current >= total) {
                    current = total;
                    clearInterval(timer);
                    log(`> BENCHMARK COMPLETE: ${total} PTS`);
                    document.querySelector('.ring-circle').style.stroke = "var(--success)";
                }
                document.getElementById('total-score').innerText = current;
            }, 20);
        }

        // --- STRESS TEST ---
        function runStressTest() {
            log("> WARNING: MAX LOAD APPLIED...");
            const btn = document.querySelectorAll('.btn-test')[1];
            btn.style.background = "var(--secondary)";
            
            const start = Date.now();
            const duration = 5000; // 5s
            
            function burn() {
                const now = Date.now();
                if(now - start < duration) {
                    // Block main thread for 20ms chunks (simulated lag)
                    const block = Date.now();
                    while(Date.now() - block < 20) { Math.random(); }
                    
                    // Update visual
                    const progress = ((now - start) / duration) * 100;
                    document.querySelector('.ring-circle').style.stroke = "var(--secondary)";
                    document.querySelector('.ring-circle').style.strokeDashoffset = 600 - (6 * progress);
                    
                    requestAnimationFrame(burn);
                } else {
                    log("> STRESS TEST PASSED");
                    btn.style.background = "";
                    document.querySelector('.ring-circle').style.strokeDashoffset = 600;
                }
            }
            burn();
        }

    </script>
</body>
</html>
