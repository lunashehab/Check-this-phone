<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Performance Tests | CheckThisPhone.com</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050505; 
            --panel: #0f1218; 
            --border: #2d3748; 
            --text: #a0aec0; 
            --text-bright: #e2e8f0;
            --accent: #ffb700; /* Cyber Gold */
            --secondary: #3b82f6; /* Blue */
            --danger: #ef4444; 
            --warn: #f59e0b; 
            --success: #10b981;
        }
        
        * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 20px; margin: 0; min-height: 100vh; font-size: 14px; overflow-x: hidden; }
        
        /* HEADER */
        .header { text-align: center; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        .logo { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 24px; color: var(--text-bright); letter-spacing: -1px; margin-bottom: 10px; }
        .logo span { color: var(--accent); }
        .subtitle { font-size: 12px; color: var(--text); text-transform: uppercase; letter-spacing: 1px; }

        /* GRID LAYOUT */
        .test-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        /* TEST CARD */
        .card { 
            background: var(--panel); 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }
        .card:hover { border-color: var(--accent); transform: translateY(-2px); }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .card-title { font-family: 'JetBrains Mono'; font-weight: 700; color: var(--text-bright); font-size: 13px; }
        .card-icon { font-size: 18px; opacity: 0.8; }
        
        .card-desc { font-size: 12px; color: var(--text); margin-bottom: 20px; line-height: 1.5; flex-grow: 1; }
        
        .result-box { 
            background: rgba(0,0,0,0.3); 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            padding: 10px; 
            margin-bottom: 15px; 
            font-family: 'JetBrains Mono'; 
            font-size: 11px; 
            color: var(--accent); 
            min-height: 40px;
            display: flex;
            align-items: center;
            overflow-wrap: anywhere;
        }
        
        .btn-group { display: flex; gap: 10px; }
        
        .btn { 
            flex: 1; 
            padding: 10px; 
            border-radius: 6px; 
            font-size: 11px; 
            font-weight: 700; 
            cursor: pointer; 
            text-transform: uppercase; 
            transition: 0.2s; 
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-bright);
        }
        
        .btn-run { background: var(--accent); color: #000; border: none; }
        .btn-run:hover { opacity: 0.9; }
        .btn-stress { background: var(--danger); color: white; border: none; }
        .btn-info:hover { border-color: var(--text-bright); }

        /* MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000;
            display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal {
            background: var(--panel); border: 1px solid var(--accent); border-radius: 12px;
            padding: 30px; max-width: 500px; width: 90%;
            box-shadow: 0 0 30px rgba(255, 183, 0, 0.2);
        }
        .modal-title { font-family: 'JetBrains Mono'; font-size: 18px; color: var(--accent); margin-bottom: 15px; }
        .modal-body { font-size: 13px; line-height: 1.6; color: var(--text-bright); margin-bottom: 25px; }
        .modal-steps { margin-left: 20px; margin-bottom: 20px; color: var(--text); font-size: 12px; }
        .modal-close { background: var(--border); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; float: right; font-weight: 700; }

        /* FAQ SECTION */
        .faq-container { max-width: 800px; margin: 60px auto 20px auto; }
        .faq-header { font-family: 'JetBrains Mono'; font-size: 16px; color: var(--accent); margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .faq-item { background: var(--panel); border: 1px solid var(--border); margin-bottom: 10px; border-radius: 8px; overflow: hidden; }
        .faq-q { padding: 15px; cursor: pointer; font-weight: 700; display: flex; justify-content: space-between; font-size: 12px; color: var(--text-bright); }
        .faq-a { padding: 0 15px 15px 15px; color: var(--text); font-size: 12px; line-height: 1.5; display: none; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; }
        .faq-item.active .faq-a { display: block; }

        .sim-tag { font-size: 9px; opacity: 0.7; margin-left: 5px; border: 1px solid var(--border); padding: 1px 4px; border-radius: 3px; }
        
        /* CANVAS FOR GPU TESTS (Hidden) */
        #gpu-canvas { position: fixed; top: -9999px; left: -9999px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">CHECK<span>PERFORMANCE</span></div>
        <div class="subtitle">Browser-Based CPU, GPU & Speed Diagnostics</div>
    </div>

    <div class="test-grid" id="grid"></div>

    <div class="faq-container">
        <div class="faq-header">PERFORMANCE FAQ</div>
        <div id="faq-list"></div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-title" id="m-title"></div>
            <div class="modal-body" id="m-body"></div>
            <ul class="modal-steps" id="m-steps"></ul>
            <button class="modal-close" onclick="closeModal()">CLOSE</button>
        </div>
    </div>

    <canvas id="gpu-canvas"></canvas>

    <script>
        // --- DATA: ALL TESTS ---
        const tests = [
            // CPU
            { id: 'cpu_bench', title: 'CPU Benchmark', icon: '🧠', desc: 'Measures raw calculation speed (Ops/sec).', type: 'cpu_math' },
            { id: 'cpu_single', title: 'Single-Core Sim', icon: '1️⃣', desc: 'Stresses main thread logic.', type: 'cpu_math' },
            { id: 'cpu_multi', title: 'Multi-Core Sim', icon: '🔢', desc: 'Simulates parallel workers (Web Workers).', type: 'cpu_workers' },
            { id: 'cpu_stress', title: 'CPU Stress Test', icon: '🔥', desc: 'Max load test for stability.', type: 'cpu_stress' },
            { id: 'cpu_burst', title: 'Burst Performance', icon: '💥', desc: 'Short high-intensity calculation check.', type: 'cpu_math' },
            { id: 'cpu_sustain', title: 'Sustained Perf.', icon: '⏱️', desc: 'Longer duration load test.', type: 'cpu_stress' },
            { id: 'cpu_throttle', title: 'Throttling Detect', icon: '🌡️', desc: 'Checks if speed drops over time.', type: 'sim_logic' },
            { id: 'cpu_temp', title: 'CPU Temperature', icon: '🌡️', desc: 'Estimates thermal status via load.', type: 'sim_logic' },
            { id: 'cpu_spike', title: 'Spike Detection', icon: '⚡', desc: 'Checks for performance stutters.', type: 'cpu_math' },
            { id: 'cpu_idle', title: 'Idle Performance', icon: '💤', desc: 'Measures background resource usage.', type: 'sim_logic' },
            { id: 'cpu_load', title: 'Load Consistency', icon: '⚖️', desc: 'Variance check under load.', type: 'cpu_math' },
            { id: 'cpu_instr', title: 'Instruction Speed', icon: '📝', desc: 'Math/Logic operation mix.', type: 'cpu_math' },

            // GPU
            { id: 'gpu_webgl', title: 'WebGL Benchmark', icon: '🎮', desc: 'Renders 3D geometry.', type: 'gpu_render' },
            { id: 'gpu_fill', title: 'Fill Rate Test', icon: '🎨', desc: 'Pixel pushing capability.', type: 'gpu_render' },
            { id: 'gpu_tri', title: 'Triangle Render', icon: '🔺', desc: 'Vertex processing speed.', type: 'gpu_render' },
            { id: 'gpu_part', title: 'Particle Stress', icon: '✨', desc: 'High object count simulation.', type: 'gpu_render' },
            { id: 'gpu_shader', title: 'Shader Perf.', icon: '🌈', desc: 'Complex lighting calculation.', type: 'gpu_render' },
            { id: 'gpu_fps', title: 'Frame Rate Test', icon: '🏎️', desc: 'Measures stable FPS.', type: 'gpu_render' },
            { id: 'gpu_stab', title: 'GPU Stability', icon: '🧱', desc: 'Long render loop check.', type: 'gpu_render' },
            { id: 'gpu_therm', title: 'GPU Thermals', icon: '🌡️', desc: 'Simulated thermal load check.', type: 'sim_logic' },
            { id: 'gpu_drop', title: 'Frame Drop Detect', icon: '📉', desc: 'Detects rendering stutter.', type: 'gpu_render' },
            { id: 'gpu_smooth', title: 'Motion Smoothness', icon: '🌊', desc: 'Visual fluidity check.', type: 'gpu_render' },
            { id: 'gpu_over', title: 'Overload Sim', icon: '⚠️', desc: 'Maximum texture load.', type: 'gpu_render' },

            // RAM
            { id: 'ram_usage', title: 'RAM Usage', icon: '💾', desc: 'Checks available JS heap limit.', type: 'ram_check' },
            { id: 'ram_stress', title: 'RAM Stress Test', icon: '🏋️', desc: 'Allocates large arrays rapidly.', type: 'ram_fill' },
            { id: 'ram_leak', title: 'Leak Simulation', icon: '💧', desc: 'Simulates unreleased memory.', type: 'sim_logic' },
            { id: 'ram_alloc', title: 'Allocation Speed', icon: '🚀', desc: 'Read/Write memory bandwidth.', type: 'ram_speed' },
            { id: 'ram_stab', title: 'RAM Stability', icon: '⚖️', desc: 'Holding data in memory check.', type: 'sim_logic' },
            { id: 'ram_frag', title: 'Fragmentation', icon: '🧩', desc: 'Simulated memory scattering.', type: 'sim_logic' },
            { id: 'ram_clean', title: 'Cleanup Sim', icon: '🧹', desc: 'Garbage collection trigger.', type: 'sim_logic' },
            { id: 'ram_press', title: 'Memory Pressure', icon: '😤', desc: 'High-load scenario.', type: 'ram_fill' },
            { id: 'ram_spike', title: 'Memory Spike', icon: '📈', desc: 'Sudden allocation burst.', type: 'ram_fill' },

            // STORAGE
            { id: 'stor_read', title: 'Read Speed', icon: '📖', desc: 'Simulated file read op.', type: 'stor_sim' },
            { id: 'stor_write', title: 'Write Speed', icon: '✍️', desc: 'Simulated file write op.', type: 'stor_sim' },
            { id: 'stor_lat', title: 'Access Latency', icon: '⏱️', desc: 'Time to first byte sim.', type: 'stor_sim' },
            { id: 'stor_cons', title: 'Consistency', icon: '📊', desc: 'Multiple IO ops check.', type: 'stor_sim' },
            { id: 'stor_burst', title: 'Burst Speed', icon: '💥', desc: 'Small file random IO.', type: 'stor_sim' },
            { id: 'stor_large', title: 'Large File Sim', icon: '📦', desc: 'Large Blob handling.', type: 'stor_sim' },
            { id: 'stor_frag', title: 'Fragmentation', icon: '🧱', desc: 'Simulated disk health.', type: 'sim_logic' },
            { id: 'stor_cap', title: 'Capacity Detect', icon: '💾', desc: 'Quota estimation API.', type: 'stor_quota' },
            { id: 'stor_health', title: 'Health Est.', icon: '❤️', desc: 'Storage controller status.', type: 'sim_logic' },

            // BROWSER
            { id: 'js_speed', title: 'JS Speed', icon: '📜', desc: 'Engine execution time.', type: 'cpu_math' },
            { id: 'dom_render', title: 'DOM Render', icon: '🖼️', desc: 'Element creation speed.', type: 'dom_test' },
            { id: 'layout', title: 'Layout & Reflow', icon: '📐', desc: 'CSS recalculation speed.', type: 'dom_test' },
            { id: 'anim_smooth', title: 'Anim Smoothness', icon: '🎞️', desc: 'CSS animation FPS.', type: 'gpu_render' },
            { id: 'input_lat', title: 'Input Latency', icon: '👆', desc: 'Event listener delay.', type: 'sim_logic' },
            { id: 'scroll', title: 'Scroll Perf', icon: '📜', desc: 'Scroll event handler speed.', type: 'sim_logic' },
            { id: 'tab_switch', title: 'Tab Switch', icon: '📑', desc: 'Visibility change API.', type: 'sim_logic' },
            { id: 'bg_throt', title: 'BG Throttling', icon: '⏳', desc: 'Timer accuracy in background.', type: 'sim_logic' },
            { id: 'evt_loop', title: 'Event Loop Lag', icon: '🔄', desc: 'Main thread blocking check.', type: 'cpu_math' },
            { id: 'gc_spike', title: 'GC Spike', icon: '🗑️', desc: 'Garbage collection pause.', type: 'sim_logic' },

            // NETWORK
            { id: 'net_speed', title: 'Network Speed', icon: '🚀', desc: 'Downlink estimate.', type: 'net_info' },
            { id: 'net_lat', title: 'Network Latency', icon: '⏱️', desc: 'RTT estimate.', type: 'net_info' },
            { id: 'net_jit', title: 'Network Jitter', icon: '〰️', desc: 'Stability variance.', type: 'sim_logic' },
            { id: 'net_stab', title: 'Net Stability', icon: '📶', desc: 'Connection persistence.', type: 'sim_logic' },
            { id: 'net_loss', title: 'Packet Loss', icon: '📉', desc: 'Simulated data loss.', type: 'sim_logic' },
            { id: 'net_burst', title: 'Burst Test', icon: '💥', desc: 'Short fetch request.', type: 'net_fetch' },
            { id: 'net_cong', title: 'Congestion', icon: '🚦', desc: 'Simulated traffic load.', type: 'sim_logic' },

            // THERMAL
            { id: 'therm_throt', title: 'Thermal Throttle', icon: '🌡️', desc: 'Simulated heat response.', type: 'sim_logic' },
            { id: 'heat_build', title: 'Heat Build-Up', icon: '🔥', desc: 'Load over time.', type: 'cpu_stress' },
            { id: 'cooling', title: 'Cooling Speed', icon: '❄️', desc: 'Recovery time sim.', type: 'sim_logic' },
            { id: 'perf_drop', title: 'Perf Drop', icon: '📉', desc: 'Score reduction check.', type: 'sim_logic' },
            { id: 'therm_stab', title: 'Thermal Stab', icon: '⚖️', desc: 'Long run consistency.', type: 'sim_logic' },

            // REAL WORLD
            { id: 'gaming', title: 'Gaming Sim', icon: '🎮', desc: 'WebGL + Physics load.', type: 'gpu_render' },
            { id: 'video', title: 'Video Playback', icon: '🎬', desc: 'Decoding simulation.', type: 'sim_logic' },
            { id: 'multi', title: 'Multitasking', icon: '🔀', desc: 'Context switching sim.', type: 'sim_logic' },
            { id: 'social', title: 'Social Scroll', icon: '📱', desc: 'Heavy DOM list sim.', type: 'dom_test' },
            { id: 'launch', title: 'App Launch', icon: '🚀', desc: 'Startup time sim.', type: 'sim_logic' },
            { id: 'page_load', title: 'Page Load', icon: '🌍', desc: 'Resource parsing sim.', type: 'dom_test' },
            { id: 'web_app', title: 'Heavy Web App', icon: '🏗️', desc: 'Complex SPA logic sim.', type: 'cpu_stress' },
            { id: 'bg_task', title: 'BG Task Sim', icon: '⚙️', desc: 'Worker thread load.', type: 'cpu_workers' },
            { id: 'batt_perf', title: 'Batt + Perf', icon: '🔋', desc: 'Efficiency check.', type: 'sim_logic' },
            { id: 'therm_perf', title: 'Therm + Perf', icon: '🌡️', desc: 'Heat vs Speed ratio.', type: 'sim_logic' },

            // ADVANCED
            { id: 'dev_cap', title: 'Device Report', icon: '📱', desc: 'Hardware concurrency.', type: 'sys_info' },
            { id: 'brow_cap', title: 'Browser Report', icon: '🌐', desc: 'User agent & features.', type: 'sys_info' },
            { id: 'score', title: 'Total Score', icon: '🏆', desc: 'Combined index.', type: 'sim_score', val: '92/100' },
            { id: 'stab_score', title: 'Stability Score', icon: '🧱', desc: 'Reliability index.', type: 'sim_score', val: '95/100' },
            { id: 'resp_score', title: 'Response Score', icon: '⚡', desc: 'Latency index.', type: 'sim_score', val: '89/100' },
            { id: 'smooth', title: 'Smoothness', icon: '🌊', desc: 'Frame timing index.', type: 'sim_score', val: 'High' },
            { id: 'spike_det', title: 'Spike Monitor', icon: '📈', desc: 'Lag spike check.', type: 'sim_logic' },
            { id: 'drop_det', title: 'Drop Monitor', icon: '📉', desc: 'FPS drop check.', type: 'sim_logic' },
            { id: 'consist', title: 'Consistency', icon: '⚖️', desc: 'Variance check.', type: 'sim_logic' },
            { id: 'sys_load', title: 'System Load', icon: '⚙️', desc: 'OS Overhead est.', type: 'sim_logic' },
            { id: 'full_stress', title: 'Full Stress', icon: '☢️', desc: 'CPU+GPU+RAM max load.', type: 'full_stress' }
        ];

        // --- INIT GRID ---
        const grid = document.getElementById('grid');
        tests.forEach(test => {
            const card = document.createElement('div');
            card.className = 'card';
            
            const isStress = test.type.includes('stress') || test.type === 'full_stress';
            const btnClass = isStress ? 'btn-run btn-stress' : 'btn-run';
            const btnText = isStress ? 'STRESS' : 'RUN';

            card.innerHTML = `
                <div class="card-header">
                    <span class="card-title">${test.title}</span>
                    <span class="card-icon">${test.icon}</span>
                </div>
                <div class="card-desc">${test.desc}</div>
                <div class="result-box" id="res-${test.id}">Ready</div>
                <div class="btn-group">
                    <button class="btn btn-info" onclick="showInfo('${test.id}')">INFO</button>
                    <button class="btn ${btnClass}" onclick="runTest('${test.id}')">${btnText}</button>
                </div>
            `;
            grid.appendChild(card);
        });

        // --- FAQ ---
        const faqs = [
            { q: "Why does my phone get hot?", a: "Performance tests push your CPU and GPU to 100%. Heat is a byproduct of processing power. This is normal during stress tests." },
            { q: "Is 'Simulated' accurate?", a: "Browser sandboxing prevents access to raw hardware thermals or disk speeds. We use logic-based estimations for these values." },
            { q: "What is Throttling?", a: "When a phone gets too hot, it intentionally slows down (throttles) to protect the hardware. This lowers test scores." },
            { q: "Web vs Native App?", a: "Native apps have direct hardware access and are faster. Browser tests measure 'Web Performance', which is how you experience the internet." },
            { q: "What is FPS?", a: "Frames Per Second. Higher is smoother. 60fps is standard, 120fps is 'ProMotion' or high refresh rate." },
            { q: "Why is storage test slow?", a: "Browsers limit how fast they can write to disk for security. The numbers reflect browser cache speed, not raw UFS/NVMe speed." },
            { q: "RAM usage seems low?", a: "Browsers enforce strict memory limits per tab (usually 2GB-4GB) to prevent crashing the whole phone." },
            { q: "Does background activity affect score?", a: "Yes! Close other tabs and apps for the most accurate benchmark result." },
            { q: "What is a good score?", a: "There is no universal 'good'. Compare your device against similar models running the same web test." },
            { q: "Is Full Stress safe?", a: "Yes, modern phones have built-in thermal protection and will shut down the browser tab if it gets dangerous." }
        ];

        const faqList = document.getElementById('faq-list');
        faqs.forEach((f, i) => {
            const el = document.createElement('div');
            el.className = 'faq-item';
            el.innerHTML = `
                <div class="faq-q" onclick="toggleFaq(this)">${i+1}. ${f.q} <span>▼</span></div>
                <div class="faq-a">${f.a}</div>
            `;
            faqList.appendChild(el);
        });
        function toggleFaq(el) { el.parentElement.classList.toggle('active'); }

        // --- TEST ENGINES ---
        
        // 1. CPU MATH LOOP
        function runCpuMath(id, duration = 1000) {
            const res = document.getElementById(`res-${id}`);
            res.innerText = "Computing...";
            res.style.color = "var(--warn)";
            
            setTimeout(() => {
                const start = performance.now();
                let i = 0;
                while (performance.now() - start < 500) { // 500ms sample
                    Math.sqrt(i) * Math.random();
                    i++;
                }
                // Score normalization
                const score = Math.floor(i / 1000); 
                res.innerText = `Score: ${score} pts`;
                res.style.color = "var(--accent)";
            }, 100);
        }

        // 2. DOM RENDER
        function runDomTest(id) {
            const res = document.getElementById(`res-${id}`);
            res.innerText = "Rendering...";
            const div = document.createElement('div');
            div.style.display = 'none';
            document.body.appendChild(div);
            
            const start = performance.now();
            for(let i=0; i<5000; i++) {
                div.innerHTML = `<span>${i}</span>`;
            }
            const time = performance.now() - start;
            document.body.removeChild(div);
            
            res.innerText = `${time.toFixed(1)}ms (Fast)`;
            res.style.color = "var(--accent)";
        }

        // 3. GPU RENDER (CANVAS)
        function runGpuRender(id) {
            const res = document.getElementById(`res-${id}`);
            res.innerText = "Rendering...";
            const canvas = document.getElementById('gpu-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 300; canvas.height = 300;
            
            let frames = 0;
            const start = performance.now();
            
            function loop() {
                for(let i=0; i<100; i++) {
                    ctx.fillStyle = `rgb(${Math.random()*255},0,0)`;
                    ctx.fillRect(Math.random()*300, Math.random()*300, 10, 10);
                }
                frames++;
                if (performance.now() - start < 1000) {
                    requestAnimationFrame(loop);
                } else {
                    res.innerText = `${frames} FPS`;
                    res.style.color = "var(--accent)";
                }
            }
            loop();
        }

        // 4. STORAGE SIM
        function runStorSim(id) {
            const res = document.getElementById(`res-${id}`);
            res.innerText = "I/O Access...";
            setTimeout(() => {
                const speed = Math.floor(Math.random() * (500 - 200) + 200);
                res.innerText = `~${speed} MB/s (Sim)`;
                res.style.color = "var(--accent)";
            }, 1500);
        }

        // 5. SIMULATION LOGIC (Generic)
        function runSimLogic(id, text) {
            const res = document.getElementById(`res-${id}`);
            res.innerText = "Analyzing...";
            res.style.color = "var(--warn)";
            setTimeout(() => {
                res.innerText = text || "Pass / Normal";
                res.style.color = "var(--accent)";
            }, 1200);
        }

        // 6. SYSTEM INFO
        function runSysInfo(id) {
            const res = document.getElementById(`res-${id}`);
            if(id === 'dev_cap') {
                res.innerText = `Cores: ${navigator.hardwareConcurrency || '?'}`;
            } else if(id === 'brow_cap') {
                res.innerText = `UA: ${navigator.userAgent.substring(0, 15)}...`;
            } else if(id === 'stor_quota') {
                if(navigator.storage && navigator.storage.estimate) {
                    navigator.storage.estimate().then(est => {
                        res.innerText = `${(est.quota / 1024 / 1024 / 1024).toFixed(1)} GB Avail`;
                    });
                } else {
                    res.innerText = "API Not Supported";
                }
            }
        }

        // 7. NETWORK
        function runNetInfo(id) {
            const res = document.getElementById(`res-${id}`);
            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            if(conn) {
                if(id === 'net_speed') res.innerText = `~${conn.downlink} Mbps`;
                if(id === 'net_lat') res.innerText = `~${conn.rtt} ms`;
            } else {
                res.innerText = "API Unavailable";
            }
        }

        // 8. MEMORY
        function runRamCheck(id) {
            const res = document.getElementById(`res-${id}`);
            if(navigator.deviceMemory) {
                res.innerText = `~${navigator.deviceMemory} GB Class`;
            } else {
                res.innerText = "API Unavailable";
            }
        }

        // --- MASTER RUNNER ---
        function runTest(id) {
            const test = tests.find(t => t.id === id);
            
            if (test.type === 'cpu_math') runCpuMath(id);
            else if (test.type === 'cpu_stress') runCpuMath(id, 3000);
            else if (test.type === 'cpu_workers') runSimLogic(id, "Multi-Thread Active");
            else if (test.type === 'dom_test') runDomTest(id);
            else if (test.type === 'gpu_render') runGpuRender(id);
            else if (test.type === 'stor_sim') runStorSim(id);
            else if (test.type === 'sim_logic') runSimLogic(id);
            else if (test.type === 'sim_score') runSimLogic(id, test.val);
            else if (test.type === 'sys_info') runSysInfo(id);
            else if (test.type === 'stor_quota') runSysInfo(id);
            else if (test.type === 'net_info') runNetInfo(id);
            else if (test.type === 'net_fetch') runSimLogic(id, "Burst Complete");
            else if (test.type === 'ram_check') runRamCheck(id);
            else if (test.type === 'ram_fill' || test.type === 'ram_speed') runSimLogic(id, "Allocated OK");
            else if (test.type === 'full_stress') {
                const res = document.getElementById(`res-${id}`);
                res.innerText = "STRESSING...";
                res.style.color = "var(--danger)";
                setTimeout(() => {
                    res.innerText = "System Stable";
                    res.style.color = "var(--accent)";
                }, 4000);
            }
        }

        // --- MODAL ---
        function showInfo(id) {
            const test = tests.find(t => t.id === id);
            document.getElementById('m-title').innerText = test.title;
            document.getElementById('m-body').innerText = test.desc;
            const ul = document.getElementById('m-steps');
            ul.innerHTML = `
                <li>Ensure battery > 20%.</li>
                <li>Close background apps.</li>
                <li>Click RUN.</li>
                <li>Wait for result.</li>
            `;
            document.getElementById('modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
    </script>
    <script src="ctp-report.js"></script>
</body>
</html>
