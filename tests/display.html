<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Display Tests | CheckThisPhone.com</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050505; 
            --panel: #0f1218; 
            --border: #2d3748; 
            --text: #a0aec0; 
            --text-bright: #e2e8f0;
            --accent: #10b981; /* Emerald */
            --secondary: #3b82f6; /* Blue */
            --danger: #ef4444; 
            --warn: #f59e0b; 
        }
        
        * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 20px; margin: 0; min-height: 100vh; font-size: 14px; overflow-x: hidden; }
        
        /* HEADER */
        .header { text-align: center; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        .logo { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 24px; color: var(--text-bright); letter-spacing: -1px; margin-bottom: 10px; }
        .logo span { color: var(--secondary); }
        .subtitle { font-size: 12px; color: var(--text); text-transform: uppercase; letter-spacing: 1px; }

        /* GRID LAYOUT */
        .test-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        /* TEST CARD */
        .card { 
            background: var(--panel); 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }
        .card:hover { border-color: var(--secondary); transform: translateY(-2px); }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .card-title { font-family: 'JetBrains Mono'; font-weight: 700; color: var(--text-bright); font-size: 13px; }
        .card-icon { font-size: 18px; opacity: 0.8; }
        
        .card-desc { font-size: 12px; color: var(--text); margin-bottom: 20px; line-height: 1.5; flex-grow: 1; }
        
        .result-box { 
            background: rgba(0,0,0,0.3); 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            padding: 10px; 
            margin-bottom: 15px; 
            font-family: 'JetBrains Mono'; 
            font-size: 11px; 
            color: var(--secondary); 
            min-height: 40px;
            display: flex;
            align-items: center;
        }
        
        .btn-group { display: flex; gap: 10px; }
        
        .btn { 
            flex: 1; 
            padding: 10px; 
            border-radius: 6px; 
            font-size: 11px; 
            font-weight: 700; 
            cursor: pointer; 
            text-transform: uppercase; 
            transition: 0.2s; 
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-bright);
        }
        
        .btn-run { background: var(--secondary); color: white; border: none; }
        .btn-run:hover { opacity: 0.9; }
        .btn-info:hover { border-color: var(--text-bright); }

        /* FULLSCREEN OVERLAY SYSTEM */
        .fs-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer;
        }
        .fs-content { width: 100%; height: 100%; position: relative; }
        .fs-msg { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            color: rgba(255,255,255,0.5); font-family: 'JetBrains Mono'; font-size: 12px; pointer-events: none;
            background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px;
        }
        .fs-close-hint {
            position: absolute; bottom: 20px; left: 0; width: 100%; text-align: center;
            color: rgba(255,255,255,0.3); font-size: 10px; pointer-events: none;
        }

        /* TOUCH CANVAS */
        canvas { touch-action: none; width: 100%; height: 100%; display: block; }
        
        /* MOVING OBJECTS FOR MOTION TESTS */
        .mover { 
            position: absolute; width: 50px; height: 50px; background: white; 
            animation: moveX 2s linear infinite alternate; 
        }
        @keyframes moveX { from { left: 0; } to { left: calc(100% - 50px); } }

        /* INSTRUCTION MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000;
            display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal {
            background: var(--panel); border: 1px solid var(--secondary); border-radius: 12px;
            padding: 30px; max-width: 500px; width: 90%;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.2);
        }
        .modal-title { font-family: 'JetBrains Mono'; font-size: 18px; color: var(--secondary); margin-bottom: 15px; }
        .modal-body { font-size: 13px; line-height: 1.6; color: var(--text-bright); margin-bottom: 25px; }
        .modal-steps { margin-left: 20px; margin-bottom: 20px; color: var(--text); font-size: 12px; }
        .modal-close { background: var(--border); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; float: right; font-weight: 700; }

        /* FAQ SECTION */
        .faq-container { max-width: 800px; margin: 60px auto 20px auto; }
        .faq-header { font-family: 'JetBrains Mono'; font-size: 16px; color: var(--secondary); margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .faq-item { background: var(--panel); border: 1px solid var(--border); margin-bottom: 10px; border-radius: 8px; overflow: hidden; }
        .faq-q { padding: 15px; cursor: pointer; font-weight: 700; display: flex; justify-content: space-between; font-size: 12px; color: var(--text-bright); }
        .faq-a { padding: 0 15px 15px 15px; color: var(--text); font-size: 12px; line-height: 1.5; display: none; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; }
        .faq-item.active .faq-a { display: block; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">CHECK<span>DISPLAY</span></div>
        <div class="subtitle">Browser-Based Screen Diagnostics</div>
    </div>

    <div class="test-grid" id="grid"></div>

    <div class="faq-container">
        <div class="faq-header">DISPLAY FAQ</div>
        <div id="faq-list"></div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-title" id="m-title"></div>
            <div class="modal-body" id="m-body"></div>
            <ul class="modal-steps" id="m-steps"></ul>
            <button class="modal-close" onclick="closeModal()">CLOSE</button>
        </div>
    </div>

    <div class="fs-overlay" id="fs-overlay" onclick="closeFullscreen()">
        <div class="fs-content" id="fs-content"></div>
        <div class="fs-msg" id="fs-msg">Tap to Exit</div>
        <div class="fs-close-hint">Touch screen to close test</div>
    </div>

    <script>
        // --- 1. DATA: ALL TESTS ---
        const tests = [
            // PIXEL & UNIFORMITY CHECKS
            { id: 'dead', title: 'Dead Pixel Test', icon: '⬛', desc: 'Cycles RGB colors to spot dead (black) pixels.', type: 'visual' },
            { id: 'stuck', title: 'Stuck Pixel Test', icon: '🟦', desc: 'Flashes colors to identify stuck (colored) pixels.', type: 'visual' },
            { id: 'white', title: 'White Screen', icon: '⬜', desc: 'Checks brightness uniformity and yellow tints.', type: 'visual' },
            { id: 'black', title: 'Black Screen', icon: '🌑', desc: 'Checks for backlight bleed (LCD) or true black (OLED).', type: 'visual' },
            { id: 'red', title: 'Red Screen', icon: '🟥', desc: 'Checks red sub-pixels.', type: 'visual' },
            { id: 'green', title: 'Green Screen', icon: '🟩', desc: 'Checks green sub-pixels.', type: 'visual' },
            { id: 'blue', title: 'Blue Screen', icon: '🟦', desc: 'Checks blue sub-pixels.', type: 'visual' },
            
            // GRADIENTS & COLOR
            { id: 'banding', title: 'Gradient Banding', icon: '🌈', desc: 'Tests color depth. Look for smooth transitions vs distinct lines.', type: 'visual' },
            { id: 'contrast', title: 'Contrast Test', icon: '🌗', desc: 'Displays grey bars to check black-level distinction.', type: 'visual' },
            { id: 'saturation', title: 'Saturation Test', icon: '🎨', desc: 'Checks color vibrancy.', type: 'visual' },
            { id: 'gamma', title: 'Gamma Test', icon: '📊', desc: 'Visual pattern to check gamma calibration.', type: 'visual' },
            { id: 'invert', title: 'Color Inversion', icon: '🔄', desc: 'Inverts screen colors logic check.', type: 'visual' },

            // TOUCH & RESPONSE
            { id: 'touch', title: 'Touchscreen Test', icon: '👆', desc: 'Draw on screen to find dead zones.', type: 'touch' },
            { id: 'multi', title: 'Multi-Touch Test', icon: '🖐️', desc: 'Detects how many fingers your screen supports.', type: 'touch' },
            { id: 'ghost', title: 'Ghost Touch', icon: '👻', desc: 'Leave screen idle to see if it registers fake taps.', type: 'touch' },
            { id: 'refresh', title: 'Refresh Rate', icon: '🔄', desc: 'Measures Hz (60vs120) via FPS counter.', type: 'logic' },
            { id: 'motion', title: 'Motion Blur', icon: '🏎️', desc: 'Fast moving object to check for trails/ghosting.', type: 'visual' },
            
            // BRIGHTNESS & FLICKER
            { id: 'flicker', title: 'Flicker Test', icon: '⚡', desc: 'Pattern to detect PWM flickering at low brightness.', type: 'visual' },
            { id: 'pwm', title: 'PWM Detection', icon: '📷', desc: 'Use another camera to see banding lines.', type: 'manual' },
            { id: 'burn', title: 'Burn-In Check', icon: '🔥', desc: 'Grey background to reveal OLED ghost images.', type: 'visual' },
            
            // SPECS & LOGIC
            { id: 'res', title: 'Resolution', icon: '📏', desc: 'Detects logical viewport resolution.', type: 'logic' },
            { id: 'dpr', title: 'Pixel Ratio', icon: '📱', desc: 'Detects Device Pixel Ratio (Retina/High-DPI).', type: 'logic' },
            { id: 'hdr', title: 'HDR Capability', icon: '🔆', desc: 'Checks if browser reports HDR support.', type: 'logic' },
            { id: 'gamut', title: 'Color Gamut', icon: '🎨', desc: 'Checks for P3 wide color support.', type: 'logic' },
            
            // PATTERNS
            { id: 'grid', title: 'Grid Alignment', icon: 'fff', desc: 'Checks screen geometry and distortion.', type: 'visual' },
            { id: 'sharpness', title: 'Sharpness Test', icon: '✏️', desc: 'Fine text and lines to check rendering clarity.', type: 'visual' },
            { id: 'moire', title: 'Moiré Pattern', icon: '🌀', desc: 'Interference pattern to check resolution limits.', type: 'visual' },
            { id: 'checker', title: 'Checkerboard', icon: '🏁', desc: 'Contrast and sharpness check.', type: 'visual' }
        ];

        // --- 2. RENDER GRID ---
        const grid = document.getElementById('grid');
        tests.forEach(test => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header">
                    <span class="card-title">${test.title}</span>
                    <span class="card-icon">${test.icon}</span>
                </div>
                <div class="card-desc">${test.desc}</div>
                <div class="result-box" id="res-${test.id}">Ready</div>
                <div class="btn-group">
                    <button class="btn btn-info" onclick="showInfo('${test.id}')">INFO</button>
                    <button class="btn btn-run" onclick="runTest('${test.id}')">RUN</button>
                </div>
            `;
            grid.appendChild(card);
        });

        // --- 3. FAQ SECTION ---
        const faqs = [
            { q: "What is a dead pixel?", a: "A pixel that doesn't light up (stays black). It is a hardware defect and usually cannot be fixed." },
            { q: "What is a stuck pixel?", a: "A pixel stuck on one color (Red, Green, or Blue). Sometimes rapid color flashing can unstuck it." },
            { q: "What is Burn-In?", a: "Permanent discoloration on OLED screens caused by static images (like status bars) displayed for too long." },
            { q: "60Hz vs 120Hz?", a: "120Hz refreshes the image twice as fast, resulting in smoother scrolling and animations." },
            { q: "What is PWM Flicker?", a: "Pulse Width Modulation. Screens flash on/off rapidly to lower brightness. Some people are sensitive to this and get headaches." },
            { q: "What is Backlight Bleed?", a: "On LCD screens, light leaking from the edges of the bezel, visible on dark screens." },
            { q: "Ghost Touch?", a: "When the phone registers touches you didn't make. Often caused by bad chargers or damaged digitizers." },
            { q: "IPS vs OLED?", a: "OLED has perfect blacks and infinite contrast. IPS (LCD) has no burn-in risk but greyer blacks." },
            { q: "What is HDR?", a: "High Dynamic Range. Brighter whites and deeper blacks for more realistic video playback." },
            { q: "Are these tests accurate?", a: "Yes, they use standard web technologies to display patterns. Hardware defects will be visible to your eye." }
        ];

        const faqList = document.getElementById('faq-list');
        faqs.forEach((f, i) => {
            const el = document.createElement('div');
            el.className = 'faq-item';
            el.innerHTML = `
                <div class="faq-q" onclick="toggleFaq(this)">${i+1}. ${f.q} <span>▼</span></div>
                <div class="faq-a">${f.a}</div>
            `;
            faqList.appendChild(el);
        });

        function toggleFaq(el) { el.parentElement.classList.toggle('active'); }

        // --- 4. TEST RUNNER ---
        function runTest(id) {
            const overlay = document.getElementById('fs-overlay');
            const content = document.getElementById('fs-content');
            const res = document.getElementById(`res-${id}`);

            // Reset Overlay
            content.innerHTML = '';
            content.style.background = '';
            content.className = 'fs-content';
            
            // --- LOGIC TESTS (No Overlay) ---
            if(id === 'res') {
                res.innerText = `${window.screen.width} x ${window.screen.height}`;
                return;
            }
            if(id === 'dpr') {
                res.innerText = `Ratio: ${window.devicePixelRatio.toFixed(2)}`;
                return;
            }
            if(id === 'hdr') {
                const hdr = window.matchMedia('(dynamic-range: high)').matches;
                res.innerText = hdr ? "HDR Supported" : "SDR Only";
                return;
            }
            if(id === 'gamut') {
                const p3 = window.matchMedia('(color-gamut: p3)').matches;
                res.innerText = p3 ? "Wide P3 Gamut" : "sRGB Standard";
                return;
            }
            if(id === 'refresh') {
                res.innerText = "Measuring...";
                measureFPS(res);
                return;
            }

            // --- VISUAL TESTS (Fullscreen Overlay) ---
            overlay.style.display = 'flex';
            requestFullScreen(overlay);

            if(id === 'white') content.style.background = '#ffffff';
            if(id === 'black' || id === 'dead') content.style.background = '#000000';
            if(id === 'red') content.style.background = '#ff0000';
            if(id === 'green') content.style.background = '#00ff00';
            if(id === 'blue') content.style.background = '#0000ff';
            
            if(id === 'stuck') {
                content.style.animation = "stuckFlash 0.5s infinite";
                let style = document.createElement('style');
                style.innerHTML = `@keyframes stuckFlash { 0% {background:red;} 33% {background:green;} 66% {background:blue;} }`;
                content.appendChild(style);
            }

            if(id === 'banding') content.style.background = 'linear-gradient(to right, #000, #fff)';
            if(id === 'contrast') {
                content.style.background = '#000';
                content.innerHTML = `<div style="display:flex; height:100%;"><div style="flex:1; background:#111;"></div><div style="flex:1; background:#222;"></div><div style="flex:1; background:#333;"></div></div>`;
            }
            if(id === 'saturation') {
                content.style.background = 'linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet)';
            }
            if(id === 'checker') {
                content.style.background = 'conic-gradient(#000 0.25turn, #fff 0.25turn 0.5turn, #000 0.5turn 0.75turn, #fff 0.75turn)';
                content.style.backgroundSize = '50px 50px';
            }
            
            // MOTION
            if(id === 'motion') {
                content.style.background = '#333';
                content.innerHTML = `<div class="mover"></div>`;
            }

            // TOUCH CANVAS
            if(id === 'touch' || id === 'multi') {
                content.innerHTML = '<canvas id="touchCanvas"></canvas>';
                initTouchCanvas(id, res);
                document.getElementById('fs-msg').innerText = "Draw / Tap";
            }
        }

        // --- 5. HELPERS ---
        function requestFullScreen(el) {
            if(el.requestFullscreen) el.requestFullscreen();
            else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        }

        function closeFullscreen() {
            document.getElementById('fs-overlay').style.display = 'none';
            if(document.exitFullscreen) document.exitFullscreen();
        }

        function measureFPS(output) {
            let frames = 0;
            let start = performance.now();
            function loop() {
                frames++;
                if(performance.now() - start >= 1000) {
                    output.innerText = `${frames} Hz`;
                } else {
                    requestAnimationFrame(loop);
                }
            }
            loop();
        }

        function initTouchCanvas(mode, resBox) {
            const canvas = document.getElementById('touchCanvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const ctx = canvas.getContext('2d');
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';

            // Prevent closing on draw
            canvas.onclick = (e) => e.stopPropagation();

            let fingers = 0;

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                fingers = e.touches.length;
                if(mode === 'multi') resBox.innerText = `${fingers} Fingers`;
                draw(e, ctx);
            }, {passive: false});

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                draw(e, ctx);
            }, {passive: false});

            canvas.addEventListener('touchend', (e) => {
                fingers = e.touches.length;
                if(mode === 'multi') resBox.innerText = fingers > 0 ? `${fingers} Fingers` : "Lifted";
            });
        }

        function draw(e, ctx) {
            for(let i=0; i<e.touches.length; i++) {
                const t = e.touches[i];
                ctx.beginPath();
                ctx.arc(t.clientX, t.clientY, 10, 0, Math.PI*2);
                ctx.fillStyle = `hsl(${i * 60}, 100%, 50%)`;
                ctx.fill();
            }
        }

        // --- 6. MODAL ---
        const instructions = {
            dead: { t: "Dead Pixel Test", b: "This test displays solid colors. Look closely for tiny black dots that do not light up.", s: ["Clean screen.", "Run test.", "Scan for black dots."] },
            touch: { t: "Touch Test", b: "Draw lines across the entire screen. If lines break or don't appear in certain spots, you have a dead zone.", s: ["Run test.", "Drag finger everywhere.", "Check for gaps."] },
            refresh: { t: "Refresh Rate", b: "Calculates how many frames per second your browser can render.", s: ["Click Run.", "Wait 1 second.", "Read value (60/90/120)."] },
            // Default
            default: { t: "Visual Check", b: "This displays a pattern or color to help you spot hardware defects.", s: ["Click Run.", "Observe screen.", "Tap to exit."] }
        };

        function showInfo(id) {
            const data = instructions[id] || instructions.default;
            document.getElementById('m-title').innerText = data.t;
            document.getElementById('m-body').innerText = data.b;
            const ul = document.getElementById('m-steps');
            ul.innerHTML = '';
            data.s.forEach(s => ul.innerHTML += `<li>${s}</li>`);
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
    </script>
    <script src="ctp-report.js"></script>
</body>
</html>
