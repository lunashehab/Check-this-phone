<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Titanium Display Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050505; 
            --panel: #0f1218; 
            --border: #2d3748; 
            --text: #a0aec0; 
            --text-bright: #e2e8f0;
            --accent: #f000ff; /* Neon Purple */
            --success: #00ff9d; 
            --danger: #ff0055; 
            --warn: #ffb700; 
        }
        
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 20px; margin: 0; min-height: 100vh; font-size: 14px; overflow-x: hidden; }
        
        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .logo { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 18px; color: var(--text-bright); letter-spacing: -1px; }
        .logo span { color: var(--accent); }
        .live-badge { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--success); font-weight: 700; background: rgba(0, 255, 157, 0.1); padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(0, 255, 157, 0.2); }
        .blink { animation: blink 1s infinite; width: 6px; height: 6px; background: var(--success); border-radius: 50%; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }

        /* HERO CARD (Refresh Rate) */
        .hero-card { background: radial-gradient(circle at top right, #1a202c, #0f1218); border: 1px solid var(--border); border-radius: 16px; padding: 25px; display: flex; justify-content: space-between; align-items: center; position: relative; overflow: hidden; margin-bottom: 20px; }
        .hero-left h3 { margin: 0; font-size: 12px; color: var(--text); text-transform: uppercase; letter-spacing: 1px; }
        .hero-left .big-val { font-family: 'JetBrains Mono', monospace; font-size: 48px; font-weight: 700; color: var(--text-bright); display: block; margin: 5px 0; }
        .hero-left .sub-val { font-size: 12px; color: var(--accent); font-weight: 700; display: flex; align-items: center; gap: 5px; }

        /* TOUCH CANVAS CONTAINER */
        .touch-zone { 
            background: #000; border: 2px dashed var(--border); border-radius: 12px; height: 250px; position: relative; overflow: hidden; margin-bottom: 20px;
            display: flex; justify-content: center; align-items: center;
        }
        .touch-instruction { position: absolute; pointer-events: none; color: var(--text); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
        canvas { width: 100%; height: 100%; touch-action: none; }

        /* COLOR GRID CONTROLS */
        .control-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .btn-test { background: var(--panel); border: 1px solid var(--border); color: var(--text-bright); padding: 15px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 11px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 5px; transition: 0.2s; }
        .btn-test:active { transform: scale(0.95); }
        .btn-icon { font-size: 18px; margin-bottom: 5px; }

        /* FULLSCREEN COLOR MODAL */
        #fullscreen-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: black; z-index: 9999; display: none; cursor: pointer;
        }
        .overlay-hint {
            position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.5); font-size: 12px; pointer-events: none;
            text-transform: uppercase; letter-spacing: 2px;
        }

        /* TERMINAL LOG */
        .terminal { background: #000; border: 1px solid var(--border); border-radius: 8px; padding: 10px; height: 120px; overflow: hidden; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--success); position: relative; }
        .log-line { margin-bottom: 2px; opacity: 0.8; }
        .terminal::after { content: ""; position: absolute; bottom: 0; left: 0; width: 100%; height: 30px; background: linear-gradient(to top, #000, transparent); }

        .back-btn { display: block; text-align: center; margin-top: 20px; color: var(--text); text-decoration: none; font-weight: 700; padding: 15px; background: var(--panel); border-radius: 12px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">TITANIUM<span>DISPLAY</span></div>
        <div class="live-badge"><div class="blink"></div> GPU SYNC ACTIVE</div>
    </div>

    <div class="hero-card">
        <div class="hero-left">
            <h3>Refresh Rate</h3>
            <span class="big-val" id="fps-counter">-- Hz</span>
            <span class="sub-val" id="fps-status">CALIBRATING SYNC...</span>
        </div>
        <div style="text-align: right; font-size: 10px; color: var(--text);">
            VSYNC: LOCKED<br>
            RENDER: GPU<br>
            BIT-DEPTH: 24-BIT
        </div>
    </div>

    <div class="touch-zone" id="touch-container">
        <div class="touch-instruction" id="touch-text">DRAG FINGER HERE<br>TO TEST DIGITIZER</div>
        <canvas id="touchCanvas"></canvas>
    </div>

    <div class="control-grid">
        <button class="btn-test" onclick="startColorTest('red')">
            <span class="btn-icon">🔴</span> DEAD PIXEL RED
        </button>
        <button class="btn-test" onclick="startColorTest('green')">
            <span class="btn-icon">🟢</span> DEAD PIXEL GREEN
        </button>
        <button class="btn-test" onclick="startColorTest('blue')">
            <span class="btn-icon">🔵</span> DEAD PIXEL BLUE
        </button>
        <button class="btn-test" onclick="startColorTest('white')">
            <span class="btn-icon">⚪</span> MAX BRIGHTNESS
        </button>
        <button class="btn-test" onclick="startColorTest('black')">
            <span class="btn-icon">⚫</span> OLED BLACK LEVEL
        </button>
        <button class="btn-test" onclick="startColorTest('gradient')">
            <span class="btn-icon">🌈</span> COLOR BANDING
        </button>
    </div>

    <div class="terminal" id="console-output">
        <div class="log-line">> DISPLAY DRIVER INIT... OK</div>
        <div class="log-line">> DETECTING RESOLUTION... </div>
        <div class="log-line">> WAITING FOR INPUT...</div>
    </div>

    <a href="../index.html" class="back-btn">EXIT LABORATORY</a>

    <div id="fullscreen-overlay" onclick="closeOverlay()">
        <div class="overlay-hint">TAP ANYWHERE TO CLOSE</div>
    </div>

    <script>
        // --- 1. SYSTEM LOGGING ---
        function log(msg) {
            const term = document.getElementById('console-output');
            const time = new Date().toLocaleTimeString().split(' ')[0];
            const line = document.createElement('div');
            line.className = 'log-line';
            line.innerHTML = `<span style="color:#64748b">[${time}]</span> ${msg}`;
            term.appendChild(line);
            if(term.children.length > 8) term.removeChild(term.children[0]);
            term.scrollTop = term.scrollHeight;
        }

        // --- 2. REFRESH RATE COUNTER (Real Hz) ---
        let lastLoop = new Date();
        let frameCount = 0;
        let fpsBuffer = [];

        function fpsLoop() { 
            let thisLoop = new Date();
            let fps = 1000 / (thisLoop - lastLoop);
            lastLoop = thisLoop;
            
            // Smooth out readings
            fpsBuffer.push(fps);
            if(fpsBuffer.length > 10) fpsBuffer.shift();
            let avgFps = Math.round(fpsBuffer.reduce((a,b)=>a+b)/fpsBuffer.length);

            // Update UI every 10 frames to stop flickering
            frameCount++;
            if(frameCount % 10 === 0) {
                document.getElementById('fps-counter').innerText = avgFps + " Hz";
                
                let status = "STANDARD MOTION";
                let color = "#a0aec0";
                
                if(avgFps > 85) { status = "HIGH REFRESH (PRO MOTION)"; color = "#00ff9d"; }
                if(avgFps > 115) { status = "ULTRA SMOOTH (120HZ+)"; color = "#f000ff"; }
                
                const statusEl = document.getElementById('fps-status');
                statusEl.innerText = status;
                statusEl.style.color = color;
            }
            requestAnimationFrame(fpsLoop);
        }
        requestAnimationFrame(fpsLoop);
        log("> FPS MONITOR STARTED");

        // --- 3. TOUCH DIGITIZER VISUALIZER ---
        const canvas = document.getElementById('touchCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('touch-container');

        function resizeCanvas() {
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let isDrawing = false;

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            // Handle both touch and mouse
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function startDraw(e) {
            isDrawing = true;
            document.getElementById('touch-text').style.display = 'none';
            log("> TOUCH INPUT DETECTED");
            draw(e);
        }

        function endDraw() { isDrawing = false; ctx.beginPath(); }

        function draw(e) {
            if(!isDrawing) return;
            e.preventDefault(); // Stop scrolling
            const pos = getPos(e);

            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#f000ff'; // Neon Purple
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#f000ff';

            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        // Event Listeners for Touch
        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('touchstart', startDraw);
        canvas.addEventListener('mouseup', endDraw);
        canvas.addEventListener('touchend', endDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchmove', draw);

        // --- 4. COLOR TESTS ---
        const overlay = document.getElementById('fullscreen-overlay');
        
        function startColorTest(type) {
            log(`> INITIATING SCREEN TEST: ${type.toUpperCase()}`);
            overlay.style.display = 'block';
            
            // Reset styles
            overlay.style.background = '';
            overlay.style.backgroundImage = '';

            if(type === 'red') overlay.style.background = '#ff0000';
            if(type === 'green') overlay.style.background = '#00ff00';
            if(type === 'blue') overlay.style.background = '#0000ff';
            if(type === 'white') overlay.style.background = '#ffffff';
            if(type === 'black') overlay.style.background = '#000000';
            
            if(type === 'gradient') {
                overlay.style.background = 'linear-gradient(to right, black, white)';
                log("> CHECK FOR SMOOTH BANDING");
            }
        }

        function closeOverlay() {
            overlay.style.display = 'none';
            log("> TEST PATTERN CLOSED");
        }

    </script>
</body>
</html>
