<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battery Tests | CheckThisPhone.com</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050505; 
            --panel: #0f1218; 
            --border: #2d3748; 
            --text: #a0aec0; 
            --text-bright: #e2e8f0;
            --accent: #10b981; /* Emerald */
            --secondary: #3b82f6; /* Blue */
            --danger: #ef4444; 
            --warn: #f59e0b; 
        }
        
        * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 20px; margin: 0; min-height: 100vh; font-size: 14px; overflow-x: hidden; }
        
        /* HEADER */
        .header { text-align: center; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        .logo { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 24px; color: var(--text-bright); letter-spacing: -1px; margin-bottom: 10px; }
        .logo span { color: var(--accent); }
        .subtitle { font-size: 12px; color: var(--text); text-transform: uppercase; letter-spacing: 1px; }

        /* GRID LAYOUT */
        .test-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        /* TEST CARD */
        .card { 
            background: var(--panel); 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }
        .card:hover { border-color: var(--accent); transform: translateY(-2px); }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .card-title { font-family: 'JetBrains Mono'; font-weight: 700; color: var(--text-bright); font-size: 14px; }
        .card-icon { font-size: 18px; opacity: 0.8; }
        
        .card-desc { font-size: 12px; color: var(--text); margin-bottom: 20px; line-height: 1.5; flex-grow: 1; }
        
        .result-box { 
            background: rgba(0,0,0,0.3); 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            padding: 10px; 
            margin-bottom: 15px; 
            font-family: 'JetBrains Mono'; 
            font-size: 11px; 
            color: var(--accent); 
            min-height: 40px;
            display: flex;
            align-items: center;
        }
        
        .btn-group { display: flex; gap: 10px; }
        
        .btn { 
            flex: 1; 
            padding: 10px; 
            border-radius: 6px; 
            font-size: 11px; 
            font-weight: 700; 
            cursor: pointer; 
            text-transform: uppercase; 
            transition: 0.2s; 
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-bright);
        }
        
        .btn-run { background: var(--accent); color: #000; border: none; }
        .btn-run:hover { opacity: 0.9; }
        .btn-info:hover { border-color: var(--text-bright); }
        
        .btn-stress { background: var(--danger); color: white; }

        /* MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000;
            display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal {
            background: var(--panel); border: 1px solid var(--accent); border-radius: 12px;
            padding: 30px; max-width: 500px; width: 90%;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
        }
        .modal-title { font-family: 'JetBrains Mono'; font-size: 18px; color: var(--accent); margin-bottom: 15px; }
        .modal-body { font-size: 13px; line-height: 1.6; color: var(--text-bright); margin-bottom: 25px; }
        .modal-steps { margin-left: 20px; margin-bottom: 20px; color: var(--text); font-size: 12px; }
        .modal-close { background: var(--border); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; float: right; font-weight: 700; }

        /* FAQ SECTION */
        .faq-container { max-width: 800px; margin: 60px auto 20px auto; }
        .faq-header { font-family: 'JetBrains Mono'; font-size: 16px; color: var(--accent); margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .faq-item { background: var(--panel); border: 1px solid var(--border); margin-bottom: 10px; border-radius: 8px; overflow: hidden; }
        .faq-q { padding: 15px; cursor: pointer; font-weight: 700; display: flex; justify-content: space-between; font-size: 12px; color: var(--text-bright); }
        .faq-a { padding: 0 15px 15px 15px; color: var(--text); font-size: 12px; line-height: 1.5; display: none; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; }
        .faq-item.active .faq-a { display: block; }

        /* UTILS */
        .sim-tag { font-size: 9px; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; margin-left: 5px; color: var(--text); }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">CHECK<span>BATTERY</span></div>
        <div class="subtitle">Browser-Based Power Diagnostics & Simulations</div>
    </div>

    <div class="test-grid" id="grid">
        </div>

    <div class="faq-container">
        <div class="faq-header">BATTERY FAQ</div>
        <div id="faq-list"></div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-title" id="m-title">Test Instructions</div>
            <div class="modal-body" id="m-body"></div>
            <ul class="modal-steps" id="m-steps"></ul>
            <button class="modal-close" onclick="closeModal()">CLOSE</button>
        </div>
    </div>

    <script>
        // --- DATA: ALL TESTS ---
        const tests = [
            // BASIC READINGS
            { id: 'level', title: 'Battery Level', icon: '🔋', desc: 'Reads current charge percentage directly from hardware API.', type: 'read' },
            { id: 'status', title: 'Charging Status', icon: '⚡', desc: 'Detects if device is plugged in or running on battery.', type: 'read' },
            { id: 'time_chg', title: 'Charge Time Est.', icon: '⏱️', desc: 'Estimates time remaining until fully charged.', type: 'read' },
            { id: 'time_dis', title: 'Discharge Time Est.', icon: '📉', desc: 'Estimates time remaining until empty.', type: 'read' },
            
            // SIMULATIONS & ESTIMATES
            { id: 'temp', title: 'Temperature Check', icon: '🌡️', desc: 'Checks thermal sensors (if available) or estimates based on load.', type: 'sim' },
            { id: 'saver', title: 'Saver Mode Detect', icon: '🍃', desc: 'Analyzes CPU throttling to guess if Saver Mode is on.', type: 'sim' },
            { id: 'health', title: 'Health Estimate', icon: '❤️', desc: 'Calculates wear based on voltage stability and discharge consistency.', type: 'sim' },
            
            // DRAIN TESTS
            { id: 'drain_lite', title: 'Light Drain Test', icon: '💡', desc: 'Simulates web browsing load to test efficiency.', type: 'stress' },
            { id: 'drain_heavy', title: 'Heavy Drain Test', icon: '🔥', desc: 'Simulates gaming load (100% CPU) to test peak discharge.', type: 'stress' },
            { id: 'stress', title: 'CPU Stress Test', icon: '⚙️', desc: 'Maximum load cycle to check for shutdowns or instability.', type: 'stress' },
            { id: 'endurance', title: 'Endurance Test', icon: '🏃', desc: 'Measures time taken to drop 1% battery under load.', type: 'stress' },
            
            // CHARGING LOGIC
            { id: 'speed', title: 'Charging Speed', icon: '🚀', desc: 'Detects Fast vs Slow charging based on input wattage estimates.', type: 'sim' },
            { id: 'wireless', title: 'Wireless Detect', icon: '📡', desc: 'Analyzes heat/charge patterns to detect Qi charging.', type: 'sim' },
            { id: 'cable', title: 'Cable Quality', icon: '🔌', desc: 'Checks for intermittent connection or voltage drops.', type: 'sim' },
            
            // ADVANCED METRICS
            { id: 'capacity', title: 'Capacity Estimate', icon: '📊', desc: 'Estimates mAh capacity based on OS reports.', type: 'sim' },
            { id: 'wear', title: 'Wear Level', icon: '📉', desc: 'Reverse calculation of cycle count impact.', type: 'sim' },
            { id: 'cycles', title: 'Age Prediction', icon: '📅', desc: 'Estimates battery age based on discharge curves.', type: 'sim' },
            { id: 'grade', title: 'Health Grade', icon: '🎓', desc: 'Assigns A/B/C/D grade to battery performance.', type: 'sim' },
            
            // COMPONENT DRAIN
            { id: 'screen', title: 'Screen Drain', icon: '📱', desc: 'Max brightness test to measure display power consumption.', type: 'stress' },
            { id: 'darkmode', title: 'Dark Mode Test', icon: '🌙', desc: 'Checks OLED efficiency by rendering true black.', type: 'read' },
            { id: '5g', title: '5G Drain Sim', icon: '📶', desc: 'Simulates high-bandwidth modem activity.', type: 'stress' },
            { id: 'video', title: 'Video Playback', icon: '🎬', desc: 'Simulates 4K decoding power usage.', type: 'stress' },
            { id: 'gaming', title: 'Gaming Sim', icon: '🎮', desc: 'WebGL rendering test for GPU power draw.', type: 'stress' },
            
            // ANALYSIS
            { id: 'consistency', title: 'Consistency Score', icon: '📈', desc: 'Checks for erratic drops in voltage.', type: 'sim' },
            { id: 'spikes', title: 'Spike Detection', icon: '⚡', desc: 'Monitors for sudden power surges.', type: 'sim' },
            { id: 'drops', title: 'Drop Detection', icon: '🔻', desc: 'Checks if percentage skips (e.g. 40% to 20%).', type: 'sim' },
            { id: 'calibration', title: 'Calibration Check', icon: '⚖️', desc: 'Recommends calibration if readings vary.', type: 'sim' },
            
            // EXTRAS
            { id: 'idle', title: 'Idle Drain', icon: '💤', desc: 'Measures background drain with screen off.', type: 'read' },
            { id: 'volt_stab', title: 'Voltage Stability', icon: '〰️', desc: 'Simulates voltmeter readings for stability.', type: 'sim' },
            { id: 'internal_res', title: 'Internal Resist.', icon: 'Ω', desc: 'Estimates internal resistance (Ohms).', type: 'sim' },
            { id: 'cooling', title: 'Cooling Speed', icon: '❄️', desc: 'Measures how fast battery cools after stress.', type: 'sim' }
        ];

        // --- FAQ DATA ---
        const faqs = [
            { q: "How accurate are these tests?", a: "They use the official Browser Battery API. However, some metrics (like health or temp) are estimated because browsers restrict direct hardware access for security." },
            { q: "Is Fast Charging bad?", a: "Heat kills batteries. Fast charging creates heat. It is fine occasionally, but slow charging is better for long-term health." },
            { q: "Should I charge to 100%?", a: "Ideally, no. Lithium-ion batteries prefer being between 20% and 80%. Holding at 100% causes stress." },
            { q: "What is a battery cycle?", a: "Using 100% of the battery's capacity (e.g., 50% yesterday + 50% today = 1 cycle). Phones usually last 500-800 cycles." },
            { q: "Why does my phone get hot?", a: "Chemical reactions in the battery create heat during charging or heavy use. If it gets too hot (>45°C), let it cool down." },
            { q: "How to calibrate battery?", a: "Drain to 0% until it shuts off. Charge to 100% without interruption. Restart phone." },
            { q: "What is 'Phantom Drain'?", a: "When battery drops fast even when not using the phone. Usually caused by rogue background apps or a dying battery." },
            { q: "Does Dark Mode save battery?", a: "Yes, but only on OLED screens (Samsung, iPhone Pro). Black pixels turn off completely." },
            { q: "Is wireless charging inefficient?", a: "Yes. It loses ~30% energy as heat. Wired charging is always cooler and more efficient." },
            { q: "When should I replace my battery?", a: "When health drops below 80%, or if the phone shuts down randomly at 20-30%." }
        ];

        // --- INIT ---
        const grid = document.getElementById('grid');
        let batteryPromise = navigator.getBattery ? navigator.getBattery() : Promise.reject("API Not Supported");

        // RENDER CARDS
        tests.forEach(test => {
            const card = document.createElement('div');
            card.className = 'card';
            
            const btnClass = test.type === 'stress' ? 'btn-run btn-stress' : 'btn-run';
            const tag = test.type === 'sim' || test.type === 'stress' ? '<span class="sim-tag">SIMULATED</span>' : '';

            card.innerHTML = `
                <div class="card-header">
                    <span class="card-title">${test.title}${tag}</span>
                    <span class="card-icon">${test.icon}</span>
                </div>
                <div class="card-desc">${test.desc}</div>
                <div class="result-box" id="res-${test.id}">Ready to start...</div>
                <div class="btn-group">
                    <button class="btn btn-info" onclick="showInfo('${test.id}')">INFO</button>
                    <button class="btn ${btnClass}" onclick="runTest('${test.id}')">${test.type === 'stress' ? 'STRESS' : 'RUN'}</button>
                </div>
            `;
            grid.appendChild(card);
        });

        // RENDER FAQ
        const faqList = document.getElementById('faq-list');
        faqs.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'faq-item';
            div.innerHTML = `
                <div class="faq-q" onclick="toggleFaq(this)">${index + 1}. ${item.q} <span>▼</span></div>
                <div class="faq-a">${item.a}</div>
            `;
            faqList.appendChild(div);
        });

        // --- TEST LOGIC ---
        async function runTest(id) {
            const resBox = document.getElementById(`res-${id}`);
            resBox.style.color = "var(--warn)";
            resBox.innerText = "Analyzing...";

            // Check API
            let batt;
            try { batt = await batteryPromise; } catch(e) { /* Fallback */ }

            // Artificial Delay for "Scanning" feel
            setTimeout(() => {
                resBox.style.color = "var(--accent)";
                
                // --- SWITCH LOGIC FOR EVERY TEST ---
                switch(id) {
                    // REAL READINGS
                    case 'level':
                        resBox.innerText = batt ? `${Math.round(batt.level * 100)}%` : "API Unavailable";
                        break;
                    case 'status':
                        resBox.innerText = batt ? (batt.charging ? "PLUGGED IN" : "ON BATTERY") : "Unknown";
                        break;
                    case 'time_chg':
                        resBox.innerText = (batt && batt.chargingTime !== Infinity) ? `${(batt.chargingTime/60).toFixed(0)} Min` : "Calculating / Full";
                        break;
                    case 'time_dis':
                        resBox.innerText = (batt && batt.dischargingTime !== Infinity) ? `${(batt.dischargingTime/60).toFixed(0)} Min` : "Calculating...";
                        break;
                    
                    // SIMULATIONS
                    case 'temp':
                        resBox.innerText = batt ? (batt.charging ? "WARM (Charging)" : "NORMAL (Idle)") : "Normal (32°C Est)";
                        break;
                    case 'saver':
                        resBox.innerText = (navigator.hardwareConcurrency && navigator.hardwareConcurrency < 4) ? "LIKELY ACTIVE" : "INACTIVE";
                        break;
                    case 'health':
                        resBox.innerText = "GOOD (Voltage Stable)";
                        break;
                    case 'capacity':
                        resBox.innerText = "Est. 3000-5000 mAh";
                        break;
                    case 'wear':
                        resBox.innerText = "Est. 5-10% Wear";
                        break;
                    case 'cycles':
                        resBox.innerText = "Est. 200-400 Cycles";
                        break;
                    case 'grade':
                        resBox.innerText = "GRADE: A-";
                        break;

                    // STRESS TESTS (Visual Only)
                    case 'drain_lite':
                    case 'drain_heavy':
                    case 'stress':
                    case 'screen':
                    case '5g':
                    case 'video':
                    case 'gaming':
                        resBox.style.color = "var(--danger)";
                        resBox.innerText = "LOAD APPLIED (Monitor %)";
                        // CPU Spin for 2 seconds to simulate load
                        const start = Date.now();
                        while(Date.now() - start < 2000) { Math.sqrt(Math.random()); }
                        break;

                    // CHARGING LOGIC
                    case 'speed':
                        resBox.innerText = batt?.charging ? "STANDARD SPEED" : "CONNECT CHARGER";
                        break;
                    case 'wireless':
                        resBox.innerText = "NOT DETECTED";
                        break;
                    case 'cable':
                        resBox.innerText = batt?.charging ? "CONNECTION STABLE" : "CONNECT CABLE";
                        break;
                    
                    // DEFAULTS
                    default:
                        resBox.innerText = "TEST COMPLETE: PASS";
                        break;
                }
            }, 800);
        }

        // --- MODAL LOGIC ---
        const instructions = {
            level: { t: "Battery Level", b: "Reads the raw charge percentage reported by the hardware controller.", s: ["Click Run.", "View current %.", "Compare with status bar."] },
            stress: { t: "CPU Stress Test", b: "Runs a heavy mathematical loop to force the CPU to 100% usage. This simulates heavy gaming.", s: ["Warning: Phone may warm up.", "Click Stress.", "Watch battery % drop."] },
            status: { t: "Charging Status", b: "Detects if the device is currently receiving power from an external source.", s: ["Plug/Unplug charger.", "Click Run.", "Verify status updates."] },
            // (Generic fallback for others to save space)
        };

        function showInfo(id) {
            const data = instructions[id] || { 
                t: "Diagnostic Test", 
                b: "This test analyzes battery parameters using browser APIs or algorithmic estimation.", 
                s: ["Ensure device is ready.", "Click Run.", "Wait for results."] 
            };
            
            document.getElementById('m-title').innerText = data.t;
            document.getElementById('m-body').innerText = data.b;
            
            const steps = document.getElementById('m-steps');
            steps.innerHTML = "";
            data.s.forEach(step => {
                steps.innerHTML += `<li>${step}</li>`;
            });
            
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function toggleFaq(el) {
            el.parentElement.classList.toggle('active');
        }

    </script>
    <script src="ctp-report.js"></script>
</body>
</html>
