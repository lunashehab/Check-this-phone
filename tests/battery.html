<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Battery Diagnostic</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #0f172a; 
            color: #f8fafc; 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .icon-pulse { font-size: 48px; display: block; margin-bottom: 10px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* BATTERY VISUALIZER */
        .battery-shell {
            width: 150px;
            height: 260px;
            border: 4px solid #334155;
            border-radius: 20px;
            position: relative;
            margin-bottom: 30px;
            background: #1e293b;
            padding: 5px;
        }
        .battery-shell::before {
            content: "";
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 10px;
            background: #334155;
            border-radius: 4px 4px 0 0;
        }
        .battery-level {
            width: 100%;
            height: 0%; /* JS will change this */
            background: linear-gradient(to top, #10b981, #34d399);
            border-radius: 12px;
            position: absolute;
            bottom: 5px;
            left: 5px;
            width: calc(100% - 10px);
            transition: height 1s ease-in-out;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        /* DATA GRID */
        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }
        .data-card {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        .data-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .data-value { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; color: white; }

        .btn { padding: 15px 30px; background: #3b82f6; color: white; border: none; border-radius: 12px; font-size: 14px; cursor: pointer; text-decoration: none; font-weight: bold; margin-top: 40px; display: inline-block; }

        .scan-line { height: 2px; width: 100%; background: #10b981; position: absolute; top: 0; left: 0; animation: scan 2s linear infinite; opacity: 0.5; display: none; }
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }
    </style>
</head>
<body>

    <div class="header">
        <span class="icon-pulse">⚡</span>
        <h2 style="margin: 0;">Power Diagnostics</h2>
        <div style="color: #94a3b8; font-size: 12px; margin-top: 5px;">Reading Sensor Data...</div>
    </div>

    <div class="battery-shell">
        <div class="battery-level" id="visual-level"></div>
        <div class="scan-line" id="scanner"></div>
    </div>

    <div class="data-grid">
        <div class="data-card">
            <div class="data-label">Level</div>
            <div class="data-value" id="real-level">--%</div>
        </div>
        <div class="data-card">
            <div class="data-label">Status</div>
            <div class="data-value" id="real-status">Checking...</div>
        </div>
        <div class="data-card">
            <div class="data-label">Voltage</div>
            <div class="data-value" id="sim-voltage">3.82V</div>
        </div>
        <div class="data-card">
            <div class="data-label">Health</div>
            <div class="data-value" style="color: #10b981;" id="sim-health">Good</div>
        </div>
    </div>

    <a href="../index.html" class="btn">← Return to Dashboard</a>

    <script>
        // 1. GET REAL BATTERY DATA (If browser allows)
        navigator.getBattery().then(function(battery) {
            
            // Get Real Level
            const level = Math.round(battery.level * 100);
            updateBatteryVisuals(level);

            // Get Real Charging Status
            updateChargingStatus(battery.charging);

            // Listen for changes (If user plugs/unplugs charger live!)
            battery.addEventListener('chargingchange', function() {
                updateChargingStatus(battery.charging);
            });
            
            battery.addEventListener('levelchange', function() {
                updateBatteryVisuals(Math.round(battery.level * 100));
            });

        }).catch(function(e) {
            // Fallback if browser blocks access
            console.log("Battery API not supported on this device.");
            updateBatteryVisuals(84); // Simulated value
            document.getElementById('real-status').innerText = "Discharging";
        });

        function updateBatteryVisuals(level) {
            document.getElementById('real-level').innerText = level + "%";
            document.getElementById('visual-level').style.height = level + "%";
            
            // Color Logic
            const bar = document.getElementById('visual-level');
            if(level < 20) bar.style.background = "#ef4444"; // Red
            else if(level < 50) bar.style.background = "#f59e0b"; // Orange
            else bar.style.background = "linear-gradient(to top, #10b981, #34d399)"; // Green
        }

        function updateChargingStatus(isCharging) {
            const statusBox = document.getElementById('real-status');
            if(isCharging) {
                statusBox.innerText = "CHARGING ⚡";
                statusBox.style.color = "#fbbf24";
                document.getElementById('scanner').style.display = 'block'; // Show scan effect when charging
            } else {
                statusBox.innerText = "On Battery";
                statusBox.style.color = "#white";
                document.getElementById('scanner').style.display = 'none';
            }
        }

        // 2. SIMULATE ADVANCED VOLTAGE FLUCTUATION
        // (This makes it look like it's reading a live sensor stream)
        setInterval(() => {
            // Randomly fluctuate between 3.80V and 4.20V
            const voltage = (Math.random() * (4.20 - 3.80) + 3.80).toFixed(2);
            document.getElementById('sim-voltage').innerText = voltage + "V";
        }, 800);

    </script>
</body>
</html>
