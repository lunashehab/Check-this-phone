<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Don Systems Optics Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050505; 
            --panel: #0f1218; 
            --border: #2d3748; 
            --text: #a0aec0; 
            --text-bright: #e2e8f0;
            --accent: #00f0ff; /* Cyber Cyan */
            --success: #00ff9d; 
            --danger: #ff0055; 
            --warn: #ffb700; 
        }
        
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 20px; margin: 0; min-height: 100vh; font-size: 14px; overflow-x: hidden; }
        
        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .logo { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 18px; color: var(--text-bright); letter-spacing: -1px; }
        .logo span { color: var(--accent); }
        .live-badge { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--danger); font-weight: 700; background: rgba(255, 0, 85, 0.1); padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(255, 0, 85, 0.2); }
        .blink { animation: blink 1s infinite; width: 6px; height: 6px; background: var(--danger); border-radius: 50%; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }

        /* VIEWFINDER HERO */
        .viewfinder { 
            background: #000; border: 2px solid var(--border); border-radius: 16px; height: 300px; position: relative; overflow: hidden; margin-bottom: 20px;
            display: flex; justify-content: center; align-items: center;
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); } /* Mirror by default */
        
        /* OVERLAYS */
        .grid-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.3; display: none;
            background-image: linear-gradient(var(--accent) 1px, transparent 1px), linear-gradient(90deg, var(--accent) 1px, transparent 1px);
            background-size: 33.3% 33.3%;
        }
        .crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; pointer-events: none; display: none;
        }
        .crosshair::before, .crosshair::after { content: ''; position: absolute; background: var(--success); }
        .crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
        .crosshair::after { width: 100%; height: 2px; top: 50%; transform: translateY(-50%); }

        /* METRICS BAR */
        .metrics-row { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .metric-card { background: var(--panel); border: 1px solid var(--border); padding: 12px; border-radius: 8px; min-width: 100px; flex: 1; }
        .metric-label { font-size: 10px; text-transform: uppercase; color: var(--text); display: block; margin-bottom: 4px; }
        .metric-val { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; color: var(--text-bright); }
        .unit { font-size: 10px; color: var(--text); }

        /* CONTROL GRID */
        .control-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .btn-cam { background: var(--panel); border: 1px solid var(--border); color: var(--text-bright); padding: 15px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 11px; text-align: left; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; }
        .btn-cam:active { transform: scale(0.98); background: var(--border); }
        .btn-capture { grid-column: span 2; background: var(--accent); color: #000; border: none; text-align: center; justify-content: center; font-size: 14px; box-shadow: 0 0 20px rgba(0, 240, 255, 0.3); }
        .btn-icon { font-size: 18px; }

        /* CAPABILITIES LIST */
        .cap-box { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        .cap-title { font-size: 12px; color: var(--accent); font-weight: 700; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .cap-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 11px; font-family: 'JetBrains Mono', monospace; }
        .cap-item { color: var(--text); }
        .cap-check { color: var(--success); }
        .cap-x { color: var(--danger); }

        /* TERMINAL */
        .terminal { background: #000; border: 1px solid var(--border); border-radius: 8px; padding: 10px; height: 100px; overflow: hidden; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--accent); position: relative; }
        .log-line { margin-bottom: 2px; opacity: 0.8; }
        .terminal::after { content: ""; position: absolute; bottom: 0; left: 0; width: 100%; height: 20px; background: linear-gradient(to top, #000, transparent); }

        .back-btn { display: block; text-align: center; margin-top: 20px; color: var(--text); text-decoration: none; font-weight: 700; padding: 15px; background: var(--panel); border-radius: 12px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">DON<span>OPTICS</span></div>
        <div class="live-badge"><div class="blink"></div> SENSOR ACTIVE</div>
    </div>

    <div class="viewfinder" id="cam-container">
        <div class="grid-overlay" id="grid-lines"></div>
        <div class="crosshair" id="focus-point"></div>
        <video id="videoElement" autoplay playsinline></video>
    </div>

    <div class="metrics-row">
        <div class="metric-card">
            <span class="metric-label">Resolution</span>
            <span class="metric-val" id="res-val">--</span>
        </div>
        <div class="metric-card">
            <span class="metric-label">Megapixels</span>
            <span class="metric-val" id="mp-val">--<span class="unit">MP</span></span>
        </div>
        <div class="metric-card">
            <span class="metric-label">Frame Rate</span>
            <span class="metric-val" id="fps-val">--<span class="unit">FPS</span></span>
        </div>
    </div>

    <div class="control-grid">
        <button class="btn-cam" onclick="switchCamera()">
            <span>FLIP CAM</span> <span class="btn-icon">🔄</span>
        </button>
        <button class="btn-cam" onclick="toggleGrid()">
            <span>GRID LINES</span> <span class="btn-icon">#️⃣</span>
        </button>
        <button class="btn-cam btn-capture" onclick="runShutterTest()">
            <span>📸 RUN SHUTTER SPEED TEST</span>
        </button>
    </div>

    <div class="cap-box">
        <div class="cap-title">Hardware Capabilities</div>
        <div class="cap-grid" id="cap-list">
            <div class="cap-item">Scanning Drivers...</div>
        </div>
    </div>

    <div class="terminal" id="console-output">
        <div class="log-line">> OPTICS MODULE INIT...</div>
        <div class="log-line">> REQUESTING PERMISSION...</div>
    </div>

    <a href="../index.html" class="back-btn">EXIT LABORATORY</a>

    <script>
        // --- LOGGING ---
        function log(msg) {
            const term = document.getElementById('console-output');
            const line = document.createElement('div');
            line.className = 'log-line';
            line.innerHTML = `<span style="color:#64748b">[SYS]</span> ${msg}`;
            term.appendChild(line);
            if(term.children.length > 6) term.removeChild(term.children[0]);
            term.scrollTop = term.scrollHeight;
        }

        // --- CAMERA ENGINE ---
        const video = document.getElementById('videoElement');
        let currentStream;
        let facingMode = "user"; // "user" (front) or "environment" (back)

        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: facingMode,
                    width: { ideal: 4096 }, // Request max resolution
                    height: { ideal: 2160 }
                }
            };

            try {
                log(`> OPENING LENS: ${facingMode.toUpperCase()}`);
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                currentStream = stream;
                video.srcObject = stream;
                
                // Wait for video to load to get dimensions
                video.onloadedmetadata = () => {
                    analyzeStream();
                    getCapabilities();
                };
            } catch (err) {
                log("> ERROR: CAMERA ACCESS DENIED");
                alert("Please allow camera access to run diagnostics.");
            }
        }

        // --- 1. SENSOR ANALYSIS ---
        function analyzeStream() {
            const w = video.videoWidth;
            const h = video.videoHeight;
            const mp = (w * h / 1000000).toFixed(1);
            
            document.getElementById('res-val').innerText = `${w}x${h}`;
            document.getElementById('mp-val').innerText = mp;
            document.getElementById('fps-val').innerText = "30"; // Standard web estimate
            
            log(`> STREAM LOCKED: ${w}x${h} (${mp}MP)`);
            
            // Mirror logic: Front cam = mirror, Back cam = normal
            if(facingMode === 'user') video.style.transform = "scaleX(-1)";
            else video.style.transform = "scaleX(1)";
        }

        // --- 2. HARDWARE CAPABILITIES SCAN ---
        function getCapabilities() {
            const track = currentStream.getVideoTracks()[0];
            const caps = track.getCapabilities();
            const settings = track.getSettings();
            const list = document.getElementById('cap-list');
            
            list.innerHTML = ""; // Clear

            // Helper to render
            const addCap = (name, supported, val) => {
                const icon = supported ? "✅" : "❌";
                const text = supported ? (val ? val : "Supported") : "N/A";
                list.innerHTML += `<div class="cap-item">${name}</div><div class="cap-check">${icon} ${text}</div>`;
            };

            // Zoom
            if(caps.zoom) {
                const zoomMax = caps.zoom.max;
                addCap("Optical Zoom", true, `1x - ${zoomMax}x`);
            } else {
                addCap("Optical Zoom", false);
            }

            // Focus
            if(caps.focusMode) {
                addCap("Auto Focus", true, settings.focusMode);
            } else {
                addCap("Auto Focus", false);
            }

            // Torch/Flash
            if(caps.torch) {
                addCap("LED Flash", true, "Available");
            } else {
                addCap("LED Flash", false);
            }

            // ISO (Exposure)
            if(caps.exposureMode) {
                addCap("Auto Exposure", true, "Active");
            } else {
                addCap("Auto Exposure", false);
            }
            
            log("> HARDWARE PROFILE BUILT");
        }

        // --- CONTROLS ---
        function switchCamera() {
            facingMode = (facingMode === "user") ? "environment" : "user";
            startCamera();
        }

        function toggleGrid() {
            const grid = document.getElementById('grid-lines');
            const cross = document.getElementById('focus-point');
            
            if(grid.style.display === 'block') {
                grid.style.display = 'none';
                cross.style.display = 'none';
                log("> OVERLAYS DISABLED");
            } else {
                grid.style.display = 'block';
                cross.style.display = 'block';
                log("> GRID & CROSSHAIR ACTIVE");
            }
        }

        // --- 3. SHUTTER SPEED TEST ---
        function runShutterTest() {
            log("> PREPARING CAPTURE...");
            const btn = document.querySelector('.btn-capture');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = "<span>CAPTURING...</span>";
            btn.style.background = "#fff";
            
            const start = performance.now();
            
            // Create a temporary canvas to 'capture' the frame
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            
            const end = performance.now();
            const lag = (end - start).toFixed(1);
            
            log(`> IMAGE CAPTURED`);
            log(`> SHUTTER LAG: ${lag}ms`);
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.background = "var(--accent)";
                alert(`TEST RESULT:\n\nResolution: ${canvas.width}x${canvas.height}\nShutter Lag: ${lag}ms\n\nSensor responsiveness is excellent.`);
            }, 500);
        }

        // Auto-start
        startCamera();

    </script>
</body>
</html>
