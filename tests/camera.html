<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera Tests | CheckThisPhone.com</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050505; 
            --panel: #0f1218; 
            --border: #2d3748; 
            --text: #a0aec0; 
            --text-bright: #e2e8f0;
            --accent: #f43f5e; /* Rose */
            --secondary: #3b82f6; /* Blue */
            --danger: #ef4444; 
            --warn: #f59e0b; 
        }
        
        * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 20px; margin: 0; min-height: 100vh; font-size: 14px; overflow-x: hidden; }
        
        /* HEADER */
        .header { text-align: center; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        .logo { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 24px; color: var(--text-bright); letter-spacing: -1px; margin-bottom: 10px; }
        .logo span { color: var(--accent); }
        .subtitle { font-size: 12px; color: var(--text); text-transform: uppercase; letter-spacing: 1px; }

        /* GRID LAYOUT */
        .test-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        /* TEST CARD */
        .card { 
            background: var(--panel); 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }
        .card:hover { border-color: var(--accent); transform: translateY(-2px); }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .card-title { font-family: 'JetBrains Mono'; font-weight: 700; color: var(--text-bright); font-size: 13px; }
        .card-icon { font-size: 18px; opacity: 0.8; }
        
        .card-desc { font-size: 12px; color: var(--text); margin-bottom: 20px; line-height: 1.5; flex-grow: 1; }
        
        .result-box { 
            background: rgba(0,0,0,0.3); 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            padding: 10px; 
            margin-bottom: 15px; 
            font-family: 'JetBrains Mono'; 
            font-size: 11px; 
            color: var(--accent); 
            min-height: 40px;
            display: flex;
            align-items: center;
        }
        
        .btn-group { display: flex; gap: 10px; }
        
        .btn { 
            flex: 1; 
            padding: 10px; 
            border-radius: 6px; 
            font-size: 11px; 
            font-weight: 700; 
            cursor: pointer; 
            text-transform: uppercase; 
            transition: 0.2s; 
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-bright);
        }
        
        .btn-run { background: var(--accent); color: white; border: none; }
        .btn-run:hover { opacity: 0.9; }
        .btn-info:hover { border-color: var(--text-bright); }

        /* CAMERA OVERLAY */
        .cam-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: none;
            flex-direction: column;
        }
        .cam-view {
            flex: 1; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { display: none; } /* Hidden canvas for analysis */
        
        .cam-controls {
            height: 120px; background: var(--panel); border-top: 1px solid var(--border);
            display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;
        }
        .cam-msg { font-family: 'JetBrains Mono'; color: var(--accent); margin-bottom: 10px; font-size: 12px; text-align: center; }
        .cam-actions { display: flex; gap: 20px; }
        .cam-btn { 
            padding: 10px 30px; border-radius: 20px; border: none; font-weight: 800; cursor: pointer; text-transform: uppercase;
        }
        .btn-pass { background: var(--accent); color: white; }
        .btn-fail { background: var(--danger); color: white; }
        .btn-close { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.5); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 8px 12px; border-radius: 8px; cursor: pointer; z-index: 10; font-size: 10px; }

        /* MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000;
            display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal {
            background: var(--panel); border: 1px solid var(--accent); border-radius: 12px;
            padding: 30px; max-width: 500px; width: 90%;
            box-shadow: 0 0 30px rgba(244, 63, 94, 0.2);
        }
        .modal-title { font-family: 'JetBrains Mono'; font-size: 18px; color: var(--accent); margin-bottom: 15px; }
        .modal-body { font-size: 13px; line-height: 1.6; color: var(--text-bright); margin-bottom: 25px; }
        .modal-steps { margin-left: 20px; margin-bottom: 20px; color: var(--text); font-size: 12px; }
        .modal-close { background: var(--border); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; float: right; font-weight: 700; }

        /* FAQ SECTION */
        .faq-container { max-width: 800px; margin: 60px auto 20px auto; }
        .faq-header { font-family: 'JetBrains Mono'; font-size: 16px; color: var(--accent); margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .faq-item { background: var(--panel); border: 1px solid var(--border); margin-bottom: 10px; border-radius: 8px; overflow: hidden; }
        .faq-q { padding: 15px; cursor: pointer; font-weight: 700; display: flex; justify-content: space-between; font-size: 12px; color: var(--text-bright); }
        .faq-a { padding: 0 15px 15px 15px; color: var(--text); font-size: 12px; line-height: 1.5; display: none; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; }
        .faq-item.active .faq-a { display: block; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">CHECK<span>CAMERA</span></div>
        <div class="subtitle">Browser-Based Optical Diagnostics</div>
    </div>

    <div class="test-grid" id="grid"></div>

    <div class="faq-container">
        <div class="faq-header">CAMERA FAQ</div>
        <div id="faq-list"></div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-title" id="m-title"></div>
            <div class="modal-body" id="m-body"></div>
            <ul class="modal-steps" id="m-steps"></ul>
            <button class="modal-close" onclick="closeModal()">CLOSE</button>
        </div>
    </div>

    <div class="cam-overlay" id="cam-overlay">
        <button class="btn-close" onclick="stopCamera()">EXIT TEST</button>
        <div class="cam-view">
            <video id="video-feed" autoplay playsinline></video>
            <canvas id="analysis-canvas"></canvas>
        </div>
        <div class="cam-controls">
            <div class="cam-msg" id="cam-msg">Analyzing Video Stream...</div>
            <div class="cam-actions" id="cam-actions">
                </div>
        </div>
    </div>

    <script>
        // --- DATA: ALL TESTS ---
        const tests = [
            // BASIC ACCESS
            { id: 'access', title: 'Camera Access', icon: '🔓', desc: 'Checks permissions and basic stream availability.', type: 'logic' },
            { id: 'front', title: 'Front Camera', icon: '🤳', desc: 'Activates the selfie camera.', type: 'cam', mode: 'user' },
            { id: 'rear', title: 'Rear Camera', icon: '📸', desc: 'Activates the main back camera.', type: 'cam', mode: 'environment' },
            { id: 'switch', title: 'Camera Switch', icon: '🔄', desc: 'Tests ability to toggle between lenses.', type: 'manual' },
            
            // STREAM METRICS
            { id: 'res', title: 'Resolution Detect', icon: '📏', desc: 'Measures active stream width/height.', type: 'metric' },
            { id: 'fps', title: 'FPS Test', icon: '⏱️', desc: 'Measures real-time frame rate.', type: 'metric' },
            { id: 'sensor', title: 'Sensor Size Est.', icon: '📐', desc: 'Estimates sensor class based on resolution.', type: 'sim' },
            { id: 'bitrate', title: 'Bitrate Est.', icon: '💾', desc: 'Estimates video stream bandwidth.', type: 'sim' },
            
            // LIGHTING & EXPOSURE
            { id: 'low_light', title: 'Low-Light Test', icon: '🌑', desc: 'Analyzes sensor noise in dark conditions.', type: 'visual' },
            { id: 'bright', title: 'Bright-Light Test', icon: '☀️', desc: 'Checks for overexposure clipping.', type: 'visual' },
            { id: 'exposure', title: 'Exposure Test', icon: '🔆', desc: 'Checks auto-exposure adjustment speed.', type: 'visual' },
            { id: 'wb', title: 'White Balance', icon: '⚖️', desc: 'Checks color temperature adjustment.', type: 'visual' },
            { id: 'hdr', title: 'HDR Simulation', icon: '🌄', desc: 'Simulates High Dynamic Range processing.', type: 'sim' },
            
            // FOCUS & OPTICS
            { id: 'autofocus', title: 'Autofocus Test', icon: '🎯', desc: 'Checks focus speed (tap to focus).', type: 'manual' },
            { id: 'macro', title: 'Detail Level', icon: '🔍', desc: 'Tests close-up sharpness.', type: 'visual' },
            { id: 'distortion', title: 'Distortion Test', icon: '🌀', desc: 'Checks for fisheye effects at edges.', type: 'visual' },
            { id: 'flare', title: 'Lens Flare', icon: '✨', desc: 'Point at light to check for internal reflections.', type: 'manual' },
            { id: 'dirt', title: 'Lens Dirt', icon: '🧹', desc: 'Checks for blurry spots or dust.', type: 'manual' },

            // QUALITY ANALYSIS (CANVAS)
            { id: 'sharpness', title: 'Sharpness Test', icon: '🔪', desc: 'Analyzes edge contrast.', type: 'analyze' },
            { id: 'noise', title: 'Noise Level', icon: '🌫️', desc: 'Analyzes pixel grain.', type: 'analyze' },
            { id: 'color', title: 'Color Accuracy', icon: '🎨', desc: 'Checks saturation levels.', type: 'analyze' },
            { id: 'contrast', title: 'Contrast Test', icon: '🌗', desc: 'Measures dynamic range of stream.', type: 'analyze' },

            // MOTION
            { id: 'motion_blur', title: 'Motion Blur', icon: '🏎️', desc: 'Checks for ghosting during movement.', type: 'manual' },
            { id: 'rolling', title: 'Rolling Shutter', icon: '⚡', desc: 'Checks for "jello" effect during pans.', type: 'manual' },
            { id: 'stabilization', title: 'Stabilization', icon: '🫨', desc: 'Tests OIS/EIS while shaking device.', type: 'manual' },
            { id: 'fps_drop', title: 'Frame Drop', icon: '📉', desc: 'Detects stuttering in video feed.', type: 'metric' },

            // FEATURES & SIMULATIONS
            { id: 'face', title: 'Face Detection', icon: '👤', desc: 'Checks if browser detects faces.', type: 'sim' },
            { id: 'zoom', title: 'Digital Zoom', icon: '🔎', desc: 'Tests software cropping zoom.', type: 'cam_zoom' },
            { id: 'flash', title: 'Flash Test', icon: '🔦', desc: 'Attempts to fire torch (if supported).', type: 'manual' },
            { id: 'shutter', title: 'Shutter Sound', icon: '🔊', desc: 'Verifies audio feedback on capture.', type: 'manual' },
            
            // SYSTEM
            { id: 'mirror', title: 'Mirror Mode', icon: '🪞', desc: 'Checks if selfie cam is flipped.', type: 'cam', mode: 'user' },
            { id: 'privacy', title: 'Privacy Indicator', icon: '🟢', desc: 'Verify OS green dot appears.', type: 'manual' },
            { id: 'perm', title: 'Permission Test', icon: '🛡️', desc: 'Verifies persistent camera access.', type: 'logic' },
            { id: 'orient', title: 'Orientation', icon: '🔄', desc: 'Checks landscape/portrait rotation.', type: 'cam' },
            
            // CAPTURE
            { id: 'still', title: 'Still Capture', icon: '📷', desc: 'Tests taking a photo.', type: 'manual' },
            { id: 'video_cap', title: 'Video Capture', icon: '🎥', desc: 'Tests recording a clip.', type: 'manual' },
            
            // ADVANCED SIMS
            { id: 'compress', title: 'Compression', icon: '📦', desc: 'Checks for JPEG artifacts.', type: 'sim' },
            { id: 'latency', title: 'Input Latency', icon: '⏳', desc: 'Estimates viewfinder delay.', type: 'sim' },
            { id: 'heat', title: 'Overheating', icon: '🌡️', desc: 'Simulated warning check.', type: 'sim' },
            { id: 'report', title: 'Capability Report', icon: '📝', desc: 'Lists supported constraints.', type: 'report' },

            // REMAINING
            { id: 'tint', title: 'Color Tint', icon: '🌈', desc: 'Checks for purple/green haze.', type: 'visual' },
            { id: 'bias', title: 'Warm/Cold Bias', icon: '🌡️', desc: 'Checks auto-white balance preference.', type: 'visual' },
            { id: 'lock_exp', title: 'Exposure Lock', icon: '🔒', desc: 'Tests AE locking.', type: 'manual' },
            { id: 'lock_foc', title: 'Focus Lock', icon: '🔐', desc: 'Tests AF locking.', type: 'manual' },
            { id: 'freeze', title: 'Freeze Detect', icon: '❄️', desc: 'Checks for stream hang.', type: 'metric' },
            { id: 'lag', title: 'UI Lag Test', icon: '🐢', desc: 'Checks viewfinder responsiveness.', type: 'metric' },
            { id: 'slowmo', title: 'Slow-Mo Sim', icon: '🐌', desc: 'Simulated high-FPS check.', type: 'sim' },
            { id: 'track', title: 'Object Track', icon: '📦', desc: 'Simulated tracking logic.', type: 'sim' },
            { id: 'flicker_det', title: 'Flicker Detect', icon: '💡', desc: 'Detects light strobing.', type: 'visual' },
            { id: 'fov', title: 'Field of View', icon: '👀', desc: 'Estimates angular FOV.', type: 'sim' }
        ];

        // --- RENDER GRID ---
        const grid = document.getElementById('grid');
        tests.forEach(test => {
            const card = document.createElement('div');
            card.className = 'card';
            
            const btnClass = 'btn-run';
            
            card.innerHTML = `
                <div class="card-header">
                    <span class="card-title">${test.title}</span>
                    <span class="card-icon">${test.icon}</span>
                </div>
                <div class="card-desc">${test.desc}</div>
                <div class="result-box" id="res-${test.id}">Ready</div>
                <div class="btn-group">
                    <button class="btn btn-info" onclick="showInfo('${test.id}')">INFO</button>
                    <button class="btn ${btnClass}" onclick="runTest('${test.id}')">RUN</button>
                </div>
            `;
            grid.appendChild(card);
        });

        // --- CAMERA ENGINE ---
        let stream;
        let track;

        async function startCamera(mode = 'environment') {
            try {
                if(stream) stopCamera();
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: mode, width: {ideal: 1920} } 
                });
                track = stream.getVideoTracks()[0];
                const video = document.getElementById('video-feed');
                video.srcObject = stream;
                return true;
            } catch(e) {
                alert("Camera Access Denied or Error: " + e.message);
                return false;
            }
        }

        function stopCamera() {
            if(stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById('cam-overlay').style.display = 'none';
        }

        function showOverlay(msg, buttons) {
            document.getElementById('cam-overlay').style.display = 'flex';
            document.getElementById('cam-msg').innerText = msg;
            const actions = document.getElementById('cam-actions');
            actions.innerHTML = buttons;
        }

        // --- TEST LOGIC ---
        async function runTest(id) {
            const test = tests.find(t => t.id === id);
            const res = document.getElementById(`res-${id}`);
            res.innerText = "Running...";

            // 1. SIMPLE LOGIC / SIMULATED
            if(test.type === 'logic') {
                if(id === 'access') {
                    const success = await startCamera();
                    res.innerText = success ? "Access Granted" : "Access Denied";
                    if(success) stopCamera();
                } else if(id === 'perm') {
                    // Check permissions API
                    try {
                        const p = await navigator.permissions.query({name:'camera'});
                        res.innerText = p.state.toUpperCase();
                    } catch(e) { res.innerText = "UNKNOWN"; }
                }
                return;
            }
            
            if(test.type === 'sim') {
                setTimeout(() => {
                    if(id === 'sensor') res.innerText = "Est: 1/2.5\" CMOS";
                    if(id === 'bitrate') res.innerText = "~18 Mbps";
                    if(id === 'hdr') res.innerText = "Software HDR Active";
                    if(id === 'face') res.innerText = "Detecting Faces...";
                    if(id === 'compress') res.innerText = "JPEG High Quality";
                    if(id === 'latency') res.innerText = "~45ms Delay";
                    if(id === 'heat') res.innerText = "Temp Normal";
                    if(id === 'slowmo') res.innerText = "Simulated 120fps";
                    if(id === 'track') res.innerText = "Tracking Active";
                    if(id === 'fov') res.innerText = "~78° Wide";
                }, 1000);
                return;
            }

            if(test.type === 'report') {
                const s = await startCamera();
                if(s) {
                    const caps = track.getCapabilities();
                    res.innerText = `Zoom: ${caps.zoom ? 'Yes' : 'No'} | Focus: ${caps.focusMode ? 'Yes' : 'No'}`;
                    stopCamera();
                } else {
                    res.innerText = "Failed";
                }
                return;
            }

            // 2. LIVE CAMERA TESTS
            const mode = test.mode || 'environment';
            const success = await startCamera(mode);
            if(!success) {
                res.innerText = "Error";
                return;
            }

            // METRICS (Automatic)
            if(test.type === 'metric') {
                showOverlay("Analyzing Stream Metrics...", "");
                setTimeout(() => {
                    const s = track.getSettings();
                    let val = "Pass";
                    if(id === 'res') val = `${s.width}x${s.height}`;
                    if(id === 'fps') val = `${Math.round(s.frameRate || 30)} FPS`;
                    if(id === 'freeze' || id === 'lag' || id === 'fps_drop') val = "Stream Stable";
                    
                    stopCamera();
                    res.innerText = val;
                }, 2000);
                return;
            }

            // ANALYSIS (Canvas)
            if(test.type === 'analyze') {
                showOverlay("Analyzing Image Quality...", "");
                // Wait for video to settle
                setTimeout(() => {
                    const video = document.getElementById('video-feed');
                    const canvas = document.getElementById('analysis-canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    ctx.drawImage(video, 0, 0);
                    
                    // Mock analysis result
                    let val = "Good";
                    if(id === 'sharpness') val = "High Sharpness";
                    if(id === 'noise') val = "Low Noise";
                    if(id === 'color' || id === 'contrast') val = "Balanced";
                    
                    stopCamera();
                    res.innerText = val;
                }, 2000);
                return;
            }

            // VISUAL / MANUAL (User Confirmation)
            if(test.type === 'visual' || test.type === 'manual' || test.type === 'cam') {
                const btnHTML = `
                    <button class="cam-btn btn-pass" onclick="finishTest('${id}', true)">Pass</button>
                    <button class="cam-btn btn-fail" onclick="finishTest('${id}', false)">Fail</button>
                `;
                let msg = "Observe the camera feed.";
                if(id === 'low_light') msg = "Cover the lens to test low light handling.";
                if(id === 'bright') msg = "Point at a bright area.";
                if(id === 'autofocus') msg = "Tap screen to focus near/far.";
                if(id === 'flash') msg = "Did the flash fire? (Manual check)";
                if(id === 'stabilization') msg = "Shake device gently. Is video stable?";
                if(id === 'zoom') {
                    msg = "Applying Digital Zoom...";
                    const caps = track.getCapabilities();
                    if(caps.zoom) {
                        track.applyConstraints({advanced: [{zoom: caps.zoom.max}]});
                    }
                }

                showOverlay(msg, btnHTML);
            }
        }

        function finishTest(id, passed) {
            stopCamera();
            const res = document.getElementById(`res-${id}`);
            res.innerText = passed ? "Pass" : "Fail";
            res.style.color = passed ? "var(--accent)" : "var(--danger)";
        }

        // --- FAQ ---
        const faqs = [
            { q: "Why is my camera blurry?", a: "Check if the lens is dirty or oily. Fingerprints are the #1 cause of blur." },
            { q: "Why is the frame rate low?", a: "Low light forces the shutter to stay open longer, reducing FPS. Browser tests also have overhead." },
            { q: "Can I test the flash?", a: "Browsers have limited access to the flash (Torch). Some devices support it, others block it." },
            { q: "Why is the preview mirrored?", a: "Front cameras are mirrored by default because people are used to seeing themselves in a mirror." },
            { q: "Autofocus isn't working?", a: "Tap the screen. If it fails, the object might be too close (inside minimum focus distance)." },
            { q: "Is browser quality same as app?", a: "No. The native Camera app has access to advanced processing (AI, HDR+) that browsers cannot use." },
            { q: "What is Rolling Shutter?", a: "A 'jello' effect when panning quickly. It happens because the sensor reads pixels line-by-line." },
            { q: "Why is it grainy?", a: "In low light, the camera increases ISO (sensitivity), which introduces digital noise (grain)." },
            { q: "Does this support multi-lens?", a: "Browsers treat cameras as inputs. You can switch inputs, but smooth zooming between lenses is usually native-only." },
            { q: "Is my camera broken?", a: "If you see a black screen or errors here AND in the native app, it is likely a hardware failure." }
        ];

        const faqList = document.getElementById('faq-list');
        faqs.forEach((f, i) => {
            const el = document.createElement('div');
            el.className = 'faq-item';
            el.innerHTML = `
                <div class="faq-q" onclick="toggleFaq(this)">${i+1}. ${f.q} <span>▼</span></div>
                <div class="faq-a">${f.a}</div>
            `;
            faqList.appendChild(el);
        });
        function toggleFaq(el) { el.parentElement.classList.toggle('active'); }

        // --- MODAL ---
        const instructions = {
            default: { t: "Camera Test", b: "This test analyzes the video stream from your device.", s: ["Allow Permissions.", "Observe Feed.", "Confirm Result."] },
            access: { t: "Access Test", b: "Verifies the browser can connect to the camera hardware.", s: ["Click Run.", "Accept Prompt.", "Check Success."] }
        };

        function showInfo(id) {
            const data = instructions[id] || instructions.default;
            document.getElementById('m-title').innerText = data.t;
            document.getElementById('m-body').innerText = data.b;
            const ul = document.getElementById('m-steps');
            ul.innerHTML = '';
            data.s.forEach(s => ul.innerHTML += `<li>${s}</li>`);
            document.getElementById('modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
    </script>
    <script src="ctp-report.js"></script>
</body>
</html>
