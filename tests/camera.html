<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Diagnostics | CheckThisPhone</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --surface-dark: #1e293b;
            --accent: #f59e0b; /* Amber/Orange for Camera */
            --accent-glow: rgba(245, 158, 11, 0.4);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #10b981;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* HEADER */
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            margin-right: 15px;
        }
        .page-title { font-size: 20px; font-weight: 700; margin: 0; }

        /* VIEWFINDER */
        .viewfinder-wrapper {
            position: relative;
            width: 100%;
            height: 400px;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 2px solid #334155;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1); /* For Zoom */
            transition: transform 0.1s;
        }

        /* FOCUS TARGET OVERLAY */
        .focus-target {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80px; height: 80px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            pointer-events: none;
        }
        .focus-target::after {
            content: '+';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.8);
            font-size: 20px;
        }

        /* CONTROLS BAR */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
        }

        .cam-btn {
            flex: 1;
            background: var(--surface-dark);
            border: 1px solid #334155;
            color: var(--text-main);
            padding: 15px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .cam-btn:active { background: #334155; }
        .cam-btn.active { border-color: var(--accent); color: var(--accent); }

        .icon { font-size: 20px; margin-bottom: 2px; }

        /* ZOOM SLIDER */
        .zoom-container {
            background: var(--surface-dark);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        input[type=range] {
            width: 100%;
            accent-color: var(--accent);
        }

        /* SNAPSHOT GALLERY */
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .thumb {
            width: 100%;
            aspect-ratio: 1;
            background: #222;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        .thumb img { width: 100%; height: 100%; object-fit: cover; }
        .thumb-label {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 10px;
            text-align: center;
            padding: 4px;
        }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <button class="back-btn" onclick="window.location.href='index.html'">←</button>
        <h1 class="page-title">Camera System</h1>
    </div>

    <div class="viewfinder-wrapper">
        <video id="cam-feed" autoplay playsinline></video>
        <div class="focus-target"></div>
        <div style="position: absolute; top: 10px; left: 10px; font-size: 10px; color: #fff; background: rgba(0,0,0,0.5); padding: 4px; border-radius: 4px;">
            Res: <span id="res-debug">--</span>
        </div>
    </div>

    <div class="controls-bar">
        <button class="cam-btn" onclick="switchCamera()">
            <span class="icon">🔄</span>
            <span>Flip Cam</span>
        </button>
        
        <button class="cam-btn" onclick="takeSnapshot()">
            <span class="icon">📸</span>
            <span>Snap</span>
        </button>
        
        <button class="cam-btn" id="btn-flash" onclick="toggleFlash()">
            <span class="icon">⚡</span>
            <span>Flash</span>
        </button>
    </div>

    <div class="zoom-container">
        <span style="font-size: 12px; font-weight: 700; color: var(--text-dim);">ZOOM</span>
        <input type="range" id="zoom-slider" min="1" max="3" step="0.1" value="1" oninput="handleZoom(this.value)">
        <span id="zoom-val" style="font-size: 12px; font-weight: 700; color: var(--accent);">1.0x</span>
    </div>

    <h3 style="font-size: 14px; margin-bottom: 10px; color: var(--text-dim);">Test Shots (Check Clarity)</h3>
    <div class="gallery" id="gallery">
        <div class="thumb" style="display:flex; align-items:center; justify-content:center; color:#444; font-size:10px;">
            No Shots
        </div>
    </div>

</div>

<canvas id="snap-canvas" style="display: none;"></canvas>

<script>
    const video = document.getElementById('cam-feed');
    let currentStream;
    let currentFacingMode = 'environment'; // Start with Rear Camera
    let track; // Video track for flash/zoom control
    
    // 1. INIT CAMERA
    async function startCamera() {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }

        const constraints = {
            video: { 
                facingMode: currentFacingMode,
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            }
        };

        try {
            currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = currentStream;
            
            // Get track for capabilities (Flash/Zoom)
            track = currentStream.getVideoTracks()[0];
            
            // Update Resolution Debug info
            const settings = track.getSettings();
            document.getElementById('res-debug').innerText = `${settings.width}x${settings.height}`;

            // Reset UI
            document.getElementById('btn-flash').classList.remove('active');
            
        } catch (err) {
            alert("Camera access denied or unavailable.");
            console.error(err);
        }
    }

    // 2. SWITCH CAMERA (Front/Rear)
    function switchCamera() {
        currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
        startCamera();
    }

    // 3. FLASH TOGGLE
    async function toggleFlash() {
        if (!track) return;
        
        // Check if supported
        const capabilities = track.getCapabilities();
        if (!capabilities.torch) {
            alert("Flash control not supported on this lens by browser.");
            return;
        }

        const btn = document.getElementById('btn-flash');
        const isActive = btn.classList.contains('active');
        
        try {
            await track.applyConstraints({
                advanced: [{ torch: !isActive }]
            });
            btn.classList.toggle('active');
        } catch (err) {
            console.error("Flash error:", err);
            alert("Could not toggle flash.");
        }
    }

    // 4. ZOOM HANDLER
    async function handleZoom(val) {
        document.getElementById('zoom-val').innerText = `${val}x`;
        
        if (!track) return;
        const capabilities = track.getCapabilities();

        // Try Hardware Zoom first
        if (capabilities.zoom) {
            try {
                await track.applyConstraints({
                    advanced: [{ zoom: parseFloat(val) }]
                });
                return; // Success, hardware zoom used
            } catch (e) {
                console.log("Hardware zoom failed, falling back to digital");
            }
        }

        // Fallback: CSS Digital Zoom
        video.style.transform = `scale(${val})`;
    }

    // 5. SNAPSHOT LOGIC
    function takeSnapshot() {
        const canvas = document.getElementById('snap-canvas');
        const ctx = canvas.getContext('2d');
        const gallery = document.getElementById('gallery');

        // Match dimensions
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // Draw frame
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // Convert to IMG
        const imgUrl = canvas.toDataURL('image/jpeg');
        
        // Create Thumbnail Element
        const thumbDiv = document.createElement('div');
        thumbDiv.className = 'thumb';
        thumbDiv.innerHTML = `
            <img src="${imgUrl}">
            <div class="thumb-label">${currentFacingMode === 'user' ? 'FRONT' : 'REAR'}</div>
        `;
        
        // Remove empty placeholder if exists
        if(gallery.innerText.includes("No Shots")) gallery.innerHTML = '';
        
        // Prepend to gallery
        gallery.insertBefore(thumbDiv, gallery.firstChild);
        
        // Flash screen effect
        video.style.opacity = 0.5;
        setTimeout(() => video.style.opacity = 1, 100);
    }

    // Start immediately on load
    startCamera();

</script>

</body>
</html>
