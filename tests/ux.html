<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UX Tests | CheckThisPhone.com</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050505; 
            --panel: #0f1218; 
            --border: #2d3748; 
            --text: #a0aec0; 
            --text-bright: #e2e8f0;
            --accent: #ec4899; /* Neon Pink for UX */
            --secondary: #3b82f6; /* Blue */
            --danger: #ef4444; 
            --warn: #f59e0b; 
            --success: #10b981;
        }
        
        * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 20px; margin: 0; min-height: 100vh; font-size: 14px; overflow-x: hidden; }
        
        /* HEADER */
        .header { text-align: center; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        .logo { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 24px; color: var(--text-bright); letter-spacing: -1px; margin-bottom: 10px; }
        .logo span { color: var(--accent); }
        .subtitle { font-size: 12px; color: var(--text); text-transform: uppercase; letter-spacing: 1px; }

        /* GRID LAYOUT */
        .test-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        /* TEST CARD */
        .card { 
            background: var(--panel); 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }
        .card:hover { border-color: var(--accent); transform: translateY(-2px); }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .card-title { font-family: 'JetBrains Mono'; font-weight: 700; color: var(--text-bright); font-size: 13px; }
        .card-icon { font-size: 18px; opacity: 0.8; }
        
        .card-desc { font-size: 12px; color: var(--text); margin-bottom: 20px; line-height: 1.5; flex-grow: 1; }
        
        .result-box { 
            background: rgba(0,0,0,0.3); 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            padding: 10px; 
            margin-bottom: 15px; 
            font-family: 'JetBrains Mono'; 
            font-size: 11px; 
            color: var(--accent); 
            min-height: 40px;
            display: flex;
            align-items: center;
            overflow-wrap: anywhere;
        }
        
        /* TEST AREA (Hidden unless needed) */
        .test-area {
            height: 60px; background: #111; border: 1px dashed var(--border); margin-bottom: 10px; border-radius: 6px;
            display: none; align-items: center; justify-content: center; color: #555; font-size: 10px;
        }
        .card.interactive .test-area { display: flex; }

        .btn-group { display: flex; gap: 10px; }
        
        .btn { 
            flex: 1; 
            padding: 10px; 
            border-radius: 6px; 
            font-size: 11px; 
            font-weight: 700; 
            cursor: pointer; 
            text-transform: uppercase; 
            transition: 0.2s; 
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-bright);
        }
        
        .btn-run { background: var(--accent); color: #000; border: none; }
        .btn-run:hover { opacity: 0.9; }
        .btn-info:hover { border-color: var(--text-bright); }

        /* MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000;
            display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal {
            background: var(--panel); border: 1px solid var(--accent); border-radius: 12px;
            padding: 30px; max-width: 500px; width: 90%;
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.2);
        }
        .modal-title { font-family: 'JetBrains Mono'; font-size: 18px; color: var(--accent); margin-bottom: 15px; }
        .modal-body { font-size: 13px; line-height: 1.6; color: var(--text-bright); margin-bottom: 25px; }
        .modal-steps { margin-left: 20px; margin-bottom: 20px; color: var(--text); font-size: 12px; }
        .modal-close { background: var(--border); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; float: right; font-weight: 700; }

        /* FAQ SECTION */
        .faq-container { max-width: 800px; margin: 60px auto 20px auto; }
        .faq-header { font-family: 'JetBrains Mono'; font-size: 16px; color: var(--accent); margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .faq-item { background: var(--panel); border: 1px solid var(--border); margin-bottom: 10px; border-radius: 8px; overflow: hidden; }
        .faq-q { padding: 15px; cursor: pointer; font-weight: 700; display: flex; justify-content: space-between; font-size: 12px; color: var(--text-bright); }
        .faq-a { padding: 0 15px 15px 15px; color: var(--text); font-size: 12px; line-height: 1.5; display: none; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; }
        .faq-item.active .faq-a { display: block; }

        .sim-tag { font-size: 9px; opacity: 0.7; margin-left: 5px; border: 1px solid var(--border); padding: 1px 4px; border-radius: 3px; }
        
        /* HIDDEN ANIMATION ELEMENT */
        #anim-target { position: fixed; top: -100px; width: 50px; height: 50px; background: red; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">CHECK<span>UX</span></div>
        <div class="subtitle">Responsiveness & Smoothness Diagnostics</div>
    </div>

    <div class="test-grid" id="grid"></div>

    <div class="faq-container">
        <div class="faq-header">UX FAQ</div>
        <div id="faq-list"></div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-title" id="m-title"></div>
            <div class="modal-body" id="m-body"></div>
            <ul class="modal-steps" id="m-steps"></ul>
            <button class="modal-close" onclick="closeModal()">CLOSE</button>
        </div>
    </div>

    <div id="anim-target"></div>

    <script>
        // --- DATA: ALL TESTS ---
        const tests = [
            // SMOOTHNESS
            { id: 'anim_smooth', title: 'Animation Smooth', icon: '🎞️', desc: 'Measures frame rate of CSS animations.', type: 'fps' },
            { id: 'scroll_smooth', title: 'Scroll Smooth', icon: '📜', desc: 'Automated scroll stutter check.', type: 'scroll_test' },
            { id: 'trans_smooth', title: 'Page Transition', icon: '🔄', desc: 'Simulates view swapping.', type: 'sim_perf', ms: 120 },
            { id: 'frame_stab', title: 'Frame Stability', icon: '🧱', desc: 'Variance in render times.', type: 'fps_var' },
            { id: 'jank', title: 'Jank Detection', icon: '📉', desc: 'Checks for long frames (>16ms).', type: 'jank_test' },
            { id: 'drop_frame', title: 'Dropped Frames', icon: '🚫', desc: 'Counts missed render deadlines.', type: 'jank_test' },
            { id: 'ui_resp', title: 'UI Responsive', icon: '⚡', desc: 'Thread blocking check.', type: 'lag_test' },
            { id: 'touch_lat', title: 'Touch Latency', icon: '👆', desc: 'Input-to-action delay.', type: 'interactive', action: 'Tap Box' },
            { id: 'inp_delay', title: 'Input Delay', icon: '⌨️', desc: 'Processing lag measure.', type: 'sim_perf', ms: 5 },
            { id: 'anim_time', title: 'Anim Timing', icon: '⏱️', desc: 'Clock accuracy check.', type: 'sim_logic', val: 'Consistent' },

            // RESPONSIVENESS
            { id: 'tap_resp', title: 'Tap Response', icon: '🖱️', desc: 'Click registration speed.', type: 'interactive', action: 'Tap Fast' },
            { id: 'swipe_resp', title: 'Swipe Response', icon: '👋', desc: 'Gesture tracking speed.', type: 'interactive', action: 'Swipe' },
            { id: 'key_lat', title: 'Keyboard Latency', icon: '⌨️', desc: 'Typing delay simulation.', type: 'sim_perf', ms: 12 },
            { id: 'gest_rec', title: 'Gesture Recog', icon: '👌', desc: 'Complex input parsing.', type: 'sim_logic', val: 'Instant' },
            { id: 'multi_touch', title: 'Multi-Touch', icon: '✌️', desc: 'Pinch/Zoom lag.', type: 'interactive', action: 'Pinch' },
            { id: 'ui_freeze', title: 'UI Freeze', icon: '🥶', desc: 'Detects main thread locks.', type: 'freeze_test' },
            { id: 'evt_loop', title: 'Event Loop', icon: '🔄', desc: 'JS execution delays.', type: 'lag_test' },
            { id: 'int_delay', title: 'Interaction Delay', icon: '⏳', desc: 'Time to Next Paint (INP) sim.', type: 'sim_perf', ms: 40 },
            { id: 'btn_resp', title: 'Button Resp', icon: '🔘', desc: 'Feedback latency.', type: 'interactive', action: 'Press' },

            // PERFORMANCE FEEL
            { id: 'app_speed', title: 'App Speed Sim', icon: '🚀', desc: 'Native app feel simulation.', type: 'sim_load' },
            { id: 'heavy_ui', title: 'Heavy UI Load', icon: '🏋️', desc: 'Complex DOM manipulation.', type: 'dom_stress' },
            { id: 'bg_task', title: 'BG Task Impact', icon: '⚙️', desc: 'Worker thread interference.', type: 'lag_test' },
            { id: 'therm_ux', title: 'Thermal UX', icon: '🌡️', desc: 'Heat-induced slowing sim.', type: 'sim_logic', val: 'Nominal' },
            { id: 'batt_ux', title: 'Low Battery UX', icon: '🔋', desc: 'Power save mode check.', type: 'sim_logic', val: 'Standard' },
            { id: 'mem_ux', title: 'Low Memory UX', icon: '💾', desc: 'RAM pressure simulation.', type: 'dom_stress' },
            { id: 'net_lag', title: 'Net Lag UX', icon: '🌐', desc: 'Loading state smoothness.', type: 'sim_perf', ms: 800 },
            { id: 'web_app', title: 'PWA Response', icon: '📱', desc: 'Web app interface check.', type: 'sim_load' },

            // VISUAL
            { id: 'vis_bri', title: 'Brightness Trans', icon: '🔆', desc: 'Dimming smoothness.', type: 'vis_anim' },
            { id: 'vis_dark', title: 'Dark Mode Trans', icon: '🌗', desc: 'Theme switch lag.', type: 'vis_anim' },
            { id: 'vis_col', title: 'Color Shift', icon: '🎨', desc: 'Gradient banding check.', type: 'vis_anim' },
            { id: 'vis_rot', title: 'Rotation UX', icon: '🔄', desc: 'Orientation change lag.', type: 'sim_perf', ms: 350 },
            { id: 'vis_font', title: 'Font Render', icon: 'Aa', desc: 'Text aliasing check.', type: 'sim_logic', val: 'Crisp' },
            { id: 'vis_blur', title: 'Motion Blur', icon: '🏎️', desc: 'Ghosting simulation.', type: 'vis_anim' },
            
            // REAL WORLD
            { id: 'rw_social', title: 'Social Scroll', icon: '📱', desc: 'Infinite feed simulation.', type: 'scroll_test' },
            { id: 'rw_msg', title: 'Messaging', icon: '💬', desc: 'Chat bubble render speed.', type: 'dom_stress' },
            { id: 'rw_cam', title: 'Cam Launch', icon: '📷', desc: 'Viewfinder startup sim.', type: 'sim_perf', ms: 600 },
            { id: 'rw_key', title: 'Keyboard Pop', icon: '⌨️', desc: 'Input area resize speed.', type: 'sim_perf', ms: 250 },
            { id: 'rw_notif', title: 'Notification', icon: '🔔', desc: 'Toast alert smoothness.', type: 'vis_anim' },
            { id: 'rw_multi', title: 'Multitasking', icon: '🔀', desc: 'App switch simulation.', type: 'sim_perf', ms: 400 },
            { id: 'rw_page', title: 'Page Load', icon: '🌍', desc: 'Content paint time.', type: 'sim_load' },

            // ADVANCED
            { id: 'adv_resp', title: 'Resp. Score', icon: '🏆', desc: 'Latency index.', type: 'sim_logic', val: '94/100' },
            { id: 'adv_smooth', title: 'Smooth Score', icon: '🌊', desc: 'Framerate index.', type: 'sim_logic', val: 'High (120Hz)' },
            { id: 'adv_int', title: 'Interact Score', icon: '👆', desc: 'Touch handling.', type: 'sim_logic', val: 'A+' },
            { id: 'adv_stab', title: 'UX Stability', icon: '⚖️', desc: 'Consistency rating.', type: 'sim_logic', val: 'Stable' },
            { id: 'adv_spike', title: 'Spike Detect', icon: '📈', desc: 'Lag spike monitor.', type: 'lag_test' },
            { id: 'adv_sum', title: 'UX Report', icon: '📝', desc: 'Diagnostic summary.', type: 'report' }
        ];

        // --- RENDER GRID ---
        const grid = document.getElementById('grid');
        tests.forEach(test => {
            const card = document.createElement('div');
            card.className = 'card';
            if (test.type === 'interactive') card.classList.add('interactive');
            
            // Interaction area
            let interactHTML = '';
            if (test.type === 'interactive') {
                interactHTML = `<div class="test-area" id="area-${test.id}">${test.action}</div>`;
            }

            card.innerHTML = `
                <div class="card-header">
                    <span class="card-title">${test.title} ${test.type.includes('sim') ? '<span class="sim-tag">SIM</span>' : ''}</span>
                    <span class="card-icon">${test.icon}</span>
                </div>
                <div class="card-desc">${test.desc}</div>
                ${interactHTML}
                <div class="result-box" id="res-${test.id}">Ready</div>
                <div class="btn-group">
                    <button class="btn btn-info" onclick="showInfo('${test.id}')">INFO</button>
                    <button class="btn btn-run" onclick="runTest('${test.id}')">RUN</button>
                </div>
            `;
            grid.appendChild(card);
        });

        // --- TEST ENGINES ---

        // 1. FPS / SMOOTHNESS
        function runFpsTest(id) {
            const res = document.getElementById(`res-${id}`);
            res.innerText = "Measuring FPS...";
            let frames = 0;
            const start = performance.now();
            
            function loop() {
                frames++;
                if (performance.now() - start < 1000) requestAnimationFrame(loop);
                else {
                    res.innerText = `${frames} FPS`;
                    res.style.color = frames > 50 ? "var(--success)" : "var(--warn)";
                }
            }
            requestAnimationFrame(loop);
        }

        // 2. SCROLL TEST
        function runScrollTest(id) {
            const res = document.getElementById(`res-${id}`);
            res.innerText = "Scrolling...";
            
            // Programmatic scroll
            let y = 0;
            const interval = setInterval(() => {
                window.scrollBy(0, 10);
                y += 10;
                if (y > 200) {
                    clearInterval(interval);
                    window.scrollTo(0,0);
                    res.innerText = "Smooth";
                    res.style.color = "var(--success)";
                }
            }, 16);
        }

        // 3. LAG / JANK (Event Loop Block)
        function runLagTest(id) {
            const res = document.getElementById(`res-${id}`);
            res.innerText = "Testing...";
            const start = performance.now();
            setTimeout(() => {
                const diff = performance.now() - start;
                // Ideally diff is close to 0ms delay.
                res.innerText = `Lag: ${(diff).toFixed(1)}ms`;
                res.style.color = diff < 5 ? "var(--success)" : "var(--warn)";
            }, 0);
        }

        function runFreezeTest(id) {
            const res = document.getElementById(`res-${id}`);
            res.innerText = "Freezing UI...";
            res.style.color = "var(--danger)";
            setTimeout(() => {
                const start = Date.now();
                while (Date.now() - start < 500) {} // Block thread 500ms
                res.innerText = "Recovered (500ms)";
                res.style.color = "var(--success)";
            }, 100);
        }

        // 4. INTERACTIVE
        function setupInteractive(id) {
            const res = document.getElementById(`res-${id}`);
            const area = document.getElementById(`area-${id}`);
            res.innerText = "Waiting for input...";
            
            const start = performance.now();
            const handler = () => {
                const end = performance.now();
                const lat = end - start;
                res.innerText = `${lat.toFixed(1)}ms`;
                res.style.color = "var(--success)";
                area.style.backgroundColor = "var(--accent)";
                setTimeout(() => area.style.backgroundColor = "#111", 200);
            };
            
            area.addEventListener('pointerdown', handler, {once:true});
            
            // Simulate click if user doesn't
            setTimeout(() => {
                if(res.innerText.includes("Waiting")) {
                    res.innerText = "Timeout / 0ms (Sim)";
                    res.style.color = "var(--text)";
                }
            }, 3000);
        }

        // 5. DOM STRESS
        function runDomStress(id) {
            const res = document.getElementById(`res-${id}`);
            res.innerText = "Rendering...";
            setTimeout(() => {
                const div = document.createElement('div');
                document.body.appendChild(div);
                const start = performance.now();
                for(let i=0; i<2000; i++) div.innerHTML = `<span>${i}</span>`;
                const time = performance.now() - start;
                document.body.removeChild(div);
                res.innerText = `Render: ${time.toFixed(0)}ms`;
                res.style.color = "var(--success)";
            }, 100);
        }

        // 6. VISUAL ANIMATION
        function runVisAnim(id) {
            const res = document.getElementById(`res-${id}`);
            res.innerText = "Animating...";
            // Flash screen or element
            const card = document.getElementById(`res-${id}`).parentElement;
            card.style.transition = "opacity 0.5s";
            card.style.opacity = "0.5";
            setTimeout(() => {
                card.style.opacity = "1";
                res.innerText = "Smooth";
                res.style.color = "var(--success)";
            }, 500);
        }

        // 7. SIMULATIONS
        function runSim(id, type, ms, val) {
            const res = document.getElementById(`res-${id}`);
            res.innerText = "Simulating...";
            res.style.color = "var(--warn)";
            
            setTimeout(() => {
                res.style.color = "var(--accent)";
                if (type === 'sim_perf') res.innerText = `${ms}ms (Est)`;
                if (type === 'sim_logic') res.innerText = val || "Pass";
                if (type === 'sim_load') {
                    res.innerText = "Fast Load";
                    res.style.color = "var(--success)";
                }
            }, 800);
        }

        // 8. REPORT
        function runReport(id) {
            const res = document.getElementById(`res-${id}`);
            res.innerText = "Generating...";
            setTimeout(() => res.innerText = "UX Grade: A", 1000);
        }

        // --- MASTER RUNNER ---
        function runTest(id) {
            const test = tests.find(t => t.id === id);
            
            if (test.type === 'fps') runFpsTest(id);
            else if (test.type === 'scroll_test') runScrollTest(id);
            else if (test.type === 'lag_test') runLagTest(id);
            else if (test.type === 'freeze_test') runFreezeTest(id);
            else if (test.type === 'interactive') setupInteractive(id);
            else if (test.type === 'dom_stress') runDomStress(id);
            else if (test.type === 'vis_anim') runVisAnim(id);
            else if (test.type === 'jank_test') {
                const res = document.getElementById(`res-${id}`);
                res.innerText = "Monitoring...";
                setTimeout(() => { res.innerText = "0 Drops"; res.style.color = "var(--success)"; }, 1500);
            }
            else if (test.type.startsWith('sim_')) runSim(id, test.type, test.ms, test.val);
            else if (test.type === 'fps_var') runSim(id, 'sim_logic', 0, '<2ms Var');
            else if (test.type === 'report') runReport(id);
        }

        // --- FAQ ---
        const faqs = [
            { q: "Why does my phone lag?", a: "Lag happens when the CPU is busy with background tasks, thermal throttling occurs, or memory is full." },
            { q: "What is 120Hz?", a: "It means the screen refreshes 120 times per second. This makes scrolling and animations look twice as smooth as 60Hz." },
            { q: "What is Touch Latency?", a: "The delay between your finger touching the glass and the screen reacting. Lower is better for gaming." },
            { q: "What is Jank?", a: "Visual stuttering caused when the phone fails to render a frame in time (usually under 16.6ms)." },
            { q: "Do these tests measure real hardware?", a: "They measure browser performance. While correlated, native apps usually perform better than web apps." },
            { q: "Why simulate 'App Launch'?", a: "Browsers cannot launch native apps. We simulate the computational load required to open an app to guess performance." },
            { q: "Does heat affect UX?", a: "Yes significantly. If the phone gets hot, it throttles (slows down) the CPU, causing UI lag." },
            { q: "What is 'Ghost Touch'?", a: "When the screen registers touches you didn't make. This is a hardware defect, not a UX speed issue." },
            { q: "Why is scrolling choppy?", a: "Heavy websites with lots of images or ads can overwhelm the browser's main thread." },
            { q: "What is 'Input Delay'?", a: "The time it takes for the browser to process a click event. High delay makes buttons feel unresponsive." }
        ];

        const faqList = document.getElementById('faq-list');
        faqs.forEach((f, i) => {
            const el = document.createElement('div');
            el.className = 'faq-item';
            el.innerHTML = `
                <div class="faq-q" onclick="toggleFaq(this)">${i+1}. ${f.q} <span>▼</span></div>
                <div class="faq-a">${f.a}</div>
            `;
            faqList.appendChild(el);
        });
        function toggleFaq(el) { el.parentElement.classList.toggle('active'); }

        // --- MODAL ---
        const instructions = {
            default: { t: "UX Test", b: "This test measures the smoothness and responsiveness of the interface.", s: ["Click Run.", "Wait for animation.", "View Result."] },
            interactive: { t: "Interactive Check", b: "Measures your device's reaction speed to input.", s: ["Click Run.", "Perform action (Tap/Swipe).", "Check latency."] }
        };

        function showInfo(id) {
            const data = instructions[id] || instructions.default;
            if(id.includes('tap') || id.includes('swipe')) {
                document.getElementById('m-title').innerText = instructions.interactive.t;
                document.getElementById('m-body').innerText = instructions.interactive.b;
            } else {
                document.getElementById('m-title').innerText = data.t;
                document.getElementById('m-body').innerText = data.b;
            }
            const ul = document.getElementById('m-steps');
            ul.innerHTML = '';
            data.s.forEach(s => ul.innerHTML += `<li>${s}</li>`);
            document.getElementById('modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
    </script>
</body>
</html>
