<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Don Systems UX Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050505; 
            --panel: #0f1218; 
            --border: #2d3748; 
            --text: #a0aec0; 
            --text-bright: #e2e8f0;
            --accent: #fcd34d; /* Cyber Yellow */
            --secondary: #3b82f6; /* Electric Blue */
            --success: #00ff9d; 
            --danger: #ff0055; 
        }
        
        * { box-sizing: border-box; touch-action: manipulation; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 20px; margin: 0; min-height: 100vh; font-size: 14px; overflow-x: hidden; }
        
        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .logo { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 18px; color: var(--text-bright); letter-spacing: -1px; }
        .logo span { color: var(--accent); }
        .live-badge { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--secondary); font-weight: 700; background: rgba(59, 130, 246, 0.1); padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(59, 130, 246, 0.2); }
        .blink { animation: blink 1s infinite; width: 6px; height: 6px; background: var(--secondary); border-radius: 50%; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }

        /* REFLEX HERO */
        .reflex-box { 
            background: #1a1a2e; border: 2px dashed var(--border); border-radius: 16px; height: 200px; margin-bottom: 20px; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: 0.1s; position: relative; overflow: hidden;
        }
        .reflex-box.ready { background: var(--danger); border-color: var(--danger); }
        .reflex-box.go { background: var(--success); border-color: var(--success); }
        
        .reflex-title { font-size: 24px; font-weight: 800; color: white; pointer-events: none; }
        .reflex-sub { font-size: 12px; color: rgba(255,255,255,0.7); pointer-events: none; margin-top: 5px; }

        /* DATA GRID */
        .grid-master { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        
        .stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 15px; }
        .stat-label { font-size: 10px; text-transform: uppercase; color: var(--text); display: block; margin-bottom: 4px; letter-spacing: 1px; }
        .stat-val { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; color: var(--text-bright); }
        .unit { font-size: 12px; color: var(--text); font-weight: 400; }

        /* SCROLL JANK TEST */
        .scroll-container { 
            height: 150px; overflow-y: scroll; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin-bottom: 20px; position: relative;
        }
        .scroll-item { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--text); font-size: 12px; display: flex; justify-content: space-between; }
        .fps-overlay { position: absolute; top: 10px; right: 20px; background: #000; padding: 4px 8px; border-radius: 6px; font-family: 'JetBrains Mono'; font-size: 12px; color: var(--accent); border: 1px solid var(--accent); pointer-events: none; }

        /* TARGET PRACTICE */
        .target-zone { 
            height: 200px; background: #000; border: 1px solid var(--border); border-radius: 12px; position: relative; margin-bottom: 20px; overflow: hidden; cursor: crosshair;
        }
        .target { 
            position: absolute; width: 40px; height: 40px; background: var(--secondary); border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; box-shadow: 0 0 15px var(--secondary);
            transition: transform 0.1s;
        }
        .target::after { content: ""; width: 10px; height: 10px; background: white; border-radius: 50%; }
        .target:active { transform: scale(0.9); background: white; }

        /* TERMINAL */
        .terminal { background: #000; border: 1px solid var(--border); border-radius: 8px; padding: 10px; height: 120px; overflow: hidden; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--accent); position: relative; }
        .log-line { margin-bottom: 2px; opacity: 0.8; }
        .terminal::after { content: ""; position: absolute; bottom: 0; left: 0; width: 100%; height: 20px; background: linear-gradient(to top, #000, transparent); }

        .back-btn { display: block; text-align: center; margin-top: 20px; color: var(--text); text-decoration: none; font-weight: 700; padding: 15px; background: var(--panel); border-radius: 12px; }
        
        .action-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text-bright); width: 100%; padding: 15px; border-radius: 12px; font-weight: 700; margin-bottom: 10px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; }
        .action-btn:hover { border-color: var(--accent); color: var(--accent); }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">DON<span>UX_LAB</span></div>
        <div class="live-badge"><div class="blink"></div> INPUT READY</div>
    </div>

    <div class="reflex-box" id="reflex-btn" onclick="handleReflex()">
        <div class="reflex-title">TAP TO START</div>
        <div class="reflex-sub">Reflex Speed Test</div>
    </div>

    <div class="grid-master">
        <div class="stat-card">
            <span class="stat-label">REACTION TIME</span>
            <span class="stat-val" id="score-reflex">--<span class="unit">ms</span></span>
        </div>
        <div class="stat-card">
            <span class="stat-label">INPUT LATENCY</span>
            <span class="stat-val" id="score-lag">--<span class="unit">ms</span></span>
        </div>
    </div>

    <h3 style="font-size: 12px; color: var(--text); margin-bottom: 10px;">SCROLL SMOOTHNESS TEST</h3>
    <div class="scroll-container" id="scroll-box" onscroll="measureScroll()">
        <div class="fps-overlay" id="scroll-fps">0 FPS</div>
        </div>

    <h3 style="font-size: 12px; color: var(--text); margin-bottom: 10px;">ACCURACY CALIBRATION</h3>
    <div class="target-zone" id="aim-box">
        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color: var(--text); font-size: 10px; pointer-events: none;">TAP DOTS TO TEST</div>
    </div>

    <div class="grid-master">
        <div class="stat-card">
            <span class="stat-label">ACCURACY</span>
            <span class="stat-val" id="score-acc">100<span class="unit">%</span></span>
        </div>
        <div class="stat-card">
            <span class="stat-label">HITS</span>
            <span class="stat-val" id="score-hits">0</span>
        </div>
    </div>

    <div class="terminal" id="console-output">
        <div class="log-line">> UX MODULE INIT...</div>
        <div class="log-line">> WAITING FOR INPUT...</div>
    </div>

    <a href="../index.html" class="back-btn">EXIT UX LAB</a>

    <script>
        // --- LOGGING ---
        function log(msg) {
            const term = document.getElementById('console-output');
            const line = document.createElement('div');
            line.className = 'log-line';
            line.innerHTML = `<span style="color:#64748b">[UX]</span> ${msg}`;
            term.appendChild(line);
            if(term.children.length > 6) term.removeChild(term.children[0]);
            term.scrollTop = term.scrollHeight;
        }

        // --- 1. REFLEX TEST ---
        let reflexState = 'idle'; // idle, wait, go
        let startTime = 0;
        let timeoutId;
        const box = document.getElementById('reflex-btn');
        const title = document.querySelector('.reflex-title');
        const sub = document.querySelector('.reflex-sub');

        function handleReflex() {
            if (reflexState === 'idle') {
                reflexState = 'wait';
                box.className = 'reflex-box ready';
                title.innerText = "WAIT FOR GREEN...";
                sub.innerText = "Don't tap yet!";
                
                const delay = 2000 + Math.random() * 3000; // 2-5s random
                timeoutId = setTimeout(() => {
                    reflexState = 'go';
                    box.className = 'reflex-box go';
                    title.innerText = "TAP NOW!";
                    startTime = performance.now();
                }, delay);
            } 
            else if (reflexState === 'wait') {
                clearTimeout(timeoutId);
                reflexState = 'idle';
                box.className = 'reflex-box';
                title.innerText = "TOO EARLY!";
                sub.innerText = "Tap to try again";
                log("> FALSE START DETECTED");
            } 
            else if (reflexState === 'go') {
                const endTime = performance.now();
                const score = Math.round(endTime - startTime);
                
                reflexState = 'idle';
                box.className = 'reflex-box';
                title.innerText = score + " ms";
                sub.innerText = getRank(score);
                
                document.getElementById('score-reflex').innerHTML = score + '<span class="unit">ms</span>';
                log(`> REACTION TIME: ${score}ms`);
                
                // Input Latency Estimate (Heuristic)
                // We assume ~15ms of that is system processing
                document.getElementById('score-lag').innerHTML = "~15<span class="unit">ms</span>";
            }
        }

        function getRank(ms) {
            if(ms < 180) return "GODLIKE 🏆";
            if(ms < 250) return "PRO GAMER 🎮";
            if(ms < 350) return "AVERAGE HUMAN 👤";
            return "SLEEPY... 💤";
        }

        // --- 2. SCROLL JANK ---
        const scrollBox = document.getElementById('scroll-box');
        // Fill scroll box
        for(let i=0; i<50; i++) {
            scrollBox.innerHTML += `<div class="scroll-item"><span>System Process ID: 0x${Math.floor(Math.random()*9999)}</span><span>Running</span></div>`;
        }

        let lastScrollTime = 0;
        function measureScroll() {
            const now = performance.now();
            const delta = now - lastScrollTime;
            lastScrollTime = now;
            
            // FPS = 1000 / frame time
            let fps = Math.round(1000 / delta);
            if(fps > 120) fps = 60; // Cap visual glitch
            
            document.getElementById('scroll-fps').innerText = fps + " FPS";
            
            if(fps < 30) {
                document.getElementById('scroll-fps').style.color = "var(--danger)";
                document.getElementById('scroll-fps').style.borderColor = "var(--danger)";
            } else {
                document.getElementById('scroll-fps').style.color = "var(--accent)";
                document.getElementById('scroll-fps').style.borderColor = "var(--accent)";
            }
        }

        // --- 3. TARGET PRACTICE ---
        const aimBox = document.getElementById('aim-box');
        let hits = 0;
        let total = 0;

        function spawnTarget() {
            // Remove old
            const old = document.querySelector('.target');
            if(old) old.remove();

            const t = document.createElement('div');
            t.className = 'target';
            
            // Random Pos (keep inside box)
            const x = Math.random() * (aimBox.offsetWidth - 50);
            const y = Math.random() * (aimBox.offsetHeight - 50);
            
            t.style.left = x + "px";
            t.style.top = y + "px";
            
            t.onclick = (e) => {
                e.stopPropagation(); // Don't trigger miss
                hitTarget();
            };
            
            aimBox.appendChild(t);
        }

        aimBox.onclick = () => {
            // Clicked box but missed target
            log("> MISS!");
            total++;
            updateAcc();
        };

        function hitTarget() {
            hits++;
            total++;
            updateAcc();
            document.getElementById('score-hits').innerText = hits;
            log("> DIRECT HIT");
            spawnTarget();
        }

        function updateAcc() {
            const acc = Math.round((hits / total) * 100);
            document.getElementById('score-acc').innerHTML = acc + '<span class="unit">%</span>';
        }

        // Start Aim Game
        spawnTarget();

    </script>
</body>
</html>
