<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UX Diagnostics | CheckThisPhone</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --surface-dark: #1e293b;
            --accent: #e11d48; /* Rose/Red for UX */
            --accent-dim: rgba(225, 29, 72, 0.2);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* HEADER */
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            margin-right: 15px;
        }
        .page-title { font-size: 20px; font-weight: 700; margin: 0; }

        /* FPS HERO */
        .fps-box {
            background: var(--surface-dark);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        .fps-val { font-size: 42px; font-weight: 800; color: var(--success); }
        .fps-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; }
        
        .spinner {
            width: 30px; height: 30px;
            border: 3px solid var(--accent);
            border-top-color: transparent;
            border-radius: 50%;
            margin: 10px auto;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* LATENCY TAPPER */
        .latency-area {
            background: #0f172a;
            border: 2px dashed #475569;
            border-radius: 12px;
            height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            margin-bottom: 25px;
            user-select: none;
            transition: background 0.05s;
        }
        .latency-area:active { background: #334155; border-color: var(--accent); }
        .ms-display { font-size: 24px; font-weight: 700; }

        /* KEYBOARD TEST */
        .keyboard-box {
            background: var(--surface-dark);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        input.test-input {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 16px;
        }

        /* SCROLL JANK TEST */
        .scroll-test {
            height: 100px;
            overflow-y: scroll;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 20px;
        }
        .scroll-item { padding: 10px; border-bottom: 1px solid #1e293b; font-size: 12px; }

        /* STATUS BADGE */
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
        }
        .badge.pass { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge.fail { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <button class="back-btn" onclick="window.location.href='index.html'">←</button>
        <h1 class="page-title">User Experience</h1>
    </div>

    <div class="fps-box">
        <div class="spinner"></div>
        <div class="fps-val" id="fps-display">--</div>
        <div class="fps-label">Real-time Frame Rate</div>
        <div style="font-size: 11px; color: var(--text-dim); margin-top: 5px;">
            Target: 60Hz or 120Hz
        </div>
    </div>

    <div style="margin-bottom: 5px; font-size: 12px; color: var(--text-dim);">TOUCH RESPONSIVENESS</div>
    <div class="latency-area" id="tap-zone" onpointerdown="inputStart()" onpointerup="inputEnd()">
        <span class="ms-display" id="latency-val">Tap Me</span>
        <span style="font-size: 11px; color: #94a3b8;">Tap quickly to measure input lag</span>
    </div>

    <div class="keyboard-box">
        <div style="display:flex; justify-content:space-between;">
            <span style="font-size:14px; font-weight:600;">⌨️ Keyboard Ghosting</span>
            <span class="badge pass" id="key-status">READY</span>
        </div>
        <input type="text" class="test-input" placeholder="Type here quickly..." oninput="checkTyping(this)">
    </div>

    <div style="margin-bottom: 5px; font-size: 12px; color: var(--text-dim);">SCROLL SMOOTHNESS</div>
    <div class="scroll-test" id="scroll-box">
        </div>

    <div class="keyboard-box" style="text-align: center;">
        <div style="font-size:14px; font-weight:600; margin-bottom: 10px;">📺 4K Playback Stress</div>
        <button onclick="startVideoTest()" style="background:var(--accent); border:none; color:white; padding:10px 20px; border-radius:6px; font-weight:700; cursor:pointer;">
            TEST DECODER
        </button>
        <div id="vid-res" style="margin-top:10px; font-size:12px; color:var(--text-dim);"></div>
    </div>

</div>

<script>
    // --- 1. FPS METER ---
    let frameCount = 0;
    let lastTime = performance.now();
    const fpsDisplay = document.getElementById('fps-display');

    function countFPS(now) {
        frameCount++;
        if (now - lastTime >= 1000) {
            const fps = Math.round(frameCount * 1000 / (now - lastTime));
            fpsDisplay.innerText = fps;
            
            // Color logic
            if(fps > 55) fpsDisplay.style.color = "var(--success)";
            else if(fps > 30) fpsDisplay.style.color = "var(--warning)";
            else fpsDisplay.style.color = "var(--danger)";

            frameCount = 0;
            lastTime = now;
        }
        requestAnimationFrame(countFPS);
    }
    requestAnimationFrame(countFPS);


    // --- 2. LATENCY TESTER ---
    let tStart = 0;
    
    function inputStart() {
        tStart = performance.now();
        document.getElementById('tap-zone').style.borderColor = "var(--accent)";
    }
    
    function inputEnd() {
        const tEnd = performance.now();
        const diff = (tEnd - tStart).toFixed(1);
        
        const el = document.getElementById('latency-val');
        el.innerText = diff + " ms";
        
        // Typical OS overhead is 5-20ms in browser
        if(diff < 50) el.style.color = "var(--success)";
        else el.style.color = "var(--warning)";

        document.getElementById('tap-zone').style.borderColor = "#475569";
    }


    // --- 3. SCROLL GENERATOR ---
    const scrollBox = document.getElementById('scroll-box');
    for(let i=1; i<=50; i++) {
        const div = document.createElement('div');
        div.className = 'scroll-item';
        div.innerText = `List Item #${i} - Scroll rapidly to check for stutter`;
        scrollBox.appendChild(div);
    }


    // --- 4. TYPING TEST ---
    let lastLen = 0;
    function checkTyping(el) {
        const currentLen = el.value.length;
        const status = document.getElementById('key-status');
        
        if (currentLen > lastLen + 1) {
            // Paste or super fast input
            status.innerText = "FAST INPUT";
        } else {
            status.innerText = "TYPING...";
        }
        
        setTimeout(() => {
            status.innerText = "READY";
        }, 500);
        
        lastLen = currentLen;
    }

    // --- 5. VIDEO STRESS (Simulated) ---
    function startVideoTest() {
        const res = document.getElementById('vid-res');
        res.innerText = "Allocating Video Decoder...";
        
        // We create a video element in memory to test codec support
        const video = document.createElement('video');
        const canPlay = video.canPlayType('video/mp4; codecs="avc1.42E01E"');
        
        setTimeout(() => {
            if(canPlay === "probably" || canPlay === "maybe") {
                res.innerHTML = "<span style='color:var(--success)'>PASS: H.264 Hardware Acceleration Available</span>";
            } else {
                res.innerHTML = "<span style='color:var(--danger)'>FAIL: Software Decoding Only</span>";
            }
        }, 800);
    }

</script>

</body>
</html>
