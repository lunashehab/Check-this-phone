<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wireless Tests | CheckThisPhone.com</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050505; 
            --panel: #0f1218; 
            --border: #2d3748; 
            --text: #a0aec0; 
            --text-bright: #e2e8f0;
            --accent: #00f0ff; /* Cyan */
            --secondary: #3b82f6; /* Blue */
            --danger: #ef4444; 
            --warn: #f59e0b; 
            --success: #10b981;
        }
        
        * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 20px; margin: 0; min-height: 100vh; font-size: 14px; overflow-x: hidden; }
        
        /* HEADER */
        .header { text-align: center; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        .logo { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 24px; color: var(--text-bright); letter-spacing: -1px; margin-bottom: 10px; }
        .logo span { color: var(--accent); }
        .subtitle { font-size: 12px; color: var(--text); text-transform: uppercase; letter-spacing: 1px; }

        /* GRID LAYOUT */
        .test-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        /* TEST CARD */
        .card { 
            background: var(--panel); 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }
        .card:hover { border-color: var(--accent); transform: translateY(-2px); }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .card-title { font-family: 'JetBrains Mono'; font-weight: 700; color: var(--text-bright); font-size: 13px; }
        .card-icon { font-size: 18px; opacity: 0.8; }
        
        .card-desc { font-size: 12px; color: var(--text); margin-bottom: 20px; line-height: 1.5; flex-grow: 1; }
        
        .result-box { 
            background: rgba(0,0,0,0.3); 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            padding: 10px; 
            margin-bottom: 15px; 
            font-family: 'JetBrains Mono'; 
            font-size: 11px; 
            color: var(--accent); 
            min-height: 40px;
            display: flex;
            align-items: center;
            overflow-wrap: anywhere;
        }
        
        .btn-group { display: flex; gap: 10px; }
        
        .btn { 
            flex: 1; 
            padding: 10px; 
            border-radius: 6px; 
            font-size: 11px; 
            font-weight: 700; 
            cursor: pointer; 
            text-transform: uppercase; 
            transition: 0.2s; 
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-bright);
        }
        
        .btn-run { background: var(--accent); color: #000; border: none; }
        .btn-run:hover { opacity: 0.9; }
        .btn-info:hover { border-color: var(--text-bright); }

        /* MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000;
            display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal {
            background: var(--panel); border: 1px solid var(--accent); border-radius: 12px;
            padding: 30px; max-width: 500px; width: 90%;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
        }
        .modal-title { font-family: 'JetBrains Mono'; font-size: 18px; color: var(--accent); margin-bottom: 15px; }
        .modal-body { font-size: 13px; line-height: 1.6; color: var(--text-bright); margin-bottom: 25px; }
        .modal-steps { margin-left: 20px; margin-bottom: 20px; color: var(--text); font-size: 12px; }
        .modal-close { background: var(--border); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; float: right; font-weight: 700; }

        /* FAQ SECTION */
        .faq-container { max-width: 800px; margin: 60px auto 20px auto; }
        .faq-header { font-family: 'JetBrains Mono'; font-size: 16px; color: var(--accent); margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .faq-item { background: var(--panel); border: 1px solid var(--border); margin-bottom: 10px; border-radius: 8px; overflow: hidden; }
        .faq-q { padding: 15px; cursor: pointer; font-weight: 700; display: flex; justify-content: space-between; font-size: 12px; color: var(--text-bright); }
        .faq-a { padding: 0 15px 15px 15px; color: var(--text); font-size: 12px; line-height: 1.5; display: none; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; }
        .faq-item.active .faq-a { display: block; }

        .sim-tag { font-size: 9px; opacity: 0.7; margin-left: 5px; border: 1px solid var(--border); padding: 1px 4px; border-radius: 3px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">CHECK<span>WIRELESS</span></div>
        <div class="subtitle">Browser-Based Connectivity Diagnostics</div>
    </div>

    <div class="test-grid" id="grid"></div>

    <div class="faq-container">
        <div class="faq-header">WIRELESS FAQ</div>
        <div id="faq-list"></div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-title" id="m-title"></div>
            <div class="modal-body" id="m-body"></div>
            <ul class="modal-steps" id="m-steps"></ul>
            <button class="modal-close" onclick="closeModal()">CLOSE</button>
        </div>
    </div>

    <script>
        // --- DATA: ALL TESTS ---
        const tests = [
            // WIFI & NETWORK
            { id: 'wifi_conn', title: 'Connection Status', icon: '📶', desc: 'Checks if the browser is online/offline.', type: 'nav_online' },
            { id: 'wifi_speed', title: 'Network Speed', icon: '🚀', desc: 'Estimates downlink speed (Mbps).', type: 'nav_conn' },
            { id: 'wifi_type', title: 'Network Type', icon: '📡', desc: 'Detects 4G, WiFi, or Cellular type.', type: 'nav_type' },
            { id: 'wifi_rtt', title: 'Round Trip Time', icon: '⏱️', desc: 'Measures latency to gateway.', type: 'nav_rtt' },
            { id: 'wifi_save', title: 'Data Saver', icon: '💾', desc: 'Checks if Data Saver mode is active.', type: 'nav_save' },
            
            // SIMULATED WIFI
            { id: 'wifi_sig', title: 'WiFi Signal', icon: '📶', desc: 'Simulated signal strength meter.', type: 'sim_meter', unit: '%' },
            { id: 'wifi_stab', title: 'WiFi Stability', icon: '〰️', desc: 'Checks for connection jitters.', type: 'sim_check' },
            { id: 'wifi_freq', title: '2.4 vs 5GHz', icon: '📻', desc: 'Estimates frequency band.', type: 'sim_logic', val: '5GHz (Est)' },
            { id: 'wifi_enc', title: 'Encryption', icon: '🔒', desc: 'Detects security protocol.', type: 'sim_logic', val: 'WPA3 (Secure)' },
            { id: 'wifi_packet', title: 'Packet Loss', icon: '📉', desc: 'Simulated ping packet drop test.', type: 'sim_meter', unit: '% Loss' },

            // BLUETOOTH
            { id: 'bt_avail', title: 'Bluetooth Avail', icon: '🦷', desc: 'Checks if Bluetooth radio is available.', type: 'bt_avail' },
            { id: 'bt_scan', title: 'Device Scan', icon: '🔍', desc: 'Attempts to scan for BLE devices.', type: 'bt_scan' },
            { id: 'bt_pair', title: 'Pairing Sim', icon: '🔗', desc: 'Simulates a pairing handshake.', type: 'sim_load' },
            { id: 'bt_lat', title: 'BT Latency', icon: '⏳', desc: 'Estimates audio delay.', type: 'sim_logic', val: '~140ms' },
            { id: 'bt_ble', title: 'BLE Support', icon: '🔋', desc: 'Checks Low Energy profile support.', type: 'sim_logic', val: 'Supported' },

            // NFC
            { id: 'nfc_avail', title: 'NFC Reader', icon: '📲', desc: 'Checks if NFC is supported/enabled.', type: 'nfc_check' },
            { id: 'nfc_scan', title: 'NFC Scan', icon: '🏷️', desc: 'Starts listening for NFC tags.', type: 'nfc_scan' },
            { id: 'nfc_range', title: 'Range Test', icon: '📏', desc: 'Manual range test instructions.', type: 'manual' },

            // MOBILE NETWORK
            { id: '4g_det', title: '4G/LTE Detect', icon: '4️⃣', desc: 'Verifies LTE connectivity.', type: 'net_logic', match: '4g' },
            { id: '5g_det', title: '5G Detect', icon: '5️⃣', desc: 'Verifies 5G connectivity.', type: 'sim_logic', val: 'Detected (NSA)' },
            { id: 'carrier', title: 'Carrier Info', icon: '🏢', desc: 'Simulated SIM card detection.', type: 'sim_logic', val: 'GSM/LTE Provider' },
            { id: 'roaming', title: 'Roaming', icon: '🌍', desc: 'Checks roaming status.', type: 'sim_logic', val: 'Home Network' },

            // WEBRTC
            { id: 'rtc_peer', title: 'Peer Connection', icon: '👥', desc: 'Creates a local WebRTC loopback.', type: 'rtc_conn' },
            { id: 'rtc_ice', title: 'ICE Candidates', icon: '🧊', desc: 'Gathers network candidates.', type: 'rtc_ice' },
            { id: 'rtc_lat', title: 'RTC Latency', icon: '⏱️', desc: 'Measures peer-to-peer delay.', type: 'rtc_sim' },

            // CASTING / NEARBY
            { id: 'cast', title: 'Chromecast', icon: '📺', desc: 'Scans for cast receivers.', type: 'sim_load' },
            { id: 'airdrop', title: 'Nearby Share', icon: '📡', desc: 'Simulates local peer discovery.', type: 'sim_load' },
            { id: 'local_net', title: 'Local IP', icon: '🏠', desc: 'Checks local network permission.', type: 'rtc_ip' },

            // MISC
            { id: 'airplane', title: 'Airplane Mode', icon: '✈️', desc: 'Detects offline state.', type: 'logic_air' },
            { id: 'hotspot', title: 'Hotspot Check', icon: '🔥', desc: 'Simulates tethering detection.', type: 'sim_logic', val: 'Inactive' },
            { id: 'interfere', title: 'Interference', icon: '🌫️', desc: 'Checks for signal noise.', type: 'sim_check' },
            { id: 'report', title: 'Radio Report', icon: '📝', desc: 'Summarizes all wireless caps.', type: 'report' }
        ];

        // --- RENDER GRID ---
        const grid = document.getElementById('grid');
        tests.forEach(test => {
            const card = document.createElement('div');
            card.className = 'card';
            
            let btnClass = 'btn-run';
            if(test.type.includes('bt_') || test.type.includes('nfc_')) btnClass = 'btn-run'; // Special styling if needed

            card.innerHTML = `
                <div class="card-header">
                    <span class="card-title">${test.title} ${test.type.includes('sim') ? '<span class="sim-tag">SIM</span>' : ''}</span>
                    <span class="card-icon">${test.icon}</span>
                </div>
                <div class="card-desc">${test.desc}</div>
                <div class="result-box" id="res-${test.id}">Ready</div>
                <div class="btn-group">
                    <button class="btn btn-info" onclick="showInfo('${test.id}')">INFO</button>
                    <button class="btn ${btnClass}" onclick="runTest('${test.id}')">RUN</button>
                </div>
            `;
            grid.appendChild(card);
        });

        // --- TEST LOGIC ---
        async function runTest(id) {
            const test = tests.find(t => t.id === id);
            const res = document.getElementById(`res-${id}`);
            res.innerText = "Analyzing...";
            res.style.color = "var(--warn)";

            // 1. NETWORK API
            if (test.type.startsWith('nav_')) {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (!conn) {
                    res.innerText = "API Not Supported";
                    return;
                }
                
                setTimeout(() => {
                    res.style.color = "var(--accent)";
                    if (test.type === 'nav_online') res.innerText = navigator.onLine ? "Online" : "Offline";
                    if (test.type === 'nav_conn') res.innerText = (conn.downlink || 0) + " Mbps";
                    if (test.type === 'nav_type') res.innerText = (conn.effectiveType || "Unknown").toUpperCase();
                    if (test.type === 'nav_rtt') res.innerText = (conn.rtt || 0) + " ms";
                    if (test.type === 'nav_save') res.innerText = conn.saveData ? "Active" : "Inactive";
                }, 500);
            }

            // 2. SIMULATIONS
            if (test.type === 'sim_meter') {
                let val = 0;
                const interval = setInterval(() => {
                    val = Math.floor(Math.random() * 100);
                    res.innerText = val + (test.unit || "");
                }, 100);
                setTimeout(() => { clearInterval(interval); res.style.color = "var(--accent)"; res.innerText = (test.id === 'wifi_packet' ? "0%" : "98%") + (test.unit || ""); }, 2000);
            }

            if (test.type === 'sim_check' || test.type === 'sim_load') {
                setTimeout(() => {
                    res.style.color = "var(--accent)";
                    res.innerText = "Pass / Stable";
                }, 2000);
            }

            if (test.type === 'sim_logic') {
                setTimeout(() => {
                    res.style.color = "var(--accent)";
                    res.innerText = test.val;
                }, 1000);
            }

            // 3. BLUETOOTH
            if (test.type === 'bt_avail') {
                if (navigator.bluetooth) {
                    const avail = await navigator.bluetooth.getAvailability();
                    res.innerText = avail ? "Available" : "Disabled";
                    res.style.color = avail ? "var(--accent)" : "var(--danger)";
                } else {
                    res.innerText = "API Not Supported";
                }
            }

            if (test.type === 'bt_scan') {
                if (navigator.bluetooth) {
                    res.innerText = "Requesting...";
                    try {
                        // Requires user gesture usually, might fail in auto-run
                        const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true });
                        res.innerText = "Found: " + device.name;
                    } catch(e) {
                        res.innerText = "User Cancelled / Error";
                    }
                } else {
                    res.innerText = "Not Supported";
                }
            }

            // 4. NFC
            if (test.type === 'nfc_check') {
                if ('NDEFReader' in window) {
                    res.innerText = "Hardware Supported";
                    res.style.color = "var(--accent)";
                } else {
                    res.innerText = "Not Supported";
                }
            }
            if (test.type === 'nfc_scan') {
                if ('NDEFReader' in window) {
                    try {
                        const ndef = new NDEFReader();
                        await ndef.scan();
                        res.innerText = "Scanning... Tap Tag";
                    } catch(e) {
                        res.innerText = "Error: " + e.name;
                    }
                } else {
                    res.innerText = "Not Supported";
                }
            }

            // 5. WEBRTC
            if (test.type === 'rtc_conn') {
                const pc = new RTCPeerConnection();
                res.innerText = pc ? "Created Successfully" : "Failed";
                if(pc) pc.close();
            }
            
            if (test.type === 'rtc_ice') {
                const pc = new RTCPeerConnection();
                pc.onicecandidate = (e) => {
                    if(e.candidate) {
                        res.innerText = "Candidate Found";
                        pc.close();
                    }
                };
                pc.createDataChannel("");
                pc.createOffer().then(o => pc.setLocalDescription(o));
                setTimeout(() => { if(res.innerText === "Analyzing...") res.innerText = "Timeout (No ICE)"; }, 3000);
            }

            if (test.type === 'rtc_ip') {
                // Try to leak local IP (often blocked by modern browsers)
                const pc = new RTCPeerConnection();
                pc.createDataChannel('');
                pc.createOffer().then(pc.setLocalDescription.bind(pc));
                pc.onicecandidate = (ice) => {
                    if (ice && ice.candidate && ice.candidate.candidate) {
                        const ipRegex = /([0-9]{1,3}(\.[0-9]{1,3}){3})/;
                        const match = ice.candidate.candidate.match(ipRegex);
                        if(match) res.innerText = "Local: " + match[1];
                    }
                };
                setTimeout(() => { if(res.innerText === "Analyzing...") res.innerText = "Hidden (Privacy)"; }, 2000);
            }

            // 6. MISC
            if (test.type === 'logic_air') {
                res.innerText = navigator.onLine ? "Off (Connected)" : "Likely On (Offline)";
                res.style.color = navigator.onLine ? "var(--accent)" : "var(--warn)";
            }

            if (test.type === 'report') {
                const conn = navigator.connection ? "NetInfo: Yes" : "NetInfo: No";
                const bt = navigator.bluetooth ? "BT: Yes" : "BT: No";
                const nfc = ('NDEFReader' in window) ? "NFC: Yes" : "NFC: No";
                res.innerText = `${conn} | ${bt} | ${nfc}`;
            }
            
            if (test.type === 'manual') {
                res.innerText = "Perform manual check";
            }
        }

        // --- FAQ ---
        const faqs = [
            { q: "Why can't I see signal strength?", a: "Browsers prevent access to raw hardware signal data (dBm) to prevent fingerprinting/tracking." },
            { q: "Bluetooth Scan failed?", a: "Bluetooth scanning requires a user gesture (click) and permission. It won't work automatically." },
            { q: "Does NFC work on iPhone?", a: "Web NFC is currently only supported on Chrome for Android. iOS does not support Web NFC yet." },
            { q: "Why is 5G not detected?", a: "The Network API often reports 5G as '4g' or 'cellular'. Precise 5G detection requires native apps." },
            { q: "What is Latency?", a: "The time it takes for data to travel from your device to the server and back. Lower is better." },
            { q: "Is Public WiFi safe?", a: "Generally no. Use a VPN. This page checks connection security type where possible." },
            { q: "What is Packet Loss?", a: "When data units fail to reach their destination. High packet loss causes lag in games and calls." },
            { q: "Why does Hotspot drain battery?", a: "It keeps both the cellular modem and WiFi radio active at high power to relay data." },
            { q: "Airplane Mode check?", a: "We infer Airplane Mode if the browser reports 'Offline'. It's an estimation." },
            { q: "WebRTC Leaks?", a: "WebRTC can sometimes reveal your Local IP address even behind a VPN. We test for this." }
        ];

        const faqList = document.getElementById('faq-list');
        faqs.forEach((f, i) => {
            const el = document.createElement('div');
            el.className = 'faq-item';
            el.innerHTML = `
                <div class="faq-q" onclick="toggleFaq(this)">${i+1}. ${f.q} <span>▼</span></div>
                <div class="faq-a">${f.a}</div>
            `;
            faqList.appendChild(el);
        });
        function toggleFaq(el) { el.parentElement.classList.toggle('active'); }

        // --- MODAL ---
        const instructions = {
            default: { t: "Wireless Test", b: "This test analyzes your device's connectivity hardware.", s: ["Click Run.", "Wait for scan.", "View result."] },
            bt_scan: { t: "Bluetooth Scan", b: "Scans for nearby Low Energy (BLE) devices.", s: ["Click Run.", "Allow Permission.", "Select a device to pair."] },
            nfc_scan: { t: "NFC Reader", b: "Reads NDEF tags using the NFC chip.", s: ["Click Run.", "Tap a tag to back of phone.", "Read data."] }
        };

        function showInfo(id) {
            const data = instructions[id] || instructions.default;
            document.getElementById('m-title').innerText = data.t;
            document.getElementById('m-body').innerText = data.b;
            const ul = document.getElementById('m-steps');
            ul.innerHTML = '';
            data.s.forEach(s => ul.innerHTML += `<li>${s}</li>`);
            document.getElementById('modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
    </script>
</body>
</html>
