<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Don Systems Software Matrix</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050505; 
            --panel: #0f1218; 
            --border: #2d3748; 
            --text: #a0aec0; 
            --text-bright: #e2e8f0;
            --accent: #d63384; /* Cyber Pink */
            --secondary: #6610f2; /* Deep Purple */
            --success: #00ff9d; 
            --danger: #ff0055; 
            --warn: #ffb700; 
        }
        
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 20px; margin: 0; min-height: 100vh; font-size: 14px; overflow-x: hidden; }
        
        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .logo { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 18px; color: var(--text-bright); letter-spacing: -1px; }
        .logo span { color: var(--accent); }
        .live-badge { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--success); font-weight: 700; background: rgba(0, 255, 157, 0.1); padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(0, 255, 157, 0.2); }
        .blink { animation: blink 1s infinite; width: 6px; height: 6px; background: var(--success); border-radius: 50%; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }

        /* FINGERPRINT HERO */
        .fingerprint-box { 
            background: radial-gradient(circle at top right, #1a1a2e, #000); border: 1px solid var(--border); border-radius: 16px; padding: 25px; margin-bottom: 20px; position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: space-between;
        }
        .fp-icon { font-size: 40px; margin-right: 20px; animation: scanText 3s infinite alternate; }
        @keyframes scanText { from { opacity: 0.5; text-shadow: 0 0 0px var(--accent); } to { opacity: 1; text-shadow: 0 0 20px var(--accent); } }
        
        .hash-display { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent); word-break: break-all; font-weight: 700; background: rgba(214, 51, 132, 0.1); padding: 10px; border-radius: 8px; border: 1px solid rgba(214, 51, 132, 0.2); flex: 1; }
        .fp-label { font-size: 10px; color: var(--text); text-transform: uppercase; margin-bottom: 5px; display: block; }

        /* DATA GRID */
        .grid-master { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        
        .info-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 15px; }
        .label { font-size: 10px; color: var(--text); text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px; }
        .value { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--text-bright); font-weight: 700; }
        .value.highlight { color: var(--secondary); }
        
        /* CAPABILITIES LIST */
        .cap-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .cap-item { background: rgba(255,255,255,0.03); padding: 8px; border-radius: 6px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; }
        .cap-good { color: var(--success); }
        .cap-bad { color: var(--danger); }

        /* RAW AGENT BOX */
        .agent-box { background: #000; padding: 15px; border-radius: 12px; border: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #64748b; line-height: 1.4; word-break: break-all; margin-bottom: 20px; }

        /* TERMINAL */
        .terminal { background: #000; border: 1px solid var(--border); border-radius: 8px; padding: 10px; height: 120px; overflow: hidden; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--accent); position: relative; }
        .log-line { margin-bottom: 2px; opacity: 0.8; }
        .terminal::after { content: ""; position: absolute; bottom: 0; left: 0; width: 100%; height: 20px; background: linear-gradient(to top, #000, transparent); }

        .back-btn { display: block; text-align: center; margin-top: 20px; color: var(--text); text-decoration: none; font-weight: 700; padding: 15px; background: var(--panel); border-radius: 12px; }
        
        .action-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text-bright); width: 100%; padding: 15px; border-radius: 12px; font-weight: 700; margin-bottom: 20px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; }
        .action-btn:hover { border-color: var(--accent); color: var(--accent); }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">DON<span>MATRIX</span></div>
        <div class="live-badge"><div class="blink"></div> SYSTEM ROOT</div>
    </div>

    <div class="fingerprint-box">
        <div class="fp-icon">🆔</div>
        <div style="flex:1">
            <span class="fp-label">UNIQUE DEVICE FINGERPRINT</span>
            <div class="hash-display" id="fp-hash">GENERATING HASH...</div>
        </div>
    </div>

    <div class="grid-master">
        <div class="info-card">
            <div class="label">OPERATING SYSTEM</div>
            <div class="value highlight" id="os-val">DETECTING...</div>
        </div>
        <div class="info-card">
            <div class="label">BROWSER ENGINE</div>
            <div class="value" id="browser-val">DETECTING...</div>
        </div>
        <div class="info-card">
            <div class="label">CPU ARCHITECTURE</div>
            <div class="value" id="cpu-val">--</div>
        </div>
        <div class="info-card">
            <div class="label">LANGUAGE</div>
            <div class="value" id="lang-val">--</div>
        </div>
    </div>

    <div class="agent-box" id="raw-agent">
        // RAW USER AGENT STRING LOADING...
    </div>

    <h3 style="font-size: 12px; margin-bottom: 10px; color: var(--text); text-transform: uppercase;">ENVIRONMENT CAPABILITIES</h3>
    <div class="cap-list" id="cap-grid">
        </div>
    <br>

    <button class="action-btn" onclick="runIntegrityScan()">RUN INTEGRITY SCAN</button>

    <div class="terminal" id="console-output">
        <div class="log-line">> SOFTWARE KERNEL INIT...</div>
        <div class="log-line">> PARSING USER AGENT...</div>
    </div>

    <a href="../index.html" class="back-btn">EXIT MATRIX</a>

    <script>
        // --- LOGGING ---
        function log(msg) {
            const term = document.getElementById('console-output');
            const line = document.createElement('div');
            line.className = 'log-line';
            line.innerHTML = `<span style="color:#64748b">[SYS]</span> ${msg}`;
            term.appendChild(line);
            if(term.children.length > 6) term.removeChild(term.children[0]);
            term.scrollTop = term.scrollHeight;
        }

        // --- 1. DEVICE FINGERPRINTING ---
        function generateFingerprint() {
            // We use Canvas Fingerprinting to create a unique ID
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const txt = "DonSystems_Hardware_ID_v1.0";
            
            ctx.textBaseline = "top";
            ctx.font = "14px 'Arial'";
            ctx.textBaseline = "alphabetic";
            ctx.fillStyle = "#f60";
            ctx.fillRect(125,1,62,20);
            ctx.fillStyle = "#069";
            ctx.fillText(txt, 2, 15);
            ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
            ctx.fillText(txt, 4, 17);
            
            // Generate hash from data URL
            const dataURI = canvas.toDataURL();
            let hash = 0;
            for (let i = 0; i < dataURI.length; i++) {
                const char = dataURI.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            
            const hexHash = Math.abs(hash).toString(16).toUpperCase().padStart(8, '0');
            document.getElementById('fp-hash').innerText = `DS-${hexHash}-X`;
            log(`> DEVICE ID GENERATED: DS-${hexHash}`);
        }

        // --- 2. OS & BROWSER DETECTION ---
        function scanSystem() {
            const ua = navigator.userAgent;
            document.getElementById('raw-agent').innerText = ua;
            
            // Detect OS
            let os = "Unknown OS";
            if (ua.indexOf("Win") != -1) os = "Windows";
            if (ua.indexOf("Mac") != -1) os = "MacOS";
            if (ua.indexOf("Linux") != -1) os = "Linux";
            if (ua.indexOf("Android") != -1) os = "Android";
            if (ua.indexOf("like Mac") != -1) os = "iOS";
            
            // Detect Browser
            let browser = "Unknown";
            if(ua.indexOf("Chrome") != -1) browser = "Chrome (Blink)";
            else if(ua.indexOf("Safari") != -1) browser = "Safari (WebKit)";
            else if(ua.indexOf("Firefox") != -1) browser = "Firefox (Gecko)";
            
            document.getElementById('os-val').innerText = os;
            document.getElementById('browser-val').innerText = browser;
            document.getElementById('lang-val').innerText = navigator.language.toUpperCase();
            document.getElementById('cpu-val').innerText = navigator.hardwareConcurrency ? navigator.hardwareConcurrency + " CORES" : "HIDDEN";
            
            log(`> KERNEL DETECTED: ${os}`);
        }

        // --- 3. CAPABILITIES SCAN ---
        function checkCaps() {
            const caps = [
                { name: "Cookies", check: navigator.cookieEnabled },
                { name: "Do Not Track", check: navigator.doNotTrack === "1" ? false : true }, // DNT on = secure
                { name: "WebAssembly", check: typeof WebAssembly === 'object' },
                { name: "Service Worker", check: 'serviceWorker' in navigator },
                { name: "Secure Context", check: window.isSecureContext },
                { name: "Touch Points", check: navigator.maxTouchPoints > 0 }
            ];

            const grid = document.getElementById('cap-grid');
            grid.innerHTML = "";
            
            caps.forEach(cap => {
                const status = cap.check ? "ENABLED" : "DISABLED";
                const color = cap.check ? "cap-good" : "cap-bad";
                const icon = cap.check ? "✅" : "❌";
                
                grid.innerHTML += `
                    <div class="cap-item">
                        <span>${cap.name}</span>
                        <span class="${color}">${icon} ${status}</span>
                    </div>
                `;
            });
            log("> CAPABILITY AUDIT COMPLETE");
        }

        // --- 4. INTEGRITY SCAN ---
        function runIntegrityScan() {
            log("> STARTING DEEP INTEGRITY SCAN...");
            const btn = document.querySelector('.action-btn');
            btn.innerText = "SCANNING...";
            btn.style.background = "var(--border)";
            
            setTimeout(() => {
                // Heuristic check for root/jailbreak artifacts in UA
                const ua = navigator.userAgent.toLowerCase();
                const rooted = ua.includes("cyanogen") || ua.includes("mod") || ua.includes("cydia");
                
                if(rooted) {
                    alert("⚠️ SYSTEM ALERT\n\nPossible Root/Jailbreak Detected.\nIntegrity: COMPROMISED");
                    log("> INTEGRITY: FAIL (ROOT DETECTED)");
                } else {
                    alert("✅ SYSTEM SECURE\n\nNo root artifacts found.\nEnvironment is standard production.");
                    log("> INTEGRITY: PASS (OFFICIAL ROM)");
                }
                
                btn.innerText = "RUN INTEGRITY SCAN";
                btn.style.background = "";
            }, 2000);
        }

        // Auto Start
        generateFingerprint();
        scanSystem();
        checkCaps();

    </script>
</body>
</html>
