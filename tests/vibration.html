<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vibration Tests | CheckThisPhone.com</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050505; 
            --panel: #0f1218; 
            --border: #2d3748; 
            --text: #a0aec0; 
            --text-bright: #e2e8f0;
            --accent: #ff9f43; /* Orange */
            --secondary: #3b82f6; /* Blue */
            --danger: #ef4444; 
            --warn: #f59e0b; 
            --success: #10b981;
        }
        
        * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 20px; margin: 0; min-height: 100vh; font-size: 14px; overflow-x: hidden; }
        
        /* HEADER */
        .header { text-align: center; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        .logo { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 24px; color: var(--text-bright); letter-spacing: -1px; margin-bottom: 10px; }
        .logo span { color: var(--accent); }
        .subtitle { font-size: 12px; color: var(--text); text-transform: uppercase; letter-spacing: 1px; }

        /* GRID LAYOUT */
        .test-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        /* TEST CARD */
        .card { 
            background: var(--panel); 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }
        .card:hover { border-color: var(--accent); transform: translateY(-2px); }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .card-title { font-family: 'JetBrains Mono'; font-weight: 700; color: var(--text-bright); font-size: 13px; }
        .card-icon { font-size: 18px; opacity: 0.8; }
        
        .card-desc { font-size: 12px; color: var(--text); margin-bottom: 20px; line-height: 1.5; flex-grow: 1; }
        
        .result-box { 
            background: rgba(0,0,0,0.3); 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            padding: 10px; 
            margin-bottom: 15px; 
            font-family: 'JetBrains Mono'; 
            font-size: 11px; 
            color: var(--accent); 
            min-height: 40px;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }
        
        .btn-group { display: flex; gap: 10px; }
        
        .btn { 
            flex: 1; 
            padding: 10px; 
            border-radius: 6px; 
            font-size: 11px; 
            font-weight: 700; 
            cursor: pointer; 
            text-transform: uppercase; 
            transition: 0.2s; 
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-bright);
        }
        
        .btn-run { background: var(--accent); color: #000; border: none; }
        .btn-run:hover { opacity: 0.9; }
        .btn-stop { background: var(--danger); color: white; border: none; }
        .btn-info:hover { border-color: var(--text-bright); }

        /* VISUALIZER */
        .haptic-viz {
            height: 4px; width: 0%; background: var(--accent); 
            position: absolute; bottom: 0; left: 0; transition: width 0.1s;
        }
        .card.active .haptic-viz { width: 100%; transition: width 0.1s; }

        /* MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000;
            display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal {
            background: var(--panel); border: 1px solid var(--accent); border-radius: 12px;
            padding: 30px; max-width: 500px; width: 90%;
            box-shadow: 0 0 30px rgba(255, 159, 67, 0.2);
        }
        .modal-title { font-family: 'JetBrains Mono'; font-size: 18px; color: var(--accent); margin-bottom: 15px; }
        .modal-body { font-size: 13px; line-height: 1.6; color: var(--text-bright); margin-bottom: 25px; }
        .modal-steps { margin-left: 20px; margin-bottom: 20px; color: var(--text); font-size: 12px; }
        .modal-close { background: var(--border); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; float: right; font-weight: 700; }

        /* FAQ SECTION */
        .faq-container { max-width: 800px; margin: 60px auto 20px auto; }
        .faq-header { font-family: 'JetBrains Mono'; font-size: 16px; color: var(--accent); margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .faq-item { background: var(--panel); border: 1px solid var(--border); margin-bottom: 10px; border-radius: 8px; overflow: hidden; }
        .faq-q { padding: 15px; cursor: pointer; font-weight: 700; display: flex; justify-content: space-between; font-size: 12px; color: var(--text-bright); }
        .faq-a { padding: 0 15px 15px 15px; color: var(--text); font-size: 12px; line-height: 1.5; display: none; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; }
        .faq-item.active .faq-a { display: block; }

        .sim-tag { font-size: 9px; opacity: 0.7; margin-left: 5px; border: 1px solid var(--border); padding: 1px 4px; border-radius: 3px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">CHECK<span>VIBE</span></div>
        <div class="subtitle">Browser-Based Vibration Diagnostics</div>
    </div>

    <div class="test-grid" id="grid"></div>

    <div class="faq-container">
        <div class="faq-header">VIBRATION FAQ</div>
        <div id="faq-list"></div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-title" id="m-title"></div>
            <div class="modal-body" id="m-body"></div>
            <ul class="modal-steps" id="m-steps"></ul>
            <button class="modal-close" onclick="closeModal()">CLOSE</button>
        </div>
    </div>

    <script>
        // --- DATA: ALL TESTS ---
        const tests = [
            // BASIC
            { id: 'basic', title: 'Basic Vibration', icon: '📳', desc: 'Triggers a standard 200ms vibration pulse.', type: 'vib', pat: 200 },
            { id: 'short', title: 'Short Pulse', icon: '⚡', desc: 'Triggers a sharp 50ms tick.', type: 'vib', pat: 50 },
            { id: 'long', title: 'Long Pulse', icon: '〰️', desc: 'Triggers a sustained 1000ms vibration.', type: 'vib', pat: 1000 },
            { id: 'repeat', title: 'Repeated Pulse', icon: '🔁', desc: 'Pulses 3 times in quick succession.', type: 'vib', pat: [200, 100, 200, 100, 200] },
            { id: 'stop', title: 'Stop Test', icon: '⏹️', desc: 'Verifies that vibration can be cancelled immediately.', type: 'vib_stop' },

            // PATTERNS
            { id: 'pattern', title: 'Pattern Test', icon: '📈', desc: 'Plays a specific rhythm: Da-Da-Daaa.', type: 'vib', pat: [100, 50, 100, 50, 400] },
            { id: 'heart', title: 'Heartbeat', icon: '❤️', desc: 'Simulates a double-thump heartbeat rhythm.', type: 'vib', pat: [100, 100, 100, 600] },
            { id: 'morse', title: 'Morse Code', icon: '📟', desc: 'Vibrates "SOS" in Morse Code.', type: 'vib', pat: [100,50,100,50,100, 300, 300,100,300,100,300, 300, 100,50,100,50,100] },
            { id: 'ramp_up', title: 'Ramp Up', icon: '↗️', desc: 'Increasing intensity simulation.', type: 'sim_ramp', dir: 'up' },
            { id: 'ramp_down', title: 'Ramp Down', icon: '↘️', desc: 'Decreasing intensity simulation.', type: 'sim_ramp', dir: 'down' },
            { id: 'wave', title: 'Wave Pattern', icon: '🌊', desc: 'Oscillating pulse duration.', type: 'vib_wave' },
            { id: 'stutter', title: 'Stutter', icon: '🪜', desc: 'Rapid-fire short bursts.', type: 'vib', pat: [50,50,50,50,50,50,50,50] },
            { id: 'sos', title: 'SOS Alert', icon: '🆘', desc: 'Standard distress signal pattern.', type: 'vib', pat: [100,100,100,100,100, 300, 300,300,300,300,300, 300, 100,100,100,100,100] },

            // INTENSITY (Simulated via duration)
            { id: 'weak', title: 'Weak Sim', icon: '🌑', desc: 'Very short pulses to mimic low intensity.', type: 'vib', pat: [20] },
            { id: 'med', title: 'Medium Sim', icon: '🌗', desc: 'Standard pulses.', type: 'vib', pat: [200] },
            { id: 'strong', title: 'Strong Sim', icon: '🌕', desc: 'Long pulses to maximize motor spin.', type: 'vib', pat: [1000] },
            { id: 'perception', title: 'Perception Test', icon: '🧠', desc: 'Can you feel a 10ms micro-pulse?', type: 'vib', pat: 10 },
            { id: 'consistency', title: 'Consistency', icon: '⚖️', desc: 'Checks for motor dropouts during long run.', type: 'vib', pat: 2000 },

            // HAPTIC FEEDBACK
            { id: 'tap', title: 'Tap Feedback', icon: '👆', desc: 'UI interaction click simulation.', type: 'vib', pat: 15 },
            { id: 'keyboard', title: 'Keyboard Haptic', icon: '⌨️', desc: 'Simulates typing feedback.', type: 'vib_loop', dur: 30 },
            { id: 'notif', title: 'Notification', icon: '🔔', desc: 'Standard "Buzz-Buzz" alert.', type: 'vib', pat: [200, 100, 200] },
            { id: 'call', title: 'Incoming Call', icon: '📞', desc: 'Long repeated vibration pattern.', type: 'vib_loop', pat: [1000, 500] },
            { id: 'alarm', title: 'Alarm Haptic', icon: '⏰', desc: 'Aggressive wake-up pattern.', type: 'vib_loop', pat: [500, 100] },
            { id: 'game', title: 'Game Impact', icon: '🎮', desc: 'Simulates an explosion or hit.', type: 'vib', pat: 400 },
            { id: 'success', title: 'Success Haptic', icon: '✅', desc: 'Two quick, light taps.', type: 'vib', pat: [50, 50, 50] },
            { id: 'fail', title: 'Failure Haptic', icon: '❌', desc: 'Three heavy thuds.', type: 'vib', pat: [100, 50, 100, 50, 100] },

            // HARDWARE / MANUAL
            { id: 'response', title: 'Response Time', icon: '⏱️', desc: 'Measures lag between click and buzz.', type: 'vib_time' },
            { id: 'stability', title: 'Motor Stability', icon: '🧱', desc: 'Sustained run to check fading.', type: 'vib', pat: 3000 },
            { id: 'noise', title: 'Motor Noise', icon: '🔊', desc: 'Listen for rattling sounds.', type: 'manual' },
            { id: 'rattle', title: 'Rattle Detect', icon: '🔩', desc: 'Shake while vibrating to hear loose parts.', type: 'manual' },
            { id: 'heat', title: 'Heat Sim', icon: '🔥', desc: 'Runs motor to generate heat (Simulated).', type: 'vib', pat: 5000 },

            // ADVANCED / SYSTEM
            { id: 'duration', title: 'Duration Check', icon: '📏', desc: 'Verifies OS honors duration requests.', type: 'logic_dur' },
            { id: 'dropout', title: 'Dropout Detect', icon: '📉', desc: 'Checks if vibration stops unexpectedly.', type: 'manual' },
            { id: 'perm', title: 'Permission', icon: '🛡️', desc: 'Checks if Vibration API is allowed.', type: 'logic_perm' },
            { id: 'silent', title: 'Silent Mode', icon: '🔕', desc: 'Checks if vibration works in silent mode.', type: 'manual' },
            { id: 'dnd', title: 'DND Check', icon: '⛔', desc: 'Checks behavior during Do Not Disturb.', type: 'manual' },
            { id: 'report', title: 'Engine Report', icon: '📝', desc: 'Capabilities summary.', type: 'report' },

            // COMBINED
            { id: 'touch_vib', title: 'Touch + Vibe', icon: 'point', desc: 'Vibrates wherever you touch.', type: 'interactive' },
            { id: 'motion_vib', title: 'Motion + Vibe', icon: '👋', desc: 'Vibrates when you shake device.', type: 'interactive_motion' },
            { id: 'audio_vib', title: 'Audio Sync', icon: '🎵', desc: 'Plays tone and vibration together.', type: 'vib_audio' },
            { id: 'flash_vib', title: 'Flash Alert', icon: '📸', desc: 'Flashes screen and vibrates.', type: 'vib_flash' }
        ];

        // --- RENDER GRID ---
        const grid = document.getElementById('grid');
        tests.forEach(test => {
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-${test.id}`;
            
            // Add visualizer bar
            const viz = document.createElement('div');
            viz.className = 'haptic-viz';
            card.appendChild(viz);

            card.innerHTML += `
                <div class="card-header">
                    <span class="card-title">${test.title}</span>
                    <span class="card-icon">${test.icon}</span>
                </div>
                <div class="card-desc">${test.desc}</div>
                <div class="result-box" id="res-${test.id}">Ready</div>
                <div class="btn-group">
                    <button class="btn btn-info" onclick="showInfo('${test.id}')">INFO</button>
                    <button class="btn btn-run" onclick="runTest('${test.id}')">RUN</button>
                </div>
            `;
            grid.appendChild(card);
        });

        // --- TEST ENGINE ---
        let loopInterval;
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

        async function runTest(id) {
            const test = tests.find(t => t.id === id);
            const res = document.getElementById(`res-${id}`);
            const card = document.getElementById(`card-${id}`);
            
            // Stop previous loops
            if(loopInterval) clearInterval(loopInterval);
            navigator.vibrate(0);
            
            res.innerText = "Running...";
            res.style.color = "var(--warn)";
            
            // iOS CHECK
            if(isIOS && test.type !== 'manual' && test.type !== 'report') {
                res.innerText = "Not Supported on iOS";
                res.style.color = "var(--danger)";
                return;
            }

            // VISUAL FEEDBACK
            card.classList.add('active');
            setTimeout(() => card.classList.remove('active'), 200);

            // 1. STANDARD VIBRATION
            if (test.type === 'vib') {
                const success = navigator.vibrate(test.pat);
                res.innerText = success ? "Vibrating..." : "Failed / Blocked";
                res.style.color = success ? "var(--success)" : "var(--danger)";
                if(success && typeof test.pat === 'number') setTimeout(() => res.innerText = "Complete", test.pat + 100);
                else if(success) setTimeout(() => res.innerText = "Complete", 2000);
            }

            // 2. STOP TEST
            if (test.type === 'vib_stop') {
                navigator.vibrate(5000);
                res.innerText = "Vibrating (5s)...";
                setTimeout(() => {
                    navigator.vibrate(0);
                    res.innerText = "Stopped Abruptly (Pass)";
                    res.style.color = "var(--success)";
                }, 1000);
            }

            // 3. LOOPS
            if (test.type === 'vib_loop') {
                res.innerText = "Looping... (Tap to Stop)";
                // Note: Actual loop requires setInterval as navigator.vibrate doesn't loop natively easily
                let pattern = Array.isArray(test.pat) ? test.pat : [test.dur];
                const totalDur = pattern.reduce((a,b)=>a+b, 0);
                
                navigator.vibrate(pattern); // First run
                loopInterval = setInterval(() => {
                    navigator.vibrate(pattern);
                    card.classList.toggle('active');
                }, totalDur + 200);
                
                // Change button to STOP
                const btn = card.querySelector('.btn-run');
                const oldText = btn.innerText;
                btn.innerText = "STOP";
                btn.classList.add('btn-stop');
                btn.onclick = () => {
                    clearInterval(loopInterval);
                    navigator.vibrate(0);
                    res.innerText = "Stopped";
                    btn.innerText = oldText;
                    btn.classList.remove('btn-stop');
                    btn.onclick = () => runTest(id);
                };
            }

            // 4. SIMULATIONS
            if (test.type === 'sim_ramp') {
                // Browsers can't control intensity, so we pulse rapidly
                let pulse = test.dir === 'up' ? 20 : 100;
                res.innerText = "Simulating Intensity...";
                let count = 0;
                loopInterval = setInterval(() => {
                    navigator.vibrate(pulse);
                    pulse = test.dir === 'up' ? pulse + 10 : pulse - 10;
                    if(pulse <= 10 || pulse >= 150 || count > 10) {
                        clearInterval(loopInterval);
                        res.innerText = "Simulation Complete";
                    }
                    count++;
                }, 200);
            }

            if (test.type === 'vib_wave') {
                res.innerText = "Wave Pattern...";
                const wavePat = [50, 50, 100, 50, 200, 50, 400, 50, 200, 50, 100];
                navigator.vibrate(wavePat);
                setTimeout(() => res.innerText = "Complete", 2000);
            }

            // 5. HARDWARE CHECKS
            if (test.type === 'vib_time') {
                const start = performance.now();
                navigator.vibrate(50);
                const end = performance.now();
                res.innerText = `Latency: ${(end - start).toFixed(1)}ms`;
                res.style.color = "var(--success)";
            }

            // 6. LOGIC / REPORT
            if (test.type === 'logic_perm') {
                res.innerText = "vibrate" in navigator ? "API Available" : "API Missing";
            }
            
            if (test.type === 'report') {
                const hasVib = "vibrate" in navigator;
                res.innerText = hasVib ? "Motor: Detected | API: Active" : "Motor: Unknown | API: Missing";
            }

            // 7. INTERACTIVE
            if (test.type === 'interactive') {
                res.innerText = "Touch Screen Now";
                const touchHandler = () => {
                    navigator.vibrate(50);
                    res.innerText = "Vibration Triggered";
                    card.classList.add('active');
                    setTimeout(() => card.classList.remove('active'), 100);
                };
                document.addEventListener('touchstart', touchHandler);
                setTimeout(() => document.removeEventListener('touchstart', touchHandler), 5000);
            }

            if (test.type === 'interactive_motion') {
                if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                    DeviceMotionEvent.requestPermission().then(r => { if(r=='granted') startMotion(); });
                } else {
                    startMotion();
                }
                function startMotion() {
                    res.innerText = "Shake Device...";
                    const handler = (e) => {
                        const acc = e.accelerationIncludingGravity;
                        if (acc && (Math.abs(acc.x) > 15 || Math.abs(acc.y) > 15)) {
                            navigator.vibrate(200);
                            res.innerText = "Shake Detected!";
                        }
                    };
                    window.addEventListener('devicemotion', handler);
                    setTimeout(() => window.removeEventListener('devicemotion', handler), 5000);
                }
            }

            if (test.type === 'vib_audio') {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.connect(ctx.destination);
                osc.start();
                navigator.vibrate(1000);
                res.innerText = "Sync Test Active";
                setTimeout(() => { osc.stop(); res.innerText = "Complete"; }, 1000);
            }

            if (test.type === 'vib_flash') {
                document.body.style.backgroundColor = '#fff';
                navigator.vibrate(200);
                setTimeout(() => { document.body.style.backgroundColor = ''; res.innerText = "Flash + Vibe Sent"; }, 200);
            }

            // 8. MANUAL
            if (test.type === 'manual') {
                navigator.vibrate(2000);
                res.innerText = "Observe Device...";
            }
        }

        // --- FAQ ---
        const faqs = [
            { q: "Why doesn't it work on iPhone?", a: "Apple blocks the Vibration API in Safari for privacy/ad-prevention reasons. It currently only works on Android." },
            { q: "Can I change vibration strength?", a: "No. The web API only allows controlling duration (time on/off), not intensity." },
            { q: "What is Haptic Feedback?", a: "It is the use of touch (vibration) to communicate with the user, like a 'click' feeling when typing." },
            { q: "Why is my vibration weak?", a: "This is hardware dependent. Some phones have powerful Linear Resonant Actuators (LRA), others have older rotating motors." },
            { q: "Does this drain battery?", a: "Yes, motors use mechanical energy. Constant vibration drains battery faster than screen-on time." },
            { q: "What is Phantom Vibration?", a: "A psychological phenomenon where you think your phone vibrated but it didn't." },
            { q: "Why doesn't it vibrate in Silent Mode?", a: "Some system settings override browser commands. Check your 'Sound & Haptics' settings." },
            { q: "Is the Pattern Test accurate?", a: "Yes, it sends precise timing arrays to the hardware driver." },
            { q: "Can I damage the motor?", a: "Extremely unlikely via software. The hardware has built-in thermal limits." },
            { q: "Why do games feel better?", a: "Native apps have access to low-level haptic APIs that offer finer control than the web browser." }
        ];

        const faqList = document.getElementById('faq-list');
        faqs.forEach((f, i) => {
            const el = document.createElement('div');
            el.className = 'faq-item';
            el.innerHTML = `
                <div class="faq-q" onclick="toggleFaq(this)">${i+1}. ${f.q} <span>▼</span></div>
                <div class="faq-a">${f.a}</div>
            `;
            faqList.appendChild(el);
        });
        function toggleFaq(el) { el.parentElement.classList.toggle('active'); }

        // --- MODAL ---
        const instructions = {
            default: { t: "Vibration Test", b: "This test triggers your phone's vibration motor.", s: ["Click Run.", "Hold phone.", "Feel for buzz."] },
            pattern: { t: "Pattern Test", b: "Plays a rhythmic vibration sequence.", s: ["Click Run.", "Wait for sequence.", "Verify rhythm."] },
            manual: { t: "Manual Check", b: "This requires your observation.", s: ["Click Run.", "Listen/Feel.", "Verify result yourself."] }
        };

        function showInfo(id) {
            const data = instructions[id] || instructions.default;
            document.getElementById('m-title').innerText = data.t;
            document.getElementById('m-body').innerText = data.b;
            const ul = document.getElementById('m-steps');
            ul.innerHTML = '';
            data.s.forEach(s => ul.innerHTML += `<li>${s}</li>`);
            document.getElementById('modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
    </script>
    <script src="ctp-report.js"></script>
</body>
</html>
