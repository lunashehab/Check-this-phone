<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Diagnostics | CheckThisPhone</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --surface-dark: #1e293b;
            --accent: #8b5cf6; /* Violet for Audio */
            --accent-glow: rgba(139, 92, 246, 0.4);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* HEADER */
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            margin-right: 15px;
        }
        .page-title { font-size: 20px; font-weight: 700; margin: 0; }

        /* VISUALIZER HERO */
        .visualizer-box {
            background: #000;
            height: 120px;
            border-radius: 12px;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }
        
        .bar-container {
            display: flex;
            gap: 4px;
            align-items: flex-end;
            height: 60px;
        }
        
        .anim-bar {
            width: 6px;
            background: var(--accent);
            border-radius: 3px;
            height: 10px;
            animation: bounce 0.5s infinite ease-in-out alternate;
        }
        
        /* Different timings for bars to look random */
        .anim-bar:nth-child(1) { animation-duration: 0.4s; }
        .anim-bar:nth-child(2) { animation-duration: 0.6s; }
        .anim-bar:nth-child(3) { animation-duration: 0.3s; }
        .anim-bar:nth-child(4) { animation-duration: 0.5s; }
        .anim-bar:nth-child(5) { animation-duration: 0.7s; }

        @keyframes bounce { 0% { height: 10px; opacity: 0.5; } 100% { height: 50px; opacity: 1; } }

        /* TEST MODULES */
        .module-card {
            background: var(--surface-dark);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .module-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .module-title { font-weight: 600; font-size: 15px; }
        .module-status { font-size: 11px; color: var(--text-dim); background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 4px; }

        /* STEREO BUTTONS */
        .stereo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn-test {
            background: var(--surface-dark);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-test:active { background: var(--accent); color: white; }

        /* MIC RECORDER */
        .mic-controls { display: flex; gap: 10px; }
        .btn-record { 
            flex: 1; 
            background: var(--danger); 
            color: white; border: none; 
            padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer;
        }
        .btn-play { 
            flex: 1; 
            background: var(--success); 
            color: white; border: none; 
            padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer;
            opacity: 0.5; pointer-events: none; /* Disabled initially */
        }
        .btn-play.active { opacity: 1; pointer-events: auto; }

        /* WATER EJECT */
        .water-btn {
            width: 100%;
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .water-btn:active { transform: scale(0.98); }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <button class="back-btn" onclick="window.location.href='index.html'">←</button>
        <h1 class="page-title">Audio & Speaker</h1>
    </div>

    <div class="visualizer-box">
        <div class="bar-container" id="visualizer-bars" style="opacity: 0.2;">
            <div class="anim-bar"></div><div class="anim-bar"></div><div class="anim-bar"></div>
            <div class="anim-bar"></div><div class="anim-bar"></div>
        </div>
        <div style="position: absolute; font-size: 12px; color: #64748b;">Audio Output Inactive</div>
    </div>

    <div class="module-card">
        <div class="module-header">
            <span class="module-title">🔊 Stereo Separation</span>
            <span class="module-status">Check Channels</span>
        </div>
        <div class="stereo-grid">
            <button class="btn-test" onclick="playTone('left')">LEFT Speaker</button>
            <button class="btn-test" onclick="playTone('right')">RIGHT Speaker</button>
        </div>
        <button class="btn-test" style="width: 100%; margin-top: 10px; border-color: #334155; color: var(--text-main);" onclick="playSweep()">
            Frequency Sweep (Distortion Test)
        </button>
    </div>

    <div class="module-card">
        <div class="module-header">
            <span class="module-title">🎙️ Microphone Check</span>
            <span class="module-status" id="mic-status">Ready to Record</span>
        </div>
        <div class="mic-controls">
            <button class="btn-record" id="btn-rec" onclick="startMicTest()">HOLD TO REC</button>
            <button class="btn-play" id="btn-play" onclick="playRecording()">PLAYBACK</button>
        </div>
        <p style="font-size: 11px; color: var(--text-dim); margin-top: 10px; text-align: center;">
            Records for 3 seconds then stops automatically.
        </p>
    </div>

    <div class="module-card">
        <div class="module-header">
            <span class="module-title">💧 Water Eject Tool</span>
        </div>
        <button class="water-btn" onclick="startWaterEject()">
            <span>START EJECTION CYCLE</span>
        </button>
        <p style="font-size: 11px; color: var(--text-dim); margin-top: 10px;">
            Plays high-frequency impulse waves to push water out of grills.
        </p>
    </div>

</div>

<script>
    // --- AUDIO CONTEXT SETUP ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        // Wake up visualizer
        document.getElementById('visualizer-bars').style.opacity = '1';
        document.querySelector('.visualizer-box div:last-child').innerText = "Audio Engine Active";
    }

    // --- 1. STEREO & SWEEP TESTS ---
    function playTone(channel) {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const panner = audioCtx.createStereoPanner();

        osc.type = 'sine';
        osc.frequency.value = 440; // A4 Note
        
        // Set Pan (-1 is Left, 1 is Right)
        panner.pan.value = (channel === 'left') ? -1 : 1;

        osc.connect(gain);
        gain.connect(panner);
        panner.connect(audioCtx.destination);

        osc.start();
        
        // Fade out to avoid clicking sound
        gain.gain.setValueAtTime(1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.stop(audioCtx.currentTime + 0.5);
    }

    function playSweep() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime); // Start Low (Bass)
        osc.frequency.exponentialRampToValueAtTime(8000, audioCtx.currentTime + 2); // End High (Treble)

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 2);
    }


    // --- 2. MICROPHONE LOGIC ---
    let mediaRecorder;
    let audioChunks = [];
    let audioBlob;
    let audioUrl;

    async function startMicTest() {
        const btnRec = document.getElementById('btn-rec');
        const status = document.getElementById('mic-status');

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = event => {
                audioChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                audioUrl = URL.createObjectURL(audioBlob);
                document.getElementById('btn-play').classList.add('active');
                status.innerText = "Recording Saved";
                btnRec.innerText = "RECORD AGAIN";
                btnRec.style.opacity = "1";
            };

            mediaRecorder.start();
            btnRec.innerText = "RECORDING...";
            status.innerText = "Listening...";
            btnRec.style.opacity = "0.7";

            // Auto stop after 3 seconds
            setTimeout(() => {
                if(mediaRecorder.state === 'recording') mediaRecorder.stop();
            }, 3000);

        } catch(err) {
            alert("Microphone access denied. Please allow permissions in settings.");
        }
    }

    function playRecording() {
        if(!audioUrl) return;
        const audio = new Audio(audioUrl);
        audio.play();
        document.getElementById('mic-status').innerText = "Playing back...";
        audio.onended = () => {
             document.getElementById('mic-status').innerText = "Playback Complete";
        };
    }


    // --- 3. WATER EJECT PATTERN ---
    function startWaterEject() {
        initAudio();
        const status = document.querySelector('.module-card:last-child p');
        status.innerText = "RUNNING EJECTION CYCLE... (Keep Volume Max)";
        status.style.color = "var(--accent)";

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth'; // Sawtooth wave is "buzzier" / moves more air
        osc.frequency.value = 165; // The standard "eject" frequency

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        
        // Pulse volume to create "pushing" sensation
        const now = audioCtx.currentTime;
        gain.gain.setValueAtTime(1, now);
        gain.gain.setValueAtTime(0, now + 0.5);
        gain.gain.setValueAtTime(1, now + 1.0);
        gain.gain.setValueAtTime(0, now + 1.5);
        gain.gain.setValueAtTime(1, now + 2.0);
        
        osc.stop(now + 3);

        setTimeout(() => {
            status.innerText = "Cycle Complete.";
            status.style.color = "var(--text-dim)";
        }, 3000);
    }

</script>

</body>
</html>
